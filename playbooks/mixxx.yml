---
- name: Install Ubuntu Mixxx to localhost
  hosts: localhost
  gather_facts: true
  become: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Install Mixxx
      ansible.builtin.include_role:
        name: mixxx
        tasks_from: ubuntu-mixxx.yml
