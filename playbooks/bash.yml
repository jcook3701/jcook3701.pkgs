---
- name: Configure bash for localhost
  hosts: localhost
  gather_facts: true
  become: true
  tasks:

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Configure bash
      ansible.builtin.include_role:
        name: jcook3701.pkgs.bash
