---
- name: Install Debian Based Webmin to localhost
  hosts: localhost
  gather_facts: true
  become: true
  tasks:
    - name: Install Webmin
      ansible.builtin.include_role:
        name: pkg-install
        tasks_from: pkgs-server/webmin/debian-webmin.yml
