---
- name: Install Bind9 to localhost
  hosts: localhost
  gather_facts: true
  become: true
  tasks:
    - name: Bind9 install
      ansible.builtin.include_role:
        name: pkg-install
        tasks_from: pkgs-server/bind9/bind9-install.yml

