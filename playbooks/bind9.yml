---
- name: Install Bind9 to localhost
  hosts: localhost
  gather_facts: true
  become: true

  tasks:

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Bind9 install
      ansible.builtin.include_role:
        name: jcook3701.pkgs.bind9

