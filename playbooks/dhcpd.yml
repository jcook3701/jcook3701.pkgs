---
- name: Install dhcpd to localhost
  hosts: localhost
  gather_facts: true
  become: true

  tasks:

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Install dhcpd
      ansible.builtin.include_role:
        name: jcook3701.pkgs.dhcpd
