---
- name: Manage vagrant on localhost
  hosts: localhost
  gather_facts: true
  become: true

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Install vagrant
      vars:
        vagrant_enabled_boxes:
          - { server_vars: pxeboot-server.yml }

      ansible.builtin.include_role:
        name: jcook3701.pkgs.vagrant
