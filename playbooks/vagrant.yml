---
- name: Manage vagrant on localhost
  hosts: localhost
  gather_facts: true
  become: true

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Install vagrant
      ansible.builtin.include_role:
        name: jcook3701.pkgs.vagrant
      vars:
        vagrant_vm_name: "web-server-01"
        vagrant_memory_mb: 4096
        vagrant_provision_scripts:
          - "../scripts/bootstrap.sh"
