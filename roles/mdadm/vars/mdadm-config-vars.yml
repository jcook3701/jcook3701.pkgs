---
pkgs:
   apt: [mdadm]
   dnf: [mdadm]
   pacman: []

mdadm_directory:
   conf: "{{ mdadm_configuration_directory }}"
   fstab: "{{ fstab_configuration_directory }}"
   mount: "{{ mdadm_mount_directory }}"

mdadm_file:
   conf: "{{ mdadm_directory.conf }}/mdadm.conf"
   fstab: "{{ mdadm_directory.fstab }}/fstab"


mdadm_device: "md0"
