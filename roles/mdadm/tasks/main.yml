---
- name: Load mdadm OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Install mdadm
  ansible.builtin.include_tasks: install.yml
  when: mdadm_state | default('present') == 'present'

- name: Uninstall mdadm
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - mdadm_state | default('present') == 'absent'
    - mdadm_pkg_names[0] in ansible_facts.packages
