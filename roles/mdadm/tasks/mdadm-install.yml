---
- name: Import mdadm variables.
  ansible.builtin.include_tasks:
    file: mdadm-import-vars.yml

- name: Install mdadm package and dependencies.
  ansible.builtin.apt:
    name: "{{ mdadm_pkg_names }}"
    state: present
