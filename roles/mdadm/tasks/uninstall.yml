---
- name: Stop and disable mdadm service
  ansible.builtin.systemd:
    name: "{{ mdadm_service }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Uninstall mdadm package and dependencies.
  ansible.builtin.package:
    name: "{{ mdadm_pkg_names }}"
    state: absent
