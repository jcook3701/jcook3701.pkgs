---
- name: Load Xfce OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Install Xfce
  ansible.builtin.package:
    name: "{{ xfce_pkgs }}"
    state: present
