---
- name: Ensure Cloudflared package is uninstalled
  ansible.builtin.include_tasks: uninstall.yml

- name: Decommission Cloudflared Package Repositories via repo_add
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ cloudflared_os_repo_id | default('cloudflared') }}"
    repo_add_name: "{{ cloudflared_os_repo_name | default('Cloudflared PPA') }}"
    repo_add_state: "absent"
  when:
    - cloudflared_os_repo_id is defined
    - cloudflared_os_repo_id | length > 0
    - ansible_facts['distribution'] | lower == 'ubuntu'
