---
# "ubuntu/noble64" # (Ubuntu 24.04)
vagrant_vm_name: "default-workstation"
vagrant_box: "ubuntu/jammy64" # (Ubuntu 22.04)
vagrant_box_version: ">= 0"
vagrant_os_family: "ubuntu"
vagrant_memory_mb: 2048
vagrant_cpus: 1
vagrant_gui_enabled: true
vagrant_ip: "10.0.1.100"
vagrant_netmask: "255.0.0.0"
vagrant_network_type: "public_network"
vagrant_bridge: "enp8s0"
vagrant_build_dir: "{{ '/vagrant_builds/' + vagrant_vm_name }}"
vagrant_admin_user: "admin"
