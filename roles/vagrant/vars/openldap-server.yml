---
vagrant_vm_name: "openldap-server"
vagrant_box: "ubuntu/focal64"
vagrant_box_version: ">= 0"
vagrant_os_family: "ubuntu"
vagrant_memory_mb: 1024
vagrant_cpus: 1
vagrant_gui_enabled: false
vagrant_ip: "10.0.1.53"
vagrant_netmask: "255.0.0.0"
vagrant_network_type: "public_network"
vagrant_bridge: "enp8s0"
vagrant_build_dir: "{{ '/vagrant_builds/' + vagrant_vm_name }}"
vagrant_roles:
  - role: jcook3701.pkgs.openldap
    vars:
      openldap_hostname: "{{ vagrant_vm_name }}"
