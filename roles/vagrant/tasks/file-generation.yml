---
- name: Generate Vagrantfile from template
  ansible.builtin.template:
    src: Vagrantfile.j2
    dest: "{{ vagrant_build_dir }}/Vagrantfile"
    owner: "{{ sudo_user }}"
    group: "{{ sudo_user }}"
    mode: "0644"
  vars:
    vagrant_ansible_path: "{{ ansible_playbook_python | dirname }}/ansible-playbook"

- name: Generate the provision playbook for Vagrant
  ansible.builtin.copy:
    dest: "{{ vagrant_build_dir }}/provision.yml"
    content: |
      ---
      - hosts: all
        roles: {{ vagrant_roles }}
    owner: "{{ sudo_user }}"
    group: "{{ sudo_user }}"
    mode: "0644"
  when: vagrant_roles is defined and (vagrant_roles | length > 0)
