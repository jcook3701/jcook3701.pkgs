---
- name: Collect running user facts
  ansible.builtin.include_role:
    name: jcook3701.utils.general
    tasks_from: sudo_user_facts.yml
  when: sudo_user is not defined

- name: Load Vagrant OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install Vagrant
  ansible.builtin.include_tasks: install.yml
  when: vagrant_state | default('present') == 'present'

- name: Uninstall Vagrant
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - vagrant_state | default('present') == 'absent'
    - vagrant_pkg_names[0] in ansible_facts.packages
