---
vagrant_state: present

# Domain Configurations
vagrant_top_level_domain: "com"
vagrant_second_level_domain: "example"
vagrant_domain_name: "{{ vagrant_second_level_domain }}.{{ vagrant_top_level_domain }}"

# The selector: This is what you override in your playbook or env vars
# By default, it's empty so nothing happens by accident
vagrant_enabled_boxes: []
