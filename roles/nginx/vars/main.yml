---
nginx_sites_available_dir: /etc/nginx/sites-available
nginx_sites_enabled_dir: /etc/nginx/sites-enabled

# A master list of all sites your role knows how to build
nginx_sites:
  - { server_vars: default.yml }
  - { server_vars: pxeboot.yml }
  - { server_vars: plex.yml }
  - { server_vars: mixxx.yml }

nginx_main_config:
  user: www-data
  worker_processes: auto
  pid: /run/nginx.pid
  error_log: /var/log/nginx/error.log
  events:
    worker_connections: 768
    multi_accept: "off"
  http:
    sendfile: "on"
    tcp_nopush: "on"
    ssl_protocols: "TLSv1.2 TLSv1.3"
    gzip: "on"
    access_log: "/var/log/nginx/access.log"
