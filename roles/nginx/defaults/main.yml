---
nginx_state: present

nginx_top_level_domain: "com"
nginx_second_level_domain: "example"
nginx_domain_name: "{{ nginx_second_level_domain }}.{{ nginx_top_level_domain }}"

# The selector: This is what you override in your playbook or env vars
# By default, it's empty so nothing happens by accident
nginx_enabled_sites: []
