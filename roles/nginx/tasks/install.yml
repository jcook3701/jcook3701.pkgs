---
- name: Install NGINX from the default system repositories
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Ensure NGINX is started and enabled on boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
