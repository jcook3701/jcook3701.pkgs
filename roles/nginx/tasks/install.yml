---
- name: Install NGINX from the default system repositories
  ansible.builtin.package:
    name: "{{ nginx_pkg_names }}"
    state: present

- name: Ensure NGINX is started and enabled on boot
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true

- name: Configure NGINX sites and state
  ansible.builtin.import_tasks: configure.yml
