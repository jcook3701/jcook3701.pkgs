---
- name: Remove the default NGINX site configuration
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: "Create Nginx configuration file"
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "/etc/nginx/nginx.conf"
    mode: "0644"
  notify: Reload NGINX

- name: Generate configuration files for ALL potential sites
  ansible.builtin.include_tasks: create-site.yml
  loop: "{{ nginx_sites }}"
  loop_control:
    loop_var: site_item

- name: Deploy selected NGINX sites
  ansible.builtin.include_tasks: deploy-site.yml
  loop: >-
    {{
      nginx_sites | selectattr('server_vars', 'in', nginx_enabled_sites |
      map(attribute='server_vars') | list) | list
    }}
  loop_control:
    loop_var: site_item

- name: Remove symbolic links for sites that are NOT enabled
  ansible.builtin.include_tasks: remove-site.yml
  loop: >-
    {{
      nginx_sites | rejectattr('server_vars', 'in', nginx_enabled_sites |
      map(attribute='server_vars') | list) | list
    }}
  loop_control:
    loop_var: site_item
