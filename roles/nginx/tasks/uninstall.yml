---
- name: Stop and disable Nginx service
  ansible.builtin.systemd:
    name: "{{ nginx_service }}"
    state: stopped
    enabled: false
  failed_when: false

# TODO: Remove nginx configuration files.

- name: Uninstall Nginx package and dependencies.
  ansible.builtin.package:
    name: "{{ nginx_pkg_names }}"
    state: absent
