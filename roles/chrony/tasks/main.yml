---
- name: Load chrony OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Chrony NTP Install
  ansible.builtin.include_tasks: install.yml
  when: chrony_state | default('present') == 'present'

- name: Chrony NTP Uninstall
  ansible.builtin.include_tasks: uninstall.yml
  when: chrony_state | default('present') == 'absent'
