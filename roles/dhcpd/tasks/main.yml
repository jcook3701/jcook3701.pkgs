---
- name: Load DHCPD OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: DHCPD Install
  ansible.builtin.include_tasks: install.yml
  when: dhcpd_state | default('present') == 'present'

- name: DHCPD Uninstall
  ansible.builtin.include_tasks: uninstall.yml
  when: dhcpd_state | default('present') == 'absent'
