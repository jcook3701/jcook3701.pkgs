---
- name: Import dhcpd variables.
  ansible.builtin.include_tasks:
    file: dhcpd-import-vars.yml

- name: Install dhcpd package and dependencies.
  ansible.builtin.apt:
    name: "{{ dhcpd_pkg_names }}"
    state: present
