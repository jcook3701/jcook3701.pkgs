---
- name: Ensure LightDM service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ lightdm_service }}"
    state: stopped
    enabled: false

- name: Uninstall LightDM package and dependencies
  ansible.builtin.package:
    name: "{{ lightdm_pkg_names }}"
    state: absent
