---
- name: Load LightDM OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: LightDM Install
  ansible.builtin.include_tasks: install.yml
  when: lightdm_state | default('present') == 'present'

- name: LightDM Uninstall
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - lightdm_state | default('present') == 'absent'
    - lightdm_pkg_names[0] in ansible_facts.packages
