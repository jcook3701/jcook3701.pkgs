---
- name: Install DNF plugins core
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Add Docker repository via DNF
  community.general.dnf_config_manager:
    name: "{{ docker_ce_repo_url }}"
    state: enabled
