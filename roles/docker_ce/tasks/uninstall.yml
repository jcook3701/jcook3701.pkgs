---
- name: Ensure Docker service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ docker_service }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Uninstall Docker-CE
  ansible.builtin.package:
    name: "{{ docker_ce_pkgs + docker_ce_compose_pkgs }}"
    state: absent
