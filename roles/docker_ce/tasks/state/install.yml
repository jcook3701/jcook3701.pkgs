---
- name: Ensure removal of older Docker versions
  ansible.builtin.package:
    name: "{{ docker_ce_unofficial_pkg_names | default([]) }}"
    state: "absent"
  become: true

- name: Setup Docker Community Edition Package Repository
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ docker_ce_repo_id }}"
    repo_add_name: "{{ docker_ce_repo_name }}"
    repo_add_enabled: true
    # Debian Overrides (Passed cleanly when running on Debian nodes)
    repo_add_debian_uris: "{{ docker_ce_debian_uris | default(omit) }}"
    repo_add_debian_suites: "{{ docker_ce_debian_suites | default(omit) }}"
    repo_add_debian_components: "{{ docker_ce_debian_component | default(omit) }}"
    repo_add_debian_signed_by: "{{ docker_ce_debian_signed_by | default(omit) }}"
    # Red Hat Overrides
    repo_add_redhat_baseurl: "{{ docker_ce_redhat_baseurl | default(omit) }}"
    # Arch Linux Overrides
    repo_add_arch_server: "{{ docker_ce_arch_server | default(omit) }}"
  when: ansible_os_family in ['Debian', 'Redhat']

- name: Installing Docker Community Edition
  ansible.builtin.include_role:
    name: jcook3701.utils.pkg_manager
  vars:
    pkg_manager_pkgs: >-
      {{ docker_ce_dep_pkg_names | default([])
          + docker_ce_pkg_names | default([]) }}
    pkg_manager_state: present
    pkg_manager_update_cache: true

- name: Installing Docker Community Edition Compose Plugin
  ansible.builtin.package:
    name: "{{ docker_ce_compose_pkgs | default([]) }}"
    state: present
  become: true
  when: docker_ce_install_compose | bool

- name: Installing Docker Community Edition Buildx Plugin
  ansible.builtin.package:
    name: "{{ docker_ce_buildx_pkg_names | default([]) }}"
    state: present
  become: true
  when: docker_ce_install_buildx | bool

- name: Configure Docker Community Edition
  ansible.builtin.include_tasks: configure/main.yml
