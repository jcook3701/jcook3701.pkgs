---
- name: Execute Docker seeding tasks
  ansible.builtin.include_tasks: "01_seed.yml"

- name: Include Docker User Group Management Tasks
  ansible.builtin.include_tasks: "02_groups.yml"
  when: docker_ce_manage_group | default(true) | bool

- name: Execute Docker service seeding tasks
  ansible.builtin.include_tasks: "03_service.yml"
