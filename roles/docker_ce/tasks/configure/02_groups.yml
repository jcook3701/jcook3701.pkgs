---
- name: Ensure Docker group exists
  ansible.builtin.group:
    name: "{{ docker_ce_group | default('docker') }}"
    state: present
  become: true

- name: Add users to the Docker group
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: "{{ docker_ce_group | default('docker') }}"
    append: true
  loop: "{{ docker_ce_users | default([]) }}"
  loop_control:
    loop_var: user
    label: "Adding {{ user.name }} to {{ docker_ce_group }} group"
  become: true
  when:
    - user.name is defined
    - user.name | length > 0
