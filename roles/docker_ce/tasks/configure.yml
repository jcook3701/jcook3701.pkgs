---
- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add users in service_groups_users to docker group
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: docker
    append: true
  loop: "{{ docker_ce_users }}"
  loop_control:
    loop_var: user
    label: "{{ user.name }}"
  when: user.name is defined and user.name | length > 0
  notify: Restart docker
