---
docker_ce_deb_architecture:
  armv6l: "armhf"
  armv7l: "armhf"
  aarch64: "arm64"
  x86_64: "amd64"
  i386: "i386"

docker_ce_arch: "{{ docker_ce_deb_architecture[ansible_architecture] | default(ansible_architecture) }}"
docker_ce_codename: "{{ ansible_distribution_release }}"
docker_ce_idname: "{{ ansible_distribution | lower }}"
docker_ce_state: present

docker_ce_users:
  - name: "{{ ansible_user }}"
