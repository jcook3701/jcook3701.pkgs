---
- name: Setup MongoDB Package Repository
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ mongodb_repo_id }}"
    repo_add_name: "{{ mongodb_repo_name }}"
    repo_add_enabled: true
    # Debian Overrides (Passed cleanly when running on Debian nodes)
    repo_add_debian_uris: "{{ mongodb_debian_uris | default(omit) }}"
    repo_add_debian_suites: "{{ mongodb_debian_suites | default(omit) }}"
    repo_add_debian_components: "{{ mongodb_debian_component | default(omit) }}"
    repo_add_debian_signed_by: "{{ mongodb_debian_signed_by | default(omit) }}"
    # Red Hat Overrides
    repo_add_redhat_baseurl: "{{ mongodb_redhat_baseurl | default(omit) }}"
    # Arch Linux Overrides
    repo_add_arch_server: "{{ mongodb_arch_server | default(omit) }}"
  when: ansible_os_family in ['Debian', 'Redhat']

- name: Installing MongoDB
  ansible.builtin.include_role:
    name: jcook3701.utils.pkg_manager
  vars:
    pkg_manager_pkgs: >-
      {{ mongodb_dep_pkg_names | default([])
          + mongodb_pkg_names | default(['mongodb-org']) }}
    pkg_manager_state: present
    pkg_manager_update_cache: true

- name: Configure MongoDB
  ansible.builtin.include_tasks: configure/main.yml
