---
- name: Load MongoDB OS-specific variables
  ansible.builtin.include_vars: "{{ mongodb_vars }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: mongodb_vars
    label: "Loading variables file: {{ mongodb_vars }}"

- name: Ensure MongoDB is installed and configured
  ansible.builtin.include_tasks: state/install.yml
  when: mongodb_state | default('present') == 'present'

- name: Ensure MongoDB is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: mongodb_state | default('present') == 'absent'

- name: Teardown MongoDB, services, packages, and configuration files
  ansible.builtin.include_tasks: state/teardown.yml
  when: mongodb_state | default('present') == 'teardown'
