---
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart pulseaudio
  ansible.builtin.systemd:
    name: "{{ pulseaudio_service }}"
    scope: "{{ pulseaudio_systemd_scope }}"
    state: restarted
  become: "{{ pulseaudio_system_wide }}"
