---
- name: Ensure Pulse Audio service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ pulseaudio_service }}"
    state: stopped
    enabled: false

- name: Uninstall Pulse Audio package and dependencies
  ansible.builtin.package:
    name: "{{ pulseaudio_pkg_names }}"
    state: absent

