---
# Map Ansible system facts directly to upstream ctop asset naming nomenclature
ctop_architecture_map:
  x86_64: "amd64"
  aarch64: "arm64"
  armv7l: "arm"
  ppc64le: "ppc64le"

# Resolve the exact target package string based on the active host's hardware signature
ctop_pkg_name: "ctop-{{ ctop_version }}-linux-{{ ctop_architecture_map[ansible_architecture] | default('amd64') }}"

# Complete download link pointing directly to the specific architecture payload
ctop_bin_url: "{{ ctop_base_bin_url }}/{{ ctop_pkg_name }}"

ctop_directory:
  bin: "/usr/local/bin/"

ctop_file:
  bin: "{{ ctop_directory.bin }}/ctop"
