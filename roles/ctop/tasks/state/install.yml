---
- name: Install Ctop in local software bin directory
  ansible.builtin.get_url:
    url: "{{ ctop_bin_url | default('https://github.com/bcicen/ctop/releases/download/v0.7.7/ctop-0.7.7-linux-amd64') }}"
    dest: "{{ ctop_file.bin | default('/usr/local/bin/ctop') }}"
    mode: "0755"
    owner: root
    group: root
  become: true
