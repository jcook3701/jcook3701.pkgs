---
- name: Ensure ctop is installed
  ansible.builtin.include_tasks: state/install.yml
  when: ctop_state | default('present') == 'present'

- name: Ensure ctop is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: ctop_state | default('present') in ['absent', 'teardown']
