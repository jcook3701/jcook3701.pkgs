---
- name: Collect running user facts
  ansible.builtin.include_role:
    name: jcook3701.utils.general
    task_from: sudo_user_facts.yml
  when: sudo_user is not defined

- name: Include rust variables
  ansible.builtin.include_vars: rust.yml

- name: Installing rust
  ansible.builtin.apt:
    pkg:
      - rustc
      - cargo
    state: present

- name: Update .bashrc for rust
  ansible.builtin.blockinfile:
    dest: "{{ sudo_user_home }}/.bashrc"
    marker: "{{ rust_marker }}"
    block: "{{ rust_bashrc }}"
    state: present
  when: sudo_user != "root" and rust_bashrc is defined

- name: Reload Shell
  ansible.builtin.include_role:
    name: jcook3701.utils.general
    task_from: reload-shell.yml
