---
- name: Ensure Grafana service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ grafana_service }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Uninstall Grafana packages
  ansible.builtin.package:
    name: "{{ grafana_pkg_names }}"
    state: absent
