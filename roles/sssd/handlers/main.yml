---
- name: Restart SSSD Service
  ansible.builtin.systemd:
    name: "{{ sssd_service }}"
    state: restarted
  become: true

- name: Restart Systemd Logind Service
  ansible.builtin.systemd:
    name: "{{ sssd_systemd_login_service }}"
    state: restarted
  become: true
