---
- name: Re-create skeletal SSSD directory architecture with strict permissions
  ansible.builtin.file:
    path: "{{ directory.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ directory.mode }}"
  loop:
    - { path: "{{ sssd_directory.conf }}", mode: "0600" }
    - { path: "{{ sssd_directory.db }}", mode: "0700" }
    - { path: "{{ sssd_directory.mc }}", mode: "0700" }
    - { path: "{{ sssd_directory.pipes }}", mode: "0755" }
    - { path: "{{ sssd_directory.private_pipes }}", mode: "0700" }
    - { path: "{{ sssd_directory.log }}", mode: "0750" }
  loop_control:
    loop_var: directory
    label: "Creating directory: {{ directory.path }}"
  become: true

- name: Deploy System Security Services Daemon configuration file
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: "{{ sssd_file.conf | default('/etc/sssd/sssd.conf') }}"
    group: root
    owner: root
    mode: "0600"
  notify:
    - Restart SSSD Service
    - Restart Systemd Logind Service

- name: Deploy System Security Services Daemon default configuration file
  ansible.builtin.template:
    src: sssd.j2
    dest: "{{ sssd_file.default | default('/etc/default/sssd') }}"
    group: root
    owner: root
    mode: "0600"
  notify:
    - Restart SSSD Service
    - Restart Systemd Logind Service

- name: Ensure SSSD service is started and enable
  ansible.builtin.service:
    name: "{{ sssd_service | default('sssd') }}"
    state: started
    enabled: true
  become: true
