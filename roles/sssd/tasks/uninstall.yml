---
- name: Ensure SSSD service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ sssd_service }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Uninstall SSSD package and dependencies.
  ansible.builtin.package:
    name: "{{ sssd_pkgs }}"
    state: absent
