---
- name: Populate service facts
  ansible.builtin.service_facts:

- name: Ensure NSCD (name service cache daemon) service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ sssd_nscd_service }}"
    state: stopped
    enabled: false
  when: "'nscd.service' in ansible_facts.services"

- name: Install SSSD package and dependencies.
  ansible.builtin.package:
    name: "{{ sssd_pkg_names }}"
    state: present

- name: Generate sssd.conf configuration file
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: "{{ sssd_file.sssd_conf }}"
    group: root
    owner: root
    mode: "0600"
  notify: Restart sssd

- name: Ensure SSSD service is started and enabled
  ansible.builtin.systemd:
    name: "{{ sssd_service }}"
    state: started
    enabled: true
