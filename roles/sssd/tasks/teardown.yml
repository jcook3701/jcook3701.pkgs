---
- name: Force stop the SSSD daemon service natively
  ansible.builtin.systemd:
    name: "{{ sssd_service }}"
    state: stopped
    enabled: false
  failed_when: false
  become: true

- name: Revert system PAM and NSS configuration hooks to standard local profiles
  ansible.builtin.command: "pam-auth-update --package --remove sss"
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: pam_remove_cmd
  changed_when: pam_remove_cmd.rc == 0
  failed_when: false
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Locate all leftover cache files and unix domain sockets dynamically
  ansible.builtin.find:
    paths:
      - "{{ sssd_os_directory.db }}"
      - "{{ sssd_os_directory.pipes }}"
    file_type: any
    recurse: true
    hidden: true
  register: found_sssd_artifacts
  become: true

- name: Wipe all discovered orphan cache files and active sockets completely
  ansible.builtin.file:
    path: "{{ file.path }}"
    state: absent
  loop: "{{ found_sssd_artifacts.files }}"
  loop_control:
    loop_var: file
    label: "Purging artifact row: {{ file.path }}"
  become: true

- name: Wipe local memory-cached client mapping layers
  ansible.builtin.file:
    path: "{{ sssd_os_directory.mc }}"
    state: absent
  become: true

- name: Purge SSSD text configuration files from filesystem
  ansible.builtin.file:
    path: "{{ sssd_file.sssd_conf }}"
    state: absent
  become: true

- name: Uninstall SSSD package and dependencies.
  ansible.builtin.package:
    name: "{{ sssd_pkg_names }}"
    state: absent
  become: true

- name: Kick active system login services to register the auth profile removal
  ansible.builtin.systemd:
    name: systemd-logind
    state: restarted
  failed_when: false
  become: true
