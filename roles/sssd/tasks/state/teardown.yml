---
- name: Gather active target systemd service units
  ansible.builtin.service_facts:
  become: true

- name: Force stop the SSSD daemon service natively
  ansible.builtin.service:
    name: "{{ sssd_service | default('sssd') }}"
    state: stopped
    enabled: false
  become: true
  when: (sssd_service ~ '.service' in ansible_facts.services)

- name: Revert system PAM and NSS configuration hooks to standard local profiles
  ansible.builtin.command: "pam-auth-update --package --remove sss"
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: pam_remove_cmd
  changed_when: pam_remove_cmd.rc == 0
  failed_when: false
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Revert system PAM and NSS hooks to local profiles via authselect (RedHat)
  ansible.builtin.command: "authselect select minimal --force"
  register: authselect_remove_cmd
  changed_when: authselect_remove_cmd.rc == 0
  failed_when: false
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Force deep purge of SSSD packages
  ansible.builtin.include_role:
    name: jcook3701.utils.pkg_manager
  vars:
    pkg_manager_pkgs: "{{ sssd_pkg_names | default([]) }}"
    pkg_manager_state: absent
    pkg_manager_remove_level: complete

- name: Locate all leftover cache files and unix domain sockets dynamically
  ansible.builtin.find:
    paths:
      - "{{ sssd_directory.db }}"
      - "{{ sssd_directory.pipes }}"
    file_type: any
    recurse: true
    hidden: true
  register: found_sssd_artifacts
  become: true

- name: Wipe all discovered orphan cache files and active sockets completely
  ansible.builtin.file:
    path: "{{ file.path }}"
    state: absent
  loop: "{{ found_sssd_artifacts.files }}"
  loop_control:
    loop_var: file
    label: "Purging artifact row: {{ file.path }}"
  become: true

- name: Wipe local memory-cached client mapping layers
  ansible.builtin.file:
    path: "{{ sssd_directory.mc }}"
    state: absent
  become: true

- name: Purge SSSD text configuration files from filesystem
  ansible.builtin.file:
    path: "{{ sssd_file.conf }}"
    state: absent
  become: true

- name: Kick active system login services to register the auth profile removal
  ansible.builtin.systemd:
    name: systemd-logind
    state: restarted
  failed_when: false
  become: true
