---
- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Load SSSD OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Install SSSD packages
  ansible.builtin.include_tasks: install.yml
  when: sssd_state | default('present') == 'present'

- name: Uninstall SSSD packages
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - sssd_state | default('present') == 'absent'
    - ansible_facts.packages is defined
    - sssd_pkg_names[0] in ansible_facts.packages

- name: Teardown SSSD
  ansible.builtin.include_tasks: teardown.yml
  when:
    - sssd_state | default('present') == 'teardown'
