---
- name: Load Visual Studio Code OS-specific variables
  ansible.builtin.include_vars: "{{ code_vars }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: code_vars
    label: "Loading variables file: {{ code_vars }}"

- name: Ensure Visual Studio Code is installed and configured
  ansible.builtin.include_tasks: state/install.yml
  when: code_state | default('present') == 'present'

- name: Ensure Visual Studio Code is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: code_state | default('present') == 'absent'

- name: Ensure complete teardown Visual Studio Code package and configuration files
  ansible.builtin.include_tasks: state/teardown.yml
  when: code_state | default('present') == 'teardown'
