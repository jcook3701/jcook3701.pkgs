---
- name: Setup Visual Studio Code Package Repository
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ code_repo_id }}"
    repo_add_name: "{{ code_repo_name }}"
    repo_add_enabled: true
    # Debian Overrides (Passed cleanly when running on Debian nodes)
    repo_add_debian_uris: "{{ code_debian_uris | default(omit) }}"
    repo_add_debian_suites: "{{ code_debian_suites | default(omit) }}"
    repo_add_debian_components: "{{ code_debian_component | default(omit) }}"
    repo_add_debian_signed_by: "{{ code_debian_signed_by | default(omit) }}"
    # Red Hat Overrides
    repo_add_redhat_baseurl: "{{ code_redhat_baseurl | default(omit) }}"
    # Arch Linux Overrides
    repo_add_arch_server: "{{ code_arch_server | default(omit) }}"
  when: ansible_os_family in ['Debian', 'Redhat']

- name: Installing Visual Studio Code
  ansible.builtin.include_role:
    name: jcook3701.utils.pkg_manager
  vars:
    pkg_manager_pkgs: >-
      {{ code_dep_pkg_names | default([])
          + code_pkg_names | default(['code']) }}
    pkg_manager_state: present
    pkg_manager_update_cache: true

- name: Configure Visual Studio Code
  ansible.builtin.include_tasks: configure/main.yml
