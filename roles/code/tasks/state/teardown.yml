---
- name: Ensure Visual Studio Code package is purged
  ansible.builtin.include_tasks: uninstall.yml

- name: Decommission Visual Studio Code Package Repositories via repo_add
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ code_repo_id }}"
    repo_add_name: "{{ code_repo_name }}"
    repo_add_state: "absent"
  when:
    - code_repo_id is defined
    - code_repo_id | length > 0
    - ansible_os_family in ['Debian', 'RedHat']
