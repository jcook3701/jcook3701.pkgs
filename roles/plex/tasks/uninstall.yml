---
- name: Ensure Plex service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ plex_service }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Uninstall Plex packages
  ansible.builtin.package:
    name: "{{ plex_pkg_names }}"
    state: absent
