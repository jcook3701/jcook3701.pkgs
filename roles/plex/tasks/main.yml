---
- name: Load Plex OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Prepare Plex repositories for {{ ansible_distribution }}
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - "repo-{{ ansible_os_family | lower }}.yml"
    - "repo-default.yml"
  when:
    - ansible_os_family in ['Debian']
    - plex_state | default('present') == 'present'

- name: Plex Install
  ansible.builtin.include_tasks: install.yml
  when: plex_state | default('present') == 'present'

- name: Plex Uninstall
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - plex_state | default('present') == 'absent'
    - plex_pkg_names[0] in ansible_facts.packages
