---
# Control switches
samba_state: present
samba_is_server: false
samba_is_file_server: false

# Options: "nt4" (Classic PDC with OpenLDAP) or "addc" (Active Directory DC)
samba_deployment_mode: "addc"

# Domain and Architecture Identification
samba_top_level_domain: "com"
samba_second_level_domain: "example"
samba_domain_name: "{{ samba_second_level_domain }}.{{ samba_top_level_domain }}"

samba_workgroup: "{{ samba_second_level_domain | upper }}"
samba_addc_realm: "{{ samba_domain_name | upper }}"

# Server Naming & Identification
samba_netbios_name: "{{ ansible_hostname | default(inventory_hostname_short) | upper }}"

# Networking & Interface Binding
samba_bind_interfaces_only: "yes"
samba_interfaces: "lo {{ ansible_default_ipv4.interface | default('eth0') }}"
samba_port: "445"

# NT4 Classic Legacy Services Configuration
samba_wins_support: "yes"
samba_domain_logons: "yes"
samba_domain_master: "yes"
samba_local_master: "yes"
samba_preferred_master: "yes"
samba_os_level: "65"

# NT4 Classic Legacy Directory Backend Integration
samba_ldap_proto: "ldaps"
samba_ldap_host: "ldap.internal.net"
samba_ldap_port: "636"
samba_passdb_backend: "ldapsam:{{ samba_ldap_proto }}://{{ samba_ldap_host }}:{{ samba_ldap_port }}"

# NT4 Classic Legacy OpenLDAP Schema Offsets
samba_ldap_suffix: "dc={{ samba_second_level_domain }},dc={{ samba_top_level_domain }}"
samba_ldap_user_suffix: "ou=People"
samba_ldap_group_suffix: "ou=Group"
samba_ldap_machine_suffix: "ou=Computers"
samba_ldap_idmap_suffix: "ou=Idmap"
samba_ldap_admin_dn: "cn=admin,{{ samba_ldap_suffix }}"
samba_ldap_secret: ""

# NT4 Classic Legacy Identity Mapping (IDMAP) Real Estate Engine
samba_idmap_backend: "tdb"
samba_idmap_range_low: "10000"
samba_idmap_range_high: "99999"

# Active Directory Domain Controller Specific Engine
samba_addc_dns_backend: "SAMBA_INTERNAL"
samba_dns_forwarders:
  - "1.1.1.1"
  - "8.8.8.8"

samba_primary_dc: "localhost"
samba_additional_dcs: []

# Protocol Security Engine
samba_server_signing: "mandatory"
samba_smb_encrypt: "mandatory"
samba_server_min_protocol: "SMB2_10"
samba_server_max_protocol: "SMB3"
samba_client_min_protocol: "SMB2_10"
samba_client_max_protocol: "SMB3"

# Administrative Credentials
samba_admin_user: "samba-admin"
samba_admin_password: "SecretPassword123"

# Storage Allocation Schemas
samba_homes_base_dir: "/home/samba/profiles"

# Active Directory Core Databases Provisioning Targets
samba_addc_provision_groups:
  - name: "Domain Users"
    description: "All corporate domain users"
  - name: "Domain Admins"
    description: "Domain administrative accounts"

# Domain Management Accounts
samba_addc_provision_users:
  - username: "example-admin"
    firstname: "Example"
    lastname: "Admin"
    description: "Primary Infrastructure Administrator Account"
    title: "Systems Architect"
    company: "Example Enterprises"
    mail: "example-admin@example.com"
    uid: 5001
    gid: 5001
    primary_group: "domain admins"
    password: "SamplePassword123!"
    groups: ["Domain Admins", "Domain Users"]
    is_sudoer: true
    login_shell: "/bin/bash"
    home_directory: "/home/example-admin"
    password_must_change: false
    account_disabled: false
    ssh_public_keys: []

# File shares and client mounts
samba_shares: []
# Example structure for samba_shares:
# - name: "media"
#   path: "/srv/samba/media"
#   valid_users: "shareuser"
#   read_only: "no"
#   guest_ok: "no"

# Client Configuration Defaults
samba_client_mounts: []
# Example structure for samba_client_mounts:
# - src: "//smbserver.internal.net/media"
#   path: "/mnt/remote-media"
#   username: "domainuser"
#   password: "vaulted_secret_password"
#   owner_uid: "mediauser"
#   owner_gid: "mediagroup"
