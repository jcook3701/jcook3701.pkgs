---
# Domain Options
samba_domain_name: "{{ samba_second_level_domain }}.{{ samba_top_level_domain }}"

samba_directory:
  conf: "{{ samba_os_directory.conf }}"
  spool: "{{ samba_os_directory.spool }}"
  log: "{{ samba_os_directory.log }}"
  lib: "{{ samba_os_directory.lib }}"
  cache: "{{ samba_os_directory.cache }}"
  run: "{{ samba_os_directory.run }}"
  assets: "{{ samba_os_directory.assets }}"

samba_file:
  samba_conf: "{{ samba_directory.conf }}/smb.conf"
