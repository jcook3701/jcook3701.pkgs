---
samba_pkg_names:
  - samba

# Domain Options
top_level_domain: "com"
second_level_domain: "jcook3701"
domain_name: "{{ second_level_domain }}.{{ top_level_domain }}"

samba_directory:
  conf: "/etc/samba"

samba_file:
  samba_conf: "{{ samba_directory.conf }}/smb.conf"


samba_conf:
  - name: global
    workgroup: "JCOOK3701"
    netbiosname: "MODERN-TIMES"
    wins support: yes
    # winbind enum users = Yes
    # winbind enum groups = Yes
    # winbind use default domain = Yes
    domain logons: yes

    # security = user
    unix extensions: no

    # Cups Print Server Setup
    load printers: yes
    printing: "cups"
    printcap name: "cups"
    cups options: "raw"

    # Log File Settings
    log file: "/var/log/samba/log.%m"
    max log size: 50
    # idmap config * : backend = tdb
    # idmap config * : range = 1000000-1999999

    # LDAP Settings
    Domain master: Yes
    ldap suffix: "dc={{ second_level_domain }},dc={{ top_level_domain }}"
    ldap user suffix: "ou=Group"
    ldap group suffix: "ou=People"
    ldap machine suffix: "ou=Computers"
    ldap idmap suffix: "ou=Idmap"
    ldap admin dn: "cn=samba-admin, dc={{ second_level_domain }}, dc={{ top_level_domain }}"
    ldap delete dn: no
    ldap ssl: no
    # unix password sync = Yes

    passdb backend: "ldapsam:ldaps://modern-times.{{ domain_name }}:636"

    # ldapsam:trusted = yes
    # ldapsam:editposix = yes

    # For security
    server signing: "mandatory"
    smb encrypt: "mandatory"
    client min protocol: "smb3"
    client max protocol: "smb3"

    add user script: "/usr/sbin/smbldap-useradd -m '%u' -t 1"
    rename user script: "/usr/sbin/smbldap-usermod -r '%unew' '%uold'"
    delete user script: "/usr/sbin/smbldap-userdel '%u'"
    set primary group script: "/usr/sbin/smbldap-usermod -g '%g' '%u'"
    add group script: "/usr/sbin/smbldap-groupadd -p '%g'"
    delete group script: "/usr/sbin/smbldap-groupdel '%g'"
    add user to group script: "/usr/sbin/smbldap-groupmod -m '%u' '%g'"
    delete user from group script: "/usr/sbin/smbldap-groupmod -x '%u' '%g'"
    add machine script: "/usr/sbin/smbldap-useradd -w '%u' -t 1"

  - name: homes
    comment: "Home Directories"
    path: "/media/raid10/samba_shares/samba_home_directories/%S"
    valid users: '%S, %D%w%S, @"JCOOK3701\Domain Users"'
    browseable: No
    read only: No
    writable: Yes
    inherit acls: Yes
    follow symlinks: Yes
    wide links: Yes

    # File Permissions
    force user: "%S"
    force group: "Domain Users"
    create mask: 0660
    force create mode: 0660
    force directory mode: 0770

  - name: printers
    comment: "All Printers"
    path: "/var/spool/samba"
    create mask: 0600
    browseable: Yes
    writable: Yes
    printable: Yes

  - name: print$
    comment: "Printer Drivers"
    path: "/var/lib/samba/drivers"
    writable: Yes
    write list: "@printadmin root"
    force group: "@printadmin"
    create mask: 0664
    directory mask: 0775

  - name: plex_media
    comment: "Plex Network Share"
    path: "/media/raid10/plexmedia"
    public: No
    valid users: '@JCOOK3701\Domain Users'
    force group: "plex"
    force user: "plex"
    read only: No
    writable: Yes
    browsable: Yes

    # File Permissions
    create mask: 0660
    force create mode: 0660
    force directory mode: 0770

  - name: backup_share
    comment: "Backup Network Share"
    path: "/media/raid10/samba_shares/samba_backup_share"
    public: No
    valid users: '@JCOOK3701\Domain Users'
    force group: "Domain Users"
    force user: "samba-user"
    read only: No
    writable: Yes
    browsable: Yes

    # File Permissions
    create mask: 0660
    force create mode: 0660
    force directory mode: 0770
