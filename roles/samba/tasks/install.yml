---
- name: Install Samba package and dependencies.
  ansible.builtin.package:
    name: "{{ samba_pkg_names }}"
    state: present

- name: Initial Samba configuration
  ansible.builtin.include_tasks: configure/main.yml

- name: Execute Samba Server configuration
  ansible.builtin.include_tasks: mode/server.yml
  when: samba_is_server | bool

- name: Execute Samba Client configuration
  ansible.builtin.include_tasks: mode/client.yml
  when:
    - samba_client_mounts | length > 0
