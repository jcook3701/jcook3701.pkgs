---
- name: Install Samba package and dependencies.
  ansible.builtin.package:
    name: >-
      {{ samba_pkg_names +
        (samba_is_server | bool | ternary([], samba_client_dep_pkg_names)) }}
    state: present

- name: Enforce external SSSD infrastructure pre-requisites
  ansible.builtin.fail:
    msg: >-
      Deployment failed: 'samba_deployment_mode' is set to 'member_sssd', but the 'sssd'
      package was not detected on this host. Please ensure your central SSSD role runs
      and configures the system identities before executing the Samba deployment.
  when:
    - samba_is_server | bool
    - samba_deployment_mode == 'member_sssd'
    - ansible_facts.packages is defined
    - ansible_facts.packages['sssd'] is not defined

- name: Initial Samba configuration
  ansible.builtin.include_tasks: configure/main.yml
