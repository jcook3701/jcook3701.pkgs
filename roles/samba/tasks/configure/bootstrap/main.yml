---
- name: Ensure Samba group exists
  ansible.builtin.include_tasks: groups.yml
  when: samba_is_server | bool

- name: Execute Samba user provisioning engine
  ansible.builtin.include_tasks: admin-user.yml
  when: samba_is_server | bool
