---
- name: Securely generate credentials files for mounts
  ansible.builtin.copy:
    dest: "{{ creds_file }}"
    content: |
      username={{ mount.username }}
      password={{ mount.password }}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  vars:
    mount_name: "{{ mount.name | default('default') }}"
    creds_file: "{{ samba_directory.conf }}/.creds-{{ mount_name }}"
  loop: "{{ samba_client_mounts }}"
  loop_control:
    loop_var: mount
    label: "Mount -> {{ mount.name | default('default') }}"

- name: Create local mounting endpoints
  ansible.builtin.file:
    path: "{{ mount.path }}"
    state: directory
    owner: "{{ mount_uid }}"
    group: "{{ mount_gid }}"
    mode: "0755"
  vars:
    mount_uid: "{{ mount.owner_uid | default('root') }}"
    mount_gid: "{{ mount.owner_gid | default('root') }}"
  loop: "{{ samba_client_mounts }}"
  loop_control:
    loop_var: mount
    label: "Mount -> {{ mount.name | default('default') }}"

- name: Bind remote shares to filesystem table natively
  ansible.posix.mount:
    path: "{{ mount.path }}"
    src: "{{ mount.src }}"
    fstype: cifs
    opts: "{{ mount_options }}"
    state: mounted
  vars:
    mount_name: "{{ mount.name | default('default') }}"
    creds_file: "{{ samba_directory.conf }}/.creds-{{ mount_name }}"
    mount_uid: "{{ mount.owner_uid | default('root') }}"
    mount_gid: "{{ mount.owner_gid | default('root') }}"
    mount_options: >-
      credentials={{ creds_file }},
      iocharset=utf8,
      uid={{ mount_uid }},
      gid={{ mount_gid }},
      file_mode=0755,
      dir_mode=0755
  loop: "{{ samba_client_mounts }}"
  loop_control:
    loop_var: mount
    label: "Mount -> {{ mount.name | default('default') }}"
