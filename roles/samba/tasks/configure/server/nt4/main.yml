---
- name: Check for existing passdb backend file initialization
  ansible.builtin.stat:
    path: "{{ samba_directory.lib }}/private/secrets.tdb"
  register: _samba_nt4_secrets_stat

- name: Store OpenLDAP administrative secret in Samba database vault
  ansible.builtin.command: >
    net idmap set secret "{{ samba_ldap_admin_dn }}" "{{ samba_ldap_secret }}"
  register: _samba_ldap_secret_set
  no_log: true
  when: not _samba_nt4_secrets_stat.stat.exists
  failed_when: >
    (_samba_ldap_secret_set.rc != 0) or
    ('failed' in _samba_ldap_secret_set.stdout | lower) or
    ('error' in _samba_ldap_secret_set.stderr | lower)

- name: Deploy Samba server configuration
  ansible.builtin.template:
    src: smb.conf.j2
    dest: "{{ samba_file.samba_conf }}"
    owner: root
    group: root
    mode: "0644"
  register: _samba_nt4_config_state

- name: Execute directory synchronization and account provisioning engine
  ansible.builtin.include_tasks: directory.yml
  when: samba_deployment_mode == 'nt4'

- name: Ensure Samba services are running and enabled
  ansible.builtin.systemd:
    name: "{{ service }}"
    state: "{{ smb_state }}"
    enabled: true
  vars:
    smb_state: "{{ (_samba_nt4_config_state.changed) | ternary('restarted', 'started') }}"
  loop: "{{ samba_service }}"
  loop_control:
    loop_var: service
    label: "Service status: {{ service }} -> state: {{ smb_state }}"
