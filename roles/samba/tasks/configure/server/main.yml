---
- name: Ensure the OS-specific Samba user group exists
  ansible.builtin.group:
    name: "{{ samba_group }}"
    state: present
    system: true

- name: Ensure shared storage directories exist
  ansible.builtin.file:
    path: "{{ share.path }}"
    state: directory
    owner: "{{ share.force_user | default(samba_admin_user) | trim }}"
    group: "{{ share.force_group | default(samba_group) | trim }}"
    mode: "{{ share.force_directory_mode | default('0775') }}"
  loop: "{{ samba_shares }}"
  loop_control:
    loop_var: share
    label: "Share path exists: {{ share.path }} -> owner: {{ share.force_user | default(samba_admin_user) }}"

- name: Execute Modern Active Directory Domain Controller Engine branch
  ansible.builtin.include_tasks: addc/main.yml
  when: samba_deployment_mode == "addc"

- name: Execute Modern Active Directory Server Member System Engine branch
  ansible.builtin.include_tasks: ads_member/main.yml
  when: samba_deployment_mode == "ads_member"

- name: Execute Classic NT4 Primary Domain Controller Engine branch
  ansible.builtin.include_tasks: nt4/main.yml
  when: samba_deployment_mode == "nt4_pdc"

- name: Execute Classic NT4 Server Member Engine branch
  ansible.builtin.include_tasks: nt4/main.yml
  when: samba_deployment_mode == "nt4_member"

