---
- name: Stop Samba service cleanly
  ansible.builtin.service:
    name: "{{ samba_service }}"
    state: stopped
  failed_when: false

- name: Uninstall Samba package and dependencies.
  ansible.builtin.package:
    name: "{{ samba_pkg_names }}"
    state: absent
