---
- name: Install Samba
  ansible.builtin.include_tasks:
    file: install.yml
  when: samba_state | default('present') == 'present'

- name: Uninstall Samba
  ansible.builtin.include_tasks:
    file: uninstall.yml
  when: samba_state | default('present') == 'absent'
