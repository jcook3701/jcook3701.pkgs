---
- name: Import Samba variables.
  ansible.builtin.include_tasks:
    file: samba-import-vars.yml

- name: Install Samba package and dependencies.
  ansible.builtin.apt:
    name: "{{ samba_pkg_names }}"
    state: present

- name: Backup initial Samba configuration files
  ansible.builtin.include_tasks:
    file: samba-file-backup.yml

- name: Create Samba configuration files
  ansible.builtin.include_tasks:
    file: samba-file-generation.yml
