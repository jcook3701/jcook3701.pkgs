---
- name: Ensure Cockpit service is stopped and disabled
  ansible.builtin.service:
    name: "{{ cockpit_socket | default('cockpit.socket') }}"
    state: stopped
    enabled: false
  failed_when: false
  when: cockpit_node_type == 'client'

- name: Uninstall Cockpit package
  ansible.builtin.package:
    name: "{{ cockpit_pkg_names | default([]) }}"
    state: absent
  become: true
  when: cockpit_pkg_names | length > 0
