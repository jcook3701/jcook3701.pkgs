---
- name: Ensure Firewalld service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ firewalld_service }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Uninstall Firewalld package and dependencies.
  ansible.builtin.package:
    name: "{{ firewalld_pkg_names }}"
    state: absent
