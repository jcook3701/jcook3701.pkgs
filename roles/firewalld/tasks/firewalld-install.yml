---
- name: Import firewalld variables.
  ansible.builtin.include_tasks:
    file: firewalld-import-vars.yml

- name: Install firewalld package and dependencies.
  ansible.builtin.apt:
    name: "{{ firewalld_pkg_names }}"
    state: present
