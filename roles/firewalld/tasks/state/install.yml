---
- name: Install Firewalld package and dependencies
  ansible.builtin.package:
    name: "{{ firewalld_dep_pkg_names | default([])
                + firewalld_pkg_names | default([]) }}"
    state: present
  become: true

- name: Ensure Firewalld is configured
  ansible.builtin.include_tasks: configure/main.yml
