---
firewalld_service: "{{ firewalld_os_service | default('firewalld') }}"

firewalld_dep_pkg_names: "{{ firewalld_os_dep_pkg_names  | default([]) }}"
firewalld_pkg_names: "{{ firewalld_os_pkg_names | default(['firewalld']) }}"

firewalld_directory:
  conf: "{{ firewalld_os_directory.conf | default('/etc/firewalld') }}"
  services: "{{ firewalld_os_directory.services | default('/etc/firewalld/services') }}"

firewalld_file:
  conf: "{{ firewalld_directory.conf }}/"

firewalld_native_services:
  - dns
  - dhcp
  - ntp
  - ldap
  - ldaps
  - samba
  - ftp
  - http
  - https
  - ipp
  - ssh
  - openvpn
