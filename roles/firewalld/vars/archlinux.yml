---
# The primary systemd execution unit name
firewalld_os_service: "firewalld"

# Required platform dependencies (the Python bindings are critical for Ansible's firewalld module)
firewalld_os_dep_pkg_names:
  - "python3-firewalld"

# Main engine package names to retrieve via dnf/pacman
firewalld_os_pkg_names:
  - "firewalld"

# Filesystem layout directories for configuration tracking
firewalld_os_directory:
  conf: "/etc/firewalld"
  services: "/etc/firewalld/services"
