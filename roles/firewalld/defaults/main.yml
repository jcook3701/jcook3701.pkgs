---
firewalld_state: present

firewalld_zones:
  public:
    services:
      - ssh
      - http
      - https
    ports:
      - "8443/tcp"
    masquerade: "no"

  internal:
    services:
      - dhcp
      - dns
    sources:
      - "192.168.1.0/24"
