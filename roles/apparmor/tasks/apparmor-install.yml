---
- name: Import AppArmor variables
  ansible.builtin.include_tasks:
    file: apparmor-import-vars.yml

- name: Install AppArmor package and dependencies
  ansible.builtin.apt:
    name: "{{ apparmor_pkg_names }}"
    state: present

- name: Backup initial AppArmor configuration files
  ansible.builtin.include_tasks:
    file: apparmor-file-backup.yml

- name: Create AppArmor configuration files
  ansible.builtin.include_tasks:
    file: apparmor-file-generation.yml
