---
- name: Install Prometheus
  ansible.builtin.package:
    name: "{{ prometheus_pkg_names }}"
    state: present

- name: Ensure Prometheus service is started and enabled
  ansible.builtin.systemd:
    name: "{{ prometheus_service }}"
    state: started
    enabled: true

