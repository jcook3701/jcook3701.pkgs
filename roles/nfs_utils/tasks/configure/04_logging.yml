---
- name: Ensure base NFS logging directory exists
  ansible.builtin.file:
    path: "{{ nfs_utils_directory.log | default('/var/log/nfs') }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Enable NFS kernel debugging natively
  ansible.builtin.sysctl:
    name: sunrpc.nfsd_debug
    value: '0x7fff'
    state: present
    reload: true
  become: true
  when: nfs_utils_is_server | bool

- name: Enable NFS client-side kernel debugging
  ansible.builtin.sysctl:
    name: sunrpc.nfs_debug
    value: '0x7fff'
    state: present
    reload: true
  become: true
  when: nfs_utils_is_client | bool

- name: Deploy NFS rsyslog configuration on server
  ansible.builtin.template:
    src: nfs-rsyslog.conf.j2
    dest: /etc/rsyslog.d/30-nfs.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: nfs_utils_is_server | bool

- name: Deploy NFS rsyslog configuration on client
  ansible.builtin.template:
    src: nfs-rsyslog.conf.j2
    dest: /etc/rsyslog.d/30-nfs.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: nfs_utils_is_client | bool

- name: Gather active target systemd service units
  ansible.builtin.service_facts:
  become: true

- name: Restart rsyslog
  ansible.builtin.service:
    name: "{{ nfs_utils_rsyslog_service | default('rsyslog') }}"
    state: restarted
  become: true
  when: (nfs_utils_rsyslog_service ~ '.service' in ansible_facts.services)
