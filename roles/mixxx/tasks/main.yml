---
- name: Load Mixxx OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
        - "{{ ansible_distribution | lower }}.yml"
        - "{{ ansible_os_family | lower }}.yml"
        - "default.yml"

- name: Prepare repositories for {{ ansible_distribution }}
  ansible.builtin.include_tasks: "repo-{{ ansible_distribution | lower }}.yml"
  # Arch doesn't need repo prep, so we skip it
  when: ansible_distribution in ['Ubuntu'] # , 'Debian', 'RedHat'

- name: Install Mixxx
  ansible.builtin.include_tasks: install.yml

- name: Configure Mixxx
  ansible.builtin.include_tasks: configure.yml
