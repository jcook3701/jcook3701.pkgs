---
- name: Ensure Kubectl package is uninstalled
  ansible.builtin.include_tasks: uninstall.yml

- name: Decommission Kubectl Package Repositories via repo_add
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ kubectl_os_repo_id | default('kubectl') }}"
    repo_add_name: "{{ kubectl_os_repo_name | default('Kubectl PPA') }}"
    repo_add_state: "absent"
  when:
    - kubectl_os_repo_id is defined
    - kubectl_os_repo_id | length > 0
    - ansible_facts['distribution'] | lower == 'ubuntu'
