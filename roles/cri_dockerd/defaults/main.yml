---
# Lifecycle & Debug Management
cri_dockerd_state: present
cri_dockerd_debug: true

# Package Configuration
cri_dockerd_version: "0.4.10"
cri_dockerd_package_revision: "3-0"
cri_dockerd_download_url: "https://github.com/Mirantis/cri-dockerd/releases/download"
cri_dockerd_package_cache_dir: "/var/cache/cri-dockerd"
cri_dockerd_package_checksum: ""

# Service Management
cri_dockerd_manage_service: true
cri_dockerd_service: "cri-docker.socket"
cri_dockerd_service_enabled: true
cri_dockerd_service_state: started
