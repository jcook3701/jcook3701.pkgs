---
- name: Ensure cri-dockerd socket is configured
  ansible.builtin.systemd_service:
    name: "{{ cri_dockerd_service }}"
    enabled: "{{ cri_dockerd_service_enabled }}"
    state: "{{ cri_dockerd_service_state }}"
  become: true
  when: cri_dockerd_manage_service | bool
