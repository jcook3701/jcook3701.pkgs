---
- name: Uninstall cri-dockerd package
  ansible.builtin.include_tasks: uninstall.yml

- name: Remove cri-dockerd package cache directory
  ansible.builtin.file:
    path: "{{ cri_dockerd_package_cache_dir }}"
    state: absent
  become: true
