---
- name: Validate cri-dockerd release package availability
  ansible.builtin.assert:
    that:
      - cri_dockerd_package_architecture in ['amd64', 'arm64']
      - ansible_facts['distribution_release'] | lower in cri_dockerd_os_supported_releases
    fail_msg: >-
      No matching cri-dockerd release package is configured for this
      distribution, codename, or CPU architecture.

- name: Debug cri-dockerd configuration
  ansible.builtin.debug:
    msg:
      - "cri_dockerd_version: {{ cri_dockerd_version }}"
      - "cri_dockerd_package_url: {{ cri_dockerd_package_url }}"
      - "cri_dockerd_package_path: {{ cri_dockerd_package_path }}"
      - "cri_dockerd_manage_service: {{ cri_dockerd_manage_service }}"
  when: cri_dockerd_debug | bool

- name: Create cri-dockerd package cache directory
  ansible.builtin.file:
    path: "{{ cri_dockerd_package_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download cri-dockerd release package
  ansible.builtin.get_url:
    url: "{{ cri_dockerd_package_url }}"
    dest: "{{ cri_dockerd_package_path }}"
    owner: root
    group: root
    mode: "0644"
    checksum: "{{ cri_dockerd_package_checksum if cri_dockerd_package_checksum | length > 0 else omit }}"
  become: true

- name: Install cri-dockerd package
  ansible.builtin.include_role:
    name: jcook3701.utils.pkg_manager
  vars:
    pkg_manager_pkgs:
      - "{{ cri_dockerd_package_path }}"
    pkg_manager_state: present
    pkg_manager_update_cache: false

- name: Configure cri-dockerd
  ansible.builtin.include_tasks: configure/main.yml
