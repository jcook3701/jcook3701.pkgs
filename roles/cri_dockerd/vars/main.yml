---
cri_dockerd_pkg_names:
  - cri-dockerd

cri_dockerd_package_architecture: >-
  {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], '') }}

cri_dockerd_package_filename: >-
  cri-dockerd_{{ cri_dockerd_version }}.{{ cri_dockerd_package_revision }}.{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_release'] | lower }}_{{ cri_dockerd_package_architecture }}.deb

cri_dockerd_package_url: >-
  {{ cri_dockerd_download_url }}/v{{ cri_dockerd_version }}/{{ cri_dockerd_package_filename }}

cri_dockerd_package_path: >-
  {{ cri_dockerd_package_cache_dir }}/{{ cri_dockerd_package_filename }}
