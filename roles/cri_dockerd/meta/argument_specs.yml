---
argument_specs:
  main:
    short_description: Install and configure Mirantis cri-dockerd
    description:
      - Install cri-dockerd from a published Debian release package.
      - Delegate package installation and removal to jcook3701.utils.pkg_manager.
      - Manage the cri-docker socket without altering Docker Engine configuration.
    author:
      - Jared Cook

    options:
      cri_dockerd_state:
        type: str
        default: present
        choices:
          - present
          - absent
          - teardown
        description:
          - C(present) installs the package and configures its socket.
          - C(absent) uninstalls the package.
          - C(teardown) also removes the role-owned package cache.

      cri_dockerd_debug:
        type: bool
        default: true
        description:
          - Enable non-sensitive role debugging output.

      cri_dockerd_version:
        type: str
        default: "0.4.10"
        description:
          - Upstream cri-dockerd release version without the leading v.

      cri_dockerd_package_revision:
        type: str
        default: "3-0"
        description:
          - Debian package revision suffix used in upstream asset filenames.

      cri_dockerd_download_url:
        type: str
        default: "https://github.com/Mirantis/cri-dockerd/releases/download"
        description:
          - Base URL of Mirantis cri-dockerd release downloads.

      cri_dockerd_package_cache_dir:
        type: path
        default: "/var/cache/cri-dockerd"
        description:
          - Local cache directory for the downloaded Debian package.

      cri_dockerd_package_checksum:
        type: str
        default: ""
        description:
          - Optional Ansible get_url checksum, for example sha256 followed by a colon and hash.
          - An empty value performs no explicit file checksum validation.

      cri_dockerd_manage_service:
        type: bool
        default: true
        description:
          - Manage the installed cri-docker systemd socket.

      cri_dockerd_service:
        type: str
        default: "cri-docker.socket"
        description:
          - Systemd socket unit installed by the upstream Debian package.

      cri_dockerd_service_enabled:
        type: bool
        default: true
        description:
          - Enable the cri-docker socket at boot.

      cri_dockerd_service_state:
        type: str
        default: started
        choices:
          - started
          - stopped
        description:
          - Desired runtime state of the cri-docker socket.
