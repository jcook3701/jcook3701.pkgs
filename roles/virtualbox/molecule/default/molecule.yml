---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: "virtualbox-test-debian"
    image: "geerlingguy/docker-debian12-ansible:latest"
    command: "/lib/systemd/systemd"
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
      - "/lib/modules:/lib/modules:ro"
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
verifier:
  name: ansible
