---
- name: Download the Oracle VirtualBox GPG key to the full keyring path
  ansible.builtin.get_url:
    url: "https://www.virtualbox.org/download/oracle_vbox_2016.asc"
    dest: "{{ virtualbox_directories.asc }}"
    mode: "0644"

- name: Add the official VirtualBox repository with the full signed-by path
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by={{ virtualbox_directories.asc }}] https://download.virtualbox.org/virtualbox/debian {{ ansible_distribution_release }} contrib"
    state: present
    filename: virtualbox
    update_cache: yes
