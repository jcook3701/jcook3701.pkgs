---
- name: Force deep purge of Oracle VM VirtualBox packages
  ansible.builtin.include_role:
    name: jcook3701.utils.pkg_manager
  vars:
    pkg_manager_pkgs: "{{ virtualbox_pkg_names | default([]) }}"
    pkg_manager_state: absent
    pkg_manager_remove_level: complete

- name: Ensure removal of Oracle VM VirtualBox group
  ansible.builtin.group:
    name: "{{ virtualbox_group | default('vboxusers') }}"
    state: absent
  become: true
