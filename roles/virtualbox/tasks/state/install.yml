---
- name: Setup Oracle VM VirtualBox Package Repository
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ virtualbox_repo_id }}"
    repo_add_name: "{{ virtualbox_repo_name }}"
    repo_add_enabled: true
    # Debian Overrides (Passed cleanly when running on Debian nodes)
    repo_add_debian_uris: "{{ virtualbox_debian_uris | default(omit) }}"
    repo_add_debian_suites: "{{ virtualbox_debian_suites | default(omit) }}"
    repo_add_debian_components: "{{ virtualbox_debian_component | default(omit) }}"
    repo_add_debian_signed_by: "{{ virtualbox_debian_signed_by | default(omit) }}"
    # Red Hat Overrides
    repo_add_redhat_baseurl: "{{ virtualbox_redhat_baseurl | default(omit) }}"
    # Arch Linux Overrides
    repo_add_arch_server: "{{ virtualbox_arch_server | default(omit) }}"
  when: ansible_os_family in ['Debian', 'Redhat']

- name: Install Oracle VM VirtualBox packages and dependencies
  ansible.builtin.package:
    name: >-
      {{ virtualbox_dep_pkg_names | default([])
          + virtualbox_pkg_names | default([]) }}
    state: present

- name: Oracle VM VirtualBox Configure
  ansible.builtin.include_tasks: configure/main.yml
