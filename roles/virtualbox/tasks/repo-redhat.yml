---
- name: Install EPEL repository (required for dkms)
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install kernel headers and build dependencies
  ansible.builtin.dnf:
    name: "{{ virtualbox_pkg_deps }}"
    state: present

- name: Add VirtualBox official repository
  ansible.builtin.get_url:
    url: "{{ virtualbox_repo_url }}"
    dest: "{{ virtualbox_file.repo }}"
    mode: "0644"
    owner: root
    group: root
  notify: Update dnf cache

- name: Force system changes to apply
  ansible.builtin.meta: flush_handlers
