---
- name: Ensure VirtualBox group exists
  ansible.builtin.group:
    name: "{{ virtualbox_group | default('vboxusers') }}"
    state: present
  become: true

- name: Add users to the VirtualBox group
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: "{{ virtualbox_group | default('vboxusers') }}"
    append: true
  loop: "{{ virtualbox_users | default([]) }}"
  loop_control:
    loop_var: user
    label: "Adding {{ user.name }} to {{ virtualbox_group }} group"
  become: true
  when:
    - user.name is defined
    - user.name | length > 0
