---
- name: Ensure VirtualBox group exists
  ansible.builtin.group:
    name: vboxusers
    state: "{{ virtualbox_state | default('present') }}"

- name: Add sudo_user to the VirtualBox group
  ansible.builtin.user:
    name: "{{ sudo_user }}"
    groups: vboxusers
    append: true
  become: true
  when: virtualbox_state | default('present') == 'present'
