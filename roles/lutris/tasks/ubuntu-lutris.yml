---
- name: Add i386 architecture
  ansible.builtin.command:
    cmd: dpkg --add-architecture i386

- name: Update the apt package index
  ansible.builtin.apt:
    pkg:
      - libvulkan1
      - libvulkan1:i386
    update_cache: true

- name: Add the Lutris PPA repository
  ansible.builtin.apt_repository:
    repo: ppa:lutris-team/lutris
    state: present

- name: Update the apt package index
  ansible.builtin.apt:
    update_cache: true

- name: Install Lutris
  ansible.builtin.apt:
    pkg:
      - lutris
    state: present
