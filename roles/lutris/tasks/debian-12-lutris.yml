---
- name: Debian 12 - Lutris Install
  block:
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Lutris repository to sources list
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/lutris.list
        mode: "0644"
        content: >-
          deb [signed-by=/etc/apt/keyrings/lutris.gpg]
          https://download.opensuse.org/repositories/home:/strycore/Debian_12/
          ./

    - name: Download Lutris GPG key
      ansible.builtin.get_url:
        url: https://download.opensuse.org/repositories/home:/strycore/Debian_12/Release.key
        dest: /tmp/lutris.gpg
        mode: "0644"

    - name: Convert Lutris key to GPG format
      ansible.builtin.command:
        cmd: gpg --dearmor -o /etc/apt/keyrings/lutris.gpg /tmp/lutris.gpg
      args:
        creates: /etc/apt/keyrings/lutris.gpg

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: true

    - name: Install Lutris
      ansible.builtin.apt:
        name: lutris
        state: present
