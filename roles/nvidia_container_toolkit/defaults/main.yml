# -------------------------------------------------------------------------
# Lifecycle & System Access Management
# -------------------------------------------------------------------------
nvidia_container_toolkit_state: present
nvidia_container_toolkit_debug: true
# -------------------------------------------------------------------------
# NVIDIA Container Toolkit Repository Configuration
# -------------------------------------------------------------------------
nvidia_container_toolkit_download_url: "https://nvidia.github.io"

# -------------------------------------------------------------------------
# NVIDIA Container Toolkit Package Configuration
# -------------------------------------------------------------------------
nvidia_container_toolkit_manage_engine: true
nvidia_container_toolkit_engine: "docker"

