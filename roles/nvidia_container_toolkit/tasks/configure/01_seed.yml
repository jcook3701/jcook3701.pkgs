---
- name: Configure NVIDIA Container Runtime for Container Engine
  ansible.builtin.command:
    cmd: nvidia-ctk runtime configure --runtime={{ nvidia_container_toolkit_engine | default('docker') }}
  become: true
  when: nvidia_container_toolkit_manage_engine | default(true) | bool
  notify: Restart Engine Service
