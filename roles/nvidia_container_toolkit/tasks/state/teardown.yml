---
- name: Ensure NVIDIA Container Toolkit package is uninstalled
  ansible.builtin.include_tasks: uninstall.yml

- name: Decommission NVIDIA Container Toolkit Package Repositories via repo_add
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ nvidia_container_toolkit_os_repo_id }}"
    repo_add_name: "{{ nvidia_container_toolkit_os_repo_name }}"
    repo_add_state: "absent"
  when:
    - nvidia_container_toolkit_os_repo_id is defined
    - nvidia_container_toolkit_os_repo_id | length > 0
    - ansible_os_family in ['Debian'] # TODO: 'Redhat' variables.
