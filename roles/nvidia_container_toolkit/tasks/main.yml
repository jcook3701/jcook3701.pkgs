---
- name: Load Nvidia Container Toolkit OS-specific variables
  ansible.builtin.include_vars: "{{ nvidia_container_toolkit_vars }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: nvidia_container_toolkit_vars
    label: "Loading variables file: {{ nvidia_container_toolkit_vars }}"

- name: Ensure Nvidia Container Toolkit packages are installed
  ansible.builtin.include_tasks: state/install.yml
  when: nvidia_container_toolkit_state | default('present') == 'present'

- name: Ensure Nvidia Container Toolkit is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: nvidia_container_toolkit_state | default('present') == 'absent'

- name: Ensure Nvidia Container Toolkit is uninstalled and configurations removed
  ansible.builtin.include_tasks: state/teardown.yml
  when: nvidia_container_toolkit_state | default('present') == 'teardown'
