---
- name: Load pxelinux OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install pxelinux packages
  ansible.builtin.include_tasks: install.yml
  when: pxelinux_state | default('present') == 'present'

- name: Uninstall pxelinux packages
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - pxelinux_state | default('present') == 'absent'
    - pxelinux_pkg_names[0] in ansible_facts.packages
