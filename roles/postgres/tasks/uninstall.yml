---
- name: Stop and disable Postgres service
  ansible.builtin.systemd:
    name: "{{ postgres_service }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Uninstall Postgres package and dependencies.
  ansible.builtin.package:
    name: "{{ postgres_pkg_names }}"
    state: absent
