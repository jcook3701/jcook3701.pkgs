---
- name: Gather active target systemd service units
  ansible.builtin.service_facts:
  become: true

- name: Ensure Wireguard VPN service is stopped and disabled
  ansible.builtin.service:
    name: "{{ wireguard_service | default('wg-quick@' ~ wireguard_interface) }}"
    state: stopped
    enabled: false
  become: true
  when: (wireguard_service ~ '.service' in ansible_facts.services)

- name: Force deep purge of Wireguard VPN package and dependencies
  ansible.builtin.include_role:
    name: jcook3701.utils.pkg_manager
  vars:
    pkg_manager_pkgs: "{{ wireguard_pkg_names | default(['wireguard']) }}"
    pkg_manager_state: absent
    pkg_manager_remove_level: complete
