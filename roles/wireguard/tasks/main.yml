---
- name: Load Wireguard VPN OS-specific variables
  ansible.builtin.include_vars: "{{ wireguard_vars }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: wireguard_vars
    label: "Loading variables file: {{ wireguard_vars }}"

- name: Ensure Wireguard VPN is installed and configured
  ansible.builtin.include_tasks: state/install.yml
  when: wireguard_state | default('present') == 'present'

- name: Ensure Wireguard VPN is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: wireguard_state | default('present') == 'absent'

- name: Teardown Wireguard VPN services, packages, and configuration files
  ansible.builtin.include_tasks: state/teardown.yml
  when: wireguard_state | default('present') == 'teardown'
