---
- name: Check installed Helm (CLI) version
  ansible.builtin.command:
    argv:
      - helm
      - version
      - --short
  register: helm_version_result
  changed_when: false

- name: Display installed Helm (CLI) version
  ansible.builtin.debug:
    msg: "Installed Helm version: {{ helm_version_result.stdout }}"
  when: helm_debug | bool
