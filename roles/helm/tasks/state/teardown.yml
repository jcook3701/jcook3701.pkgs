---
- name: Remove Helm (CLI) package before repository teardown
  ansible.builtin.include_tasks: uninstall.yml

- name: Decommission Helm (CLI) APT repository via repo_add
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ helm_repo_id }}"
    repo_add_name: "{{ helm_repo_name }}"
    repo_add_state: absent
  when: helm_manage_repository | bool
