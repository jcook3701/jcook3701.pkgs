---
openldap_pkg_names:
  - slapd
  - ldap-utils
  - python3-cryptography
  - libsasl2-modules-gssapi-mit
  - libnet-ldap-perl

openldap_directory:
  conf: "/etc/ldap"
  slapd: "/etc/ldap/slapd.d"
  certs: "/etc/ldap/certs"
  database: "/var/lib/ldap"
  modules: "/usr/lib/ldap"
  schema: "/etc/ldap/schema"
  run: "/run/slapd"
  defaults: "/etc/default/slapd"

openldap_group: openldap
