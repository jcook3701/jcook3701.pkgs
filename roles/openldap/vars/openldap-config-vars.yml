---
openldap_directory:
  conf: "/etc/openldap"
  certs: "/etc/openldap/certs"

openldap_key:
  # Key Options
  tls_cacert: ""
  tls_cert: "{{ openldap_directory.certs }}/cert.pem"
  tls_key: "{{ openldap_directory.certs }}/priv.pem"

openldap_conf:
  # Port Options
  # ldap = 389 or ldaps = 636
  port: "636"


  # Domain Options
  top_level_domain: "com"
  second_level_domain: "jcook3701"
  domain_name: "{{ second_level_domain }}.{{ top_level_domain }}"

  sasl_nocanon: "on"
  tls_reqcert: "allow"
