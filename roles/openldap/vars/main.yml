---
openldap_user: "openldap"
openldap_group: "openldap"

openldap_service: "slapd"

# Place holders for OS-specific variables
openldap_sysconfig_variable: "SLAPD_SERVICES"

openldap_pkg_names: []
openldap_shared_libs: []

openldap_directory:
  conf: "{{ openldap_os_directory.conf | default('/etc/ldap') }}"
  slapd: "{{ openldap_os_directory.slapd | default('/etc/ldap/slapd.d') }}"
  cacerts: "{{ openldap_os_directory.cacerts | default('/etc/ssl/certs') }}"
  certs: "{{ openldap_os_directory.certs | default('/etc/ldap/certs') }}"
  database: "{{ openldap_os_directory.database | default('/var/lib/ldap') }}"
  modules: "{{ openldap_os_directory.modules | default('/usr/lib/ldap') }}"
  schema: "{{ openldap_os_directory.schema | default('/etc/ldap/schema') }}"
  run: "{{ openldap_os_directory.run | default('/run/slapd') }}"
  defaults: "{{ openldap_os_directory.defaults | default('/etc/default/slapd') }}"
  backup: "{{ openldap_backup_dir }}"

openldap_schemas_base:
  - core
  - cosine
  - inetorgperson
  - nis
  - openldap
  - collective
  - corba
  - duaconf
  - dyngroup
  - java
  - misc
  - namedobject
  - pmi

openldap_custom_schemas: >-
  {{
    ( ['ppolicy'] if (openldap_ppolicy | default(false)) else [] ) +
    ( ['samba'] if (openldap_samba | default(false)) else [] ) +
    ( ['sudo'] if (openldap_sudo | default(false)) else [] ) +
    ( ['openssh-lpk'] if (openldap_openssh | default(false)) else [] ) +
    ( ['autofs'] if (openldap_autofs | default(false)) else [] ) +
    ( ['guacConfigGroup'] if (openldap_guac | default(false)) else [] )
  }}

## Network & Service Access Binding ##
openldap_port: "{{ openldap_secure_port if (openldap_use_tls | bool) else openldap_cleartext_port }}"

openldap_raw_listen_protocols: >-
  {% if openldap_use_tls | bool %}
    {{ ['ldap', 'ldaps'] | to_json }}
  {% else %}
    {{ ['ldap'] | to_json }}
  {% endif %}

openldap_listen_protocols: "{{ openldap_raw_listen_protocols | from_json }}"

openldap_final_daemon_args: >-
  {% set links = [] %}
  {% for proto in openldap_listen_protocols %}
    {% if proto == 'ldap' %}
      {% set _ = links.append('ldap://0.0.0.0:' ~ openldap_cleartext_port) %}
    {% elif proto == 'ldaps' %}
      {% set _ = links.append('ldaps://0.0.0.0:' ~ openldap_secure_port) %}
    {% endif %}
  {% endfor %}
  {% set _ = links.append('ldapi:///') %}
  {{ links | join(' ') | trim }}

# Organizational Unit Name Customizations
openldap_users_parent_ou: "Users"
openldap_people_child_ou: "People"
openldap_computers_child_ou: "Computers"
openldap_groups_ou: "Groups"
openldap_sudoers_ou: "SUDOers"
openldap_automount_ou: "AutoMount"
openldap_idmap_ou: "Idmap"
