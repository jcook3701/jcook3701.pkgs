---
openldap_os_user: "ldap"
openldap_os_group: "ldap"

openldap_os_sysconfig_variable: "SLAPD_URLS"

openldap_os_shared_lib_pkg_names:
  - "cyrus-sasl-gssapi"
  - "python3-passport"
  - "python3-ldap"

openldap_os_client_pkg_names:
  - openldap-clients

openldap_os_server_pkg_names:
  - openldap-servers

openldap_os_directory:
  conf: "/etc/openldap"
  slapd: "/etc/openldap/slapd.d"
  cacerts: "/etc/pki/tls/certs"
  certs: "/etc/openldap/certs"
  database: "/var/lib/ldap"
  modules: "/usr/lib64/openldap"
  schema: "/etc/openldap/schema"
  run: "/run/openldap"
  override: "/etc/systemd/system/slapd.service.d"
  defaults: "/etc/sysconfig"
