---
openldap_user: "openldap"
openldap_group: ldap

openldap_sysconfig_variable: "SLAPD_URLS"

openldap_pkg_names:
  - openldap

openldap_shared_libs:
  - perl-net-ldap
  - python-passlib
  - python-ldap

openldap_os_directory:
  conf: "/etc/openldap"
  slapd: "/etc/openldap/slapd.d"
  cacerts: "/etc/ssl/certs"
  certs: "/etc/openldap/certs"
  database: "/var/lib/openldap"
  modules: "/usr/lib/openldap"
  schema: "/etc/openldap/schema"
  run: "/run/openldap"
  override: "/etc/systemd/system/slapd.service.d"
  defaults: ""
