---
openldap_pkg_names:
  - openldap

openldap_directory:
  conf: "/etc/openldap"
  slapd: "/etc/openldap/slapd.d"
  certs: "/etc/openldap/certs"
  database: "/var/lib/openldap/openldap-data"
  modules: "/usr/lib/openldap"
  schema: "/etc/openldap/schema"
  run: "/run/openldap"
  defaults: "/etc/conf.d/slapd"

openldap_group: ldap
