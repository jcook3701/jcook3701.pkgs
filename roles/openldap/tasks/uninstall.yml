---
- name: Stop OpenLDAP directory daemon service cleanly
  ansible.builtin.service:
    name: "{{ openldap_service }}"
    state: stopped
  failed_when: false

- name: Remove OpenLDAP binary packages
  ansible.builtin.package:
    name: "{{ openldap_pkg_names }}"
    state: absent
