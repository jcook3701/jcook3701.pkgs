---
- name: Validate openldap role variables
  ansible.builtin.assert:
    that:
      - openldap_state in ['present', 'absent', 'teardown']
    fail_msg: "Invalid state type. Choose present, absent, or teardown."

- name: Verify openldap_node_type is valid
  ansible.builtin.assert:
    that:
      - openldap_node_type in ['master', 'slave']
    fail_msg: "openldap_node_type must be set to either 'master' or 'slave'. Current value: '{{ openldap_node_type }}'"

- name: Verify openldap_top_level_domain is defined
  ansible.builtin.assert:
    that:
      - openldap_top_level_domain | length > 0
    fail_msg: "openldap_top_level_domain cannot be empty. Please specify your top-level domain component."

- name: Verify openldap_second_level_domain is defined
  ansible.builtin.assert:
    that:
      - openldap_second_level_domain | length > 0
    fail_msg: "openldap_second_level_domain cannot be empty. Please specify your second-level domain component."

- name: Verify openldap_admin_user is defined
  ansible.builtin.assert:
    that:
      - openldap_admin_user | length > 0
    fail_msg: >-
      openldap_admin_user cannot be empty. Please set an administrative username."

- name: Verify openldap_admin_password is defined
  ansible.builtin.assert:
    that:
      - openldap_admin_password | length > 0
      - openldap_admin_password != 'SecretPassword123'
    fail_msg: >-
      openldap_admin_password cannot be empty.
      Please set a secure administrative password.

- name: Verify openldap_listen_protocols contains valid options
  ansible.builtin.assert:
    that: >-
      openldap_listen_protocols is sequence and
      openldap_listen_protocols | length > 0 and
      openldap_listen_protocols | difference(['ldap', 'ldaps']) | length == 0
    fail_msg: >-
      openldap_listen_protocols must be a list containing 'ldap', 'ldaps', or both.
      Unsupported protocols or typos detected in your current list: {{ openldap_listen_protocols }}

- name: Verify openldap_replica_id is defined for slave node
  ansible.builtin.assert:
    that:
      - openldap_replica_id is defined and openldap_replica_id | length > 0
    fail_msg: >-
      openldap_replica_id must be specified when openldap_node_type is set to 'slave'.
  when: openldap_node_type == 'slave'

- name: Verify openldap_replication_user is defined for slave node
  ansible.builtin.assert:
    that:
      - openldap_replication_user | length > 0
    fail_msg: >-
      openldap_replication_user cannot be empty on slave nodes.
  when: openldap_node_type == 'slave'

- name: Verify openldap_replication_password is defined for slave node
  ansible.builtin.assert:
    that:
      - openldap_replication_password | length > 0
      - openldap_replication_password != 'SecretPassword123'
    fail_msg: >-
      openldap_replication_password cannot be empty,
      or left default value on slave nodes.
  when: openldap_node_type == 'slave'

- name: Verify openldap_sasl_nocanon is valid
  ansible.builtin.assert:
    that: "openldap_sasl_nocanon in ['on', 'off']"
    fail_msg: >
      openldap_sasl_nocanon must be set to 'on' or 'off'.
      Current value is: '{{ openldap_sasl_nocanon }}'

- name: Verify openldap_tls_reqcert is valid
  ansible.builtin.assert:
    that: "openldap_tls_reqcert in ['never', 'allow', 'try', 'demand']"
    fail_msg: >
      openldap_tls_reqcert must be 'never', 'allow', 'try', or 'demand'.
      Current value is: '{{ openldap_tls_reqcert }}'

- name: Verify TLS certificate paths are provided if using ldaps
  ansible.builtin.assert:
    that:
      - openldap_tls_server_certificate | length > 0
      - openldap_tls_server_key | length > 0
    fail_msg: >
      TLS certificate and key variables cannot be empty when using 'ldaps'.
      Please check openldap_tls_server_certificate and openldap_tls_server_key.
  when: "'ldaps' in openldap_listen_protocols"
