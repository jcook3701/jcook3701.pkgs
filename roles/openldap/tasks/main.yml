---
- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Load Openldap OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Check if OpenLDAP configuration database already exists on host
  ansible.builtin.stat:
    path: "{{ openldap_directory.slapd }}/cn=config.ldif"
  register: openldap_existing_config
  become: true

- name: OpenLDAP database backup
  ansible.builtin.include_tasks: backupDB.yml
  when:
    - openldap_state | default('present') in ['present', 'teardown', 'backup']
    - openldap_existing_config.stat.exists
    - openldap_node_type == 'master'
    - slapd_in_packages
  vars:
    # Safely abstract the boolean expression outside of the YAML list syntax to force clean evaluation
    slapd_in_packages: "{{ 'slapd' in ansible_facts.packages }}"

- name: Install Openldap
  ansible.builtin.include_tasks: install.yml
  when:
    - openldap_state | default('present') == 'present'

- name: OpenLDAP database restoration and import
  ansible.builtin.include_tasks: importDB.yml
  when:
    - openldap_state | default('present') == 'present'
    - not openldap_existing_config.stat.exists

- name: Uninstall Openldap
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - openldap_state | default('present') == 'absent'
    - openldap_pkg_names[0] in ansible_facts.packages

- name: Complete Purge and Tear-Down of OpenLDAP Environment
  ansible.builtin.include_tasks: teardown.yml
  when:
    - openldap_state | default('present') == 'teardown'
