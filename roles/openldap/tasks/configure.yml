---
- name: Create LDAP configuration directory
  ansible.builtin.file:
    path: "{{ openldap_directory.conf }}"
    state: directory
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    mode: "0750"

- name: Deploy client configuration (ldap.conf)
  ansible.builtin.template:
    src: ldap.conf.j2
    dest: "{{ openldap_directory.conf }}/ldap.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart openldap service

- name: Ensure OpenLDAP daemon system settings are fully populated
  ansible.builtin.lineinfile:
    path: "{{ openldap_directory.defaults }}"
    regexp: "^{{ item.variable }}="
    line: '{{ item.variable }}="{{ item.value }}"'
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - { variable: "{{ openldap_sysconfig_variable }}", value: "{{ openldap_final_daemon_args }}" }
    - { variable: "SLAPD_OPTIONS", value: "" }
  notify: Restart openldap service
  become: true
