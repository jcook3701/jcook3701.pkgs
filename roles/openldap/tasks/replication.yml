---
# ====================================================================
# 1. PRIMARY MODULE INITIALIZATION
# ====================================================================
- name: Create temporary LDIF file to load replication module (Master Only)
  ansible.builtin.copy:
    content: |
      dn: cn=module{0},cn=config
      changetype: modify
      add: olcModuleLoad
      olcModuleLoad: syncprov.la
    dest: /tmp/load_syncprov.ldif
    mode: "0600"
  when: openldap_node_type == 'master'

- name: Apply online module loading configuration (Master Only)
  ansible.builtin.command:
    cmd: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/load_syncprov.ldif
  when: openldap_node_type == 'master'
  register: load_result
  failed_when: >-
    load_result.rc != 0 and
    load_result.rc != 20 and
    'already exists' not in load_result.stderr | lower
  changed_when: "'modifying entry' in load_result.stdout"

# ====================================================================
# 2. RUNTIME REPLICA CONFIGURATION PASS
# ====================================================================
- name: Generate type-specific replication configuration file from template
  ansible.builtin.template:
    src: replication.ldif.j2
    dest: /tmp/replication.config.ldif
    owner: root
    group: root
    mode: "0600"

- name: Apply Replication Config to OpenLDAP online (Master & Slaves)
  ansible.builtin.command:
    cmd: ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/replication.config.ldif
  register: replication_result
  failed_when: >-
    replication_result.rc != 0 and
    'type or value exists' not in replication_result.stderr | lower and
    'already exists' not in replication_result.stderr | lower and
    'already in list' not in replication_result.stderr | lower
  changed_when: >-
    'modifying entry' in replication_result.stdout or
    'adding new entry' in replication_result.stdout

# ====================================================================
# 3. HOUSEKEEPING CLEANUP
# ====================================================================
- name: Clean up temporary master replication configuration files
  ansible.builtin.file:
    path: /tmp/load_syncprov.ldif
    state: absent
  when: openldap_node_type == 'master'

- name: Clean up global replication configuration files
  ansible.builtin.file:
    path: /tmp/replication.config.ldif
    state: absent
