---
- name: Generate OpenLDAP admin password hash
  ansible.builtin.command: "{{ command }}"
  vars:
    command: "slappasswd -s {{ openldap_admin_password }}"
  register: openldap_hashed_pass_cmd
  no_log: true
  changed_when: false

- name: Set hashed password as fact
  ansible.builtin.set_fact:
    openldap_admin_password_hashed: "{{ openldap_hashed_pass_cmd.stdout }}"

# ====================================================================
# --- 1. OFFLINE CONFIGURATION INITIALIZATION BLOCK ---
# ====================================================================
- name: Initialize and Bootstrap OpenLDAP Database Files Offline
  when: not openldap_existing_config.stat.exists
  become: true
  block:
    - name: Stop openldap for initial setup
      ansible.builtin.service:
        name: "{{ openldap_service }}"
        state: stopped

    - name: Clear LDAP config for clean bootstrap
      ansible.builtin.file:
        path: "{{ openldap_directory.slapd }}"
        state: "{{ state }}"
        owner: "{{ openldap_user }}"
        group: "{{ openldap_group }}"
        mode: "0750"
      loop: [absent, directory]
      loop_control:
        loop_var: state
        label: "{{ openldap_directory.slapd }} -> state -- {{ state }}"

    - name: Ensure backend storage directories exist with strict permissions
      ansible.builtin.file:
        path: "{{ directory }}"
        state: directory
        owner: "{{ openldap_user }}"
        group: "{{ openldap_group }}"
        mode: "0700"
      loop:
        - "{{ openldap_directory.database }}"
      loop_control:
        loop_var: directory
        label: "Creating: {{ directory }}"

    - name: Deploy bootstrap configuration from J2 template
      ansible.builtin.template:
        src: bootstrap_config.ldif.j2
        dest: /tmp/bootstrap_config.ldif
        owner: "{{ openldap_user }}"
        group: "{{ openldap_group }}"
        mode: "0600"

    - name: Initialize OpenLDAP configuration offline
      ansible.builtin.command: "{{ command }}"
      vars:
        command: >-
          slapadd -v -n 0 -F {{ openldap_directory.slapd }}
          -l /tmp/bootstrap_config.ldif
        ansible_remote_tmp: /tmp
      become_user: "{{ openldap_user }}"

    - name: Start OpenLDAP service
      ansible.builtin.service:
        name: "{{ openldap_service }}"
        state: started

    - name: Upload custom LDIF schemas to the guest
      ansible.builtin.copy:
        src: "schema/"
        dest: "{{ openldap_directory.schema }}/"
        owner: "{{ openldap_user }}"
        group: "{{ openldap_group }}"
        mode: "0644"
      become: true

    - name: Set permissions for OpenLDAP directories
      ansible.builtin.file:
        path: "{{ directory }}"
        state: directory
        owner: "{{ openldap_user }}"
        group: "{{ openldap_group }}"
        mode: "0750"
        recurse: true
      loop:
        - "{{ openldap_directory.slapd }}"
        - "{{ openldap_directory.database }}"
      loop_control:
        loop_var: directory
        label: "setting permissions: {{ directory }}"
      become: true

    - name: Load schemas online (In Order)
      ansible.builtin.shell:
        cmd: "{{ command }}"
      args:
        executable: /bin/bash
      vars:
        command: >-
          set -o pipefail && iconv -f UTF-8 -t UTF-8
          -c {{ openldap_directory.schema }}/{{ schema }}.ldif 2>&1 |
          ldapadd -Y EXTERNAL -H ldapi:///
      loop: "{{ openldap_schemas }}"
      loop_control:
        loop_var: schema
        label: "loading: {{ schema }}"
      register: schema_load_result
      failed_when:
        - schema_load_result.rc != 0
        - "'Duplicate ' not in schema_load_result.stderr"
        - "'Already exists' not in schema_load_result.stderr"
      changed_when: "'adding new entry' in schema_load_result.stdout"
      become: true

    - name: Verify loaded LDAP schemas
      ansible.builtin.command: "{{ command }}"
      vars:
        command: >-
          ldapsearch -Q -LLL -Y EXTERNAL -H ldapi:///
          -b "cn=schema,cn=config" "(objectClass=olcSchemaConfig)" cn
      register: ldap_schema_list
      changed_when: false
      become: true

    - name: Display active LDAP schemas
      ansible.builtin.debug:
        msg: >-
          The following schemas are active:
          {{ ldap_schema_list.stdout_lines | select('match', '^cn:.*') | list }}

    - name: Deploy Database Online Configuration LDIF
      ansible.builtin.template:
        src: db_config.ldif.j2
        dest: "/tmp/db_config.ldif"
        owner: root
        group: root
        mode: "0600"

    - name: Apply Online Configuration to OpenLDAP
      ansible.builtin.command: "{{ command }}"
      vars:
        command: >-
          ldapmodify -Y EXTERNAL -H ldapi:///
          -f /tmp/db_config.ldif
      register: ldap_modify_result
      failed_when:
        - ldap_modify_result.rc != 0
        - "'Already exists' not in ldap_modify_result.stderr"
      changed_when: "'modifying entry' in ldap_modify_result.stdout"

    - name: Deploy base domain structure LDIF
      ansible.builtin.template:
        src: base_structure.ldif.j2
        dest: "/tmp/base_structure.ldif"
        owner: root
        group: root
        mode: "0600"
      when: openldap_node_type == 'master'

    - name: Create base domain structure
      ansible.builtin.command: "{{ command }}"
      vars:
        base_structure_file: /tmp/base_structure.ldif
        command: "ldapadd -Y EXTERNAL -H ldapi:/// -f {{ base_structure_file }}"
      register: base_dn_result
      failed_when:
        - base_dn_result.rc != 0
        - "'Already exists' not in base_dn_result.stderr"
      changed_when: "'adding new entry' in base_dn_result.stdout"
      become: true
      when: openldap_node_type == 'master'

# ====================================================================
# --- 2. IDEMPOTENT CONFIGURATION RUNTIME PASS ---
# ====================================================================
- name: Discover the operational local system domain SID from the target machine
  ansible.builtin.command: "net getdomainsid"
  register: openldap_system_sid_raw
  changed_when: false
  failed_when: false
  become: true
  when:
    - openldap_node_type == 'master'
    - openldap_samba | bool

- name: Register the system domain SID into active execution memory facts
  ansible.builtin.set_fact:
    openldap_system_domain_sid: "{{ openldap_system_sid_raw.stdout | regex_search('S-1-5-21-[0-9\\-]+') | default('S-1-5-21-0000000000-0000000000-0000000000') | trim }}"
  when: openldap_node_type == 'master'

- name: Ingest active schema feature component profiles sequentially
  ansible.builtin.include_tasks: apply_feature.yml
  loop:
    - { name: "sudo", active: "{{ openldap_sudo }}" }
    - { name: "autofs", active: "{{ openldap_autofs }}" }
    - { name: "guac", active: "{{ openldap_guac }}" }
    - { name: "ppolicy", active: "{{ openldap_ppolicy }}" }
    - { name: "samba", active: "{{ openldap_samba }}" }
  loop_control:
    loop_var: feature
    label: "Processing active data profile layer: {{ feature.name }}"
  when:
    - openldap_node_type == 'master'
    - feature.active | bool

- name: Test LDAP Bind (Login) as Admin
  ansible.builtin.command: "{{ command }}"
  vars:
    tls_flag: "{{ '-Z' if (openldap_use_tls | bool) else '' }}"
    base_dn: "dc={{ openldap_second_level_domain }},dc={{ openldap_top_level_domain }}"
    bind_dn: "cn={{ openldap_admin_user }},{{ base_dn }}"
    command: >-
      ldapsearch {{ tls_flag }} -x -H
      ldap://localhost:{{ openldap_cleartext_port | default(389) }}
      -D "{{ bind_dn }}" -w "{{ openldap_admin_password }}"
      -b "{{ base_dn }}" -s base
  register: ldap_bind_test
  changed_when: false
  no_log: true

- name: Verify Secure LDAPS Bind (Port 636)
  ansible.builtin.command: "{{ command }}"
  vars:
    base_dn: "dc={{ openldap_second_level_domain }},dc={{ openldap_top_level_domain }}"
    bind_dn: "cn={{ openldap_admin_user }},{{ base_dn }}"
    command: >-
      ldapsearch -x -H ldaps://localhost:{{ openldap_port }}
      -D "{{ bind_dn }}" -w "{{ openldap_admin_password }}"
      -b "{{ base_dn }}" -s base
  environment:
    LDAPTLS_REQCERT: allow
  register: ldaps_test
  changed_when: false
  no_log: true # Keeps password out of the Ansible logs
  when: openldap_use_tls | bool
