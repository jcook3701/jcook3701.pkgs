---
- name: Generate OpenLDAP password hashes
  ansible.builtin.command: "slappasswd -s {{ password.plain }}"
  loop:
    - { plain: "{{ openldap_admin_password }}", fact: "openldap_admin_password_hashed" }
    - { plain: "{{ openldap_replication_password }}", fact: "openldap_replication_password_hashed" }
  loop_control:
    loop_var: password
    label: "Generating hash for {{ password.fact }}"
  register: openldap_hashed_pass_cmds
  no_log: true
  changed_when: false

- name: Set OpenLDAP hashed passwords as facts
  ansible.builtin.set_fact:
    "{{ hash_result.password.fact }}": "{{ hash_result.stdout }}"
  loop: "{{ openldap_hashed_pass_cmds.results }}"
  loop_control:
    loop_var: hash_result
    label: "Setting fact: {{ hash_result.password.fact }}"
  no_log: true

# ====================================================================
# --- 1. OFFLINE CONFIGURATION INITIALIZATION BLOCK ---
# ====================================================================
- name: Initialize and Bootstrap OpenLDAP Database Files Offline
  when: not openldap_existing_config.stat.exists
  become: true
  block:
    - name: Stop openldap for initial setup
      ansible.builtin.service:
        name: "{{ openldap_service }}"
        state: stopped

    - name: Clear LDAP config for clean bootstrap
      ansible.builtin.file:
        path: "{{ openldap_directory.slapd }}"
        state: "{{ state }}"
        owner: "{{ openldap_user }}"
        group: "{{ openldap_group }}"
        mode: "0750"
      loop: [absent, directory]
      loop_control:
        loop_var: state
        label: "{{ openldap_directory.slapd }} -> state -- {{ state }}"

    - name: Ensure backend storage directories exist with strict permissions
      ansible.builtin.file:
        path: "{{ directory }}"
        state: directory
        owner: "{{ openldap_user }}"
        group: "{{ openldap_group }}"
        mode: "0700"
      loop:
        - "{{ openldap_directory.database }}"
      loop_control:
        loop_var: directory
        label: "Creating: {{ directory }}"

    - name: Deploy bootstrap configuration from J2 template
      ansible.builtin.template:
        src: "01_config_bootstrap.ldif.j2"
        dest: "/tmp/01_config_bootstrap.ldif"
        owner: "{{ openldap_user }}"
        group: "{{ openldap_group }}"
        mode: "0600"

    - name: Initialize OpenLDAP configuration offline
      ansible.builtin.command: "{{ command }}"
      vars:
        config_bootstrap_file: "/tmp/01_config_bootstrap.ldif"
        command: >-
          slapadd -v -n 0 -F {{ openldap_directory.slapd }}
          -l {{ config_bootstrap_file }}
        ansible_remote_tmp: /tmp
      become_user: "{{ openldap_user }}"

    - name: Start OpenLDAP service
      ansible.builtin.service:
        name: "{{ openldap_service }}"
        state: started

    - name: Set permissions for OpenLDAP directories
      ansible.builtin.file:
        path: "{{ directory }}"
        state: directory
        owner: "{{ openldap_user }}"
        group: "{{ openldap_group }}"
        mode: "0750"
        recurse: true
      loop:
        - "{{ openldap_directory.slapd }}"
        - "{{ openldap_directory.database }}"
      loop_control:
        loop_var: directory
        label: "setting permissions: {{ directory }}"
      become: true

    - name: Load base core schemas online (In Order)
      ansible.builtin.shell:
        cmd: "{{ command }}"
      args:
        executable: /bin/bash
      vars:
        command: >-
          set -o pipefail && iconv -f UTF-8 -t UTF-8
          -c {{ openldap_directory.schema }}/{{ schema }}.ldif 2>&1 |
          ldapadd -Y EXTERNAL -H ldapi:///
      loop: "{{ openldap_schemas_base }}"
      loop_control:
        loop_var: schema
        label: "loading: {{ schema }}"
      register: schema_load_result
      failed_when:
        - schema_load_result.rc != 0
        - "'duplicate ' not in schema_load_result.stderr | lower"
        - "'already exists' not in schema_load_result.stderr | lower"
      changed_when: "'adding new entry' in schema_load_result.stdout | lower"
      become: true

    - name: Verify loaded LDAP schemas
      ansible.builtin.command: "{{ command }}"
      vars:
        command: >-
          ldapsearch -Q -LLL -Y EXTERNAL -H ldapi:///
          -b "cn=schema,cn=config" "(objectClass=olcSchemaConfig)" cn
      register: ldap_schema_list
      changed_when: false
      become: true

    - name: Display active LDAP schemas
      ansible.builtin.debug:
        msg: >-
          The following schemas are active:
          {{ ldap_schema_list.stdout_lines | select('match', '^cn:.*') | list }}

    - name: Deploy Database Online Configuration LDIF
      ansible.builtin.template:
        src: 01_config_database.ldif.j2
        dest: "/tmp/01_config_database.ldif"
        owner: root
        group: root
        mode: "0600"

    - name: Apply Online Configuration to OpenLDAP
      ansible.builtin.command: "{{ command }}"
      vars:
        config_database_file: "/tmp/01_config_database.ldif"
        command: >-
          ldapmodify -Y EXTERNAL -H ldapi:///
          -f {{ config_database_file }}
      register: ldap_modify_result
      failed_when:
        - ldap_modify_result.rc != 0
        - "'already exists' not in ldap_modify_result.stderr | lower"
        - "'type or value exists' not in ldap_modify_result.stderr | lower"
      changed_when: "'modifying entry' in ldap_modify_result.stdout | lower"

    - name: Deploy base domain structure LDIF
      ansible.builtin.template:
        src: 02_data_structure.ldif.j2
        dest: "/tmp/02_data_structure.ldif"
        owner: root
        group: root
        mode: "0600"
      when: openldap_node_type == 'master'

    - name: Create base domain structure
      ansible.builtin.command: "{{ command }}"
      vars:
        data_structure_file: /tmp/02_data_structure.ldif
        base_dn: "dc={{ openldap_second_level_domain }},dc={{ openldap_top_level_domain }}"
        bind_dn: "cn={{ openldap_admin_user }},{{ base_dn }}"
        command: >-
          ldapmodify -x -H ldapi:///
          -D "{{ bind_dn }}"
          -w "{{ openldap_admin_password }}"
          -f {{ data_structure_file }}
      register: base_dn_result
      failed_when:
        - base_dn_result.rc != 0
        - "'already exists' not in base_dn_result.stderr | lower"
      changed_when: "'adding new entry' in base_dn_result.stdout | lower"
      become: true
      when: openldap_node_type == 'master'

# ====================================================================
# --- 2. IDEMPOTENT CONFIGURATION RUNTIME PASS ---
# ====================================================================
- name: Discover the operational local system domain SID from the target machine
  ansible.builtin.command: "net getdomainsid"
  register: openldap_system_sid_raw
  changed_when: false
  failed_when: false
  become: true
  when:
    - openldap_node_type == 'master'
    - openldap_samba | bool

- name: Register the system domain SID into active execution memory facts
  ansible.builtin.set_fact:
    openldap_system_domain_sid: "{{ openldap_system_sid_raw.stdout | regex_search('S-1-5-21-[0-9\\-]+') | default('S-1-5-21-0000000000-0000000000-0000000000') | trim }}"
  when: openldap_node_type == 'master'

- name: Ingest optional feature schema extensions online
  ansible.builtin.include_tasks: features/load_schema.yml
  loop: "{{ openldap_custom_schemas }}"
  loop_control:
    loop_var: current_feature_name
    label: "Loading schema extension: {{ current_feature_name }}"
  when: openldap_node_type == 'master'

- name: Deploy dynamic bootstrap users and groups data LDIF
  ansible.builtin.template:
    src: 02_data_seed.ldif.j2
    dest: "/tmp/02_data_seed.ldif"
    owner: root
    group: root
    mode: "0600"
  when: openldap_node_type == 'master'

- name: Seed bootstrap users and groups into the active directory tree
  ansible.builtin.command: >-
    ldapadd -x -H ldapi:///
    -D "cn={{ openldap_admin_user }},dc={{ openldap_second_level_domain }},dc={{ openldap_top_level_domain }}"
    -w "{{ openldap_admin_password }}"
    -f /tmp/02_data_seed.ldif
  register: user_seed_result
  failed_when:
    - user_seed_result.rc != 0
    - "'already exists' not in user_seed_result.stderr | lower"
  changed_when: "'adding new entry' in user_seed_result.stdout | lower"
  become: true
  when: openldap_node_type == 'master'

- name: Apply active feature configuration data objects online
  ansible.builtin.include_tasks: features/apply_data.yml
  loop: "{{ openldap_custom_schemas }}"
  loop_control:
    loop_var: current_feature_name
    label: "Injecting feature data entries: {{ current_feature_name }}"
  when: openldap_node_type == 'master'

- name: Test LDAP Bind (Login) as Admin
  ansible.builtin.command: "{{ command }}"
  vars:
    tls_flag: "{{ '-Z' if (openldap_use_tls | bool) else '' }}"
    base_dn: "dc={{ openldap_second_level_domain }},dc={{ openldap_top_level_domain }}"
    bind_dn: "cn={{ openldap_admin_user }},{{ base_dn }}"
    command: >-
      ldapsearch {{ tls_flag }} -x -H
      ldap://localhost:{{ openldap_cleartext_port | default(389) }}
      -D "{{ bind_dn }}" -w "{{ openldap_admin_password }}"
      -b "{{ base_dn }}" -s base
  register: ldap_bind_test
  changed_when: false
  no_log: true

- name: Verify Secure LDAPS Bind (Port 636)
  ansible.builtin.command: "{{ command }}"
  vars:
    base_dn: "dc={{ openldap_second_level_domain }},dc={{ openldap_top_level_domain }}"
    bind_dn: "cn={{ openldap_admin_user }},{{ base_dn }}"
    command: >-
      ldapsearch -x -H ldaps://localhost:{{ openldap_port }}
      -D "{{ bind_dn }}" -w "{{ openldap_admin_password }}"
      -b "{{ base_dn }}" -s base
  environment:
    LDAPTLS_REQCERT: allow
  register: ldaps_test
  changed_when: false
  no_log: true # Keeps password out of the Ansible logs
  when: openldap_use_tls | bool
