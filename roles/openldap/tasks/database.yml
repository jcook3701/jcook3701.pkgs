---
- name: Generate OpenLDAP admin password hash
  ansible.builtin.shell: "slappasswd -s {{ openldap_admin_password }}"
  register: openldap_hashed_pass_cmd
  no_log: true
  changed_when: false

- name: Set hashed password as fact
  ansible.builtin.set_fact:
    openldap_admin_password_hashed: "{{ openldap_hashed_pass_cmd.stdout }}"

- name: Stop slapd for initial setup
  ansible.builtin.service:
    name: slapd
    state: stopped

- name: Clear LDAP config for clean bootstrap
  ansible.builtin.file:
    path: "{{ openldap_directory.slapd }}"
    state: "{{ item }}"
    owner: openldap
    group: openldap
    mode: "0750"
  loop: [absent, directory]
  become: true

- name: Deploy bootstrap configuration from J2 template
  ansible.builtin.template:
    src: bootstrap_config.ldif.j2
    dest: /tmp/bootstrap_config.ldif
    owner: root
    group: root
    mode: "0600"

- name: Initialize OpenLDAP configuration offline
  ansible.builtin.command: >-
    slapadd -v -n 0 -F {{ openldap_directory.slapd }} -l /tmp/bootstrap_config.ldif
  become: true

- name: Start slapd service
  ansible.builtin.service:
    name: slapd
    state: started

- name: Deploy Database OLC configuration LDIF
  ansible.builtin.template:
    src: db_config.ldif.j2
    dest: "/tmp/db_config.ldif"
    owner: root
    group: root
    mode: "0600"

- name: Apply OLC configuration to slapd
  ansible.builtin.shell: "ldapmodify -Y EXTERNAL -H ldapi:/// -f /tmp/db_config.ldif"
  register: ldap_modify_result
  failed_when:
    - ldap_modify_result.rc != 0
    - "'Already exists' not in ldap_modify_result.stderr"
  changed_when: "'modifying entry' in ldap_modify_result.stdout"

- name: Upload custom LDIF schemas to the guest
  ansible.builtin.copy:
    src: "schema/"
    dest: "/etc/ldap/schema/"
    owner: root
    group: root
    mode: "0644"

- name: List all LDIF files in the schema directory
  ansible.builtin.find:
    paths: "/etc/ldap/schema"
    patterns: "*.ldif"
  register: found_schemas

- name: Offline import using slapadd (The script way)
  ansible.builtin.shell: "slapadd -v -n 0 -F {{ openldap_directory.slapd }} -l {{ item }} > /dev/null 2>&1"
  loop: "{{ found_schemas.files | sort(attribute='path') | map(attribute='path') | list }}"
  register: slapadd_result
  failed_when:
    - slapadd_result.rc != 0
    - slapadd_result.rc != 68 # Already exists
  changed_when: slapadd_result.rc == 0

- name: Verify loaded LDAP schemas
  ansible.builtin.shell: |
    ldapsearch -Q -LLL -Y EXTERNAL -H ldapi:/// -b "cn=schema,cn=config" "(objectClass=olcSchemaConfig)" cn
  register: ldap_schema_list
  changed_when: false

- name: Display active LDAP schemas
  ansible.builtin.debug:
    msg: "The following schemas are active: {{ ldap_schema_list.stdout_lines | select('match', '^cn:.*') | list }}"

- name: Deploy base domain structure LDIF
  ansible.builtin.template:
    src: base_structure.ldif.j2
    dest: "/tmp/base_structure.ldif"
    owner: root
    group: root
    mode: "0600"

- name: Create base domain structure
  ansible.builtin.shell: "ldapadd -Y EXTERNAL -H ldapi:/// -f /tmp/base_structure.ldif"
  register: base_dn_result
  failed_when:
    - base_dn_result.rc != 0
    - "'Already exists' not in base_dn_result.stderr"
  changed_when: "'adding new entry' in base_dn_result.stdout"

- name: Test LDAP Bind (Login) as Admin
  ansible.builtin.shell: >-
    ldapsearch -x
    -H ldap://localhost
    -D "cn=admin,dc={{ openldap_second_level_domain }},dc={{ openldap_top_level_domain }}"
    -w "{{ openldap_admin_password }}"
    -b "dc={{ openldap_second_level_domain }},dc={{ openldap_top_level_domain }}"
    -s base
  register: ldap_bind_test
  changed_when: false
  no_log: true # Keeps your password out of the Ansible logs

- name: Verify Secure LDAPS Bind (Port 636)
  ansible.builtin.shell: >-
    LDAPTLS_REQCERT=allow ldapsearch -x
    -H ldaps://localhost
    -D "cn=admin,dc={{ openldap_second_level_domain }},dc={{ openldap_top_level_domain }}"
    -w "{{ openldap_admin_password }}"
    -b "dc={{ openldap_second_level_domain }},dc={{ openldap_top_level_domain }}"
    -s base
  register: ldaps_test
  changed_when: false
  no_log: true
