---
- name: Securely query local operating system group databases to check for LDAP environment presence
  ansible.builtin.getent:
    database: group
    key: "{{ openldap_group | default('openldap') }}"
    fail_key: false

- name: Determine if LDAP environment requirements are met
  ansible.builtin.set_fact:
    _ldap_environment_ready: >-
      {{ ansible_facts.getent_group is defined and
         (openldap_group | default('openldap')) in ansible_facts.getent_group and
         ansible_facts.getent_group[openldap_group | default('openldap')] is not none }}

- name: Check if the breakout LDAP keytab file is physically present on disk
  ansible.builtin.stat:
    path: "{{ openldap_file.keytab }}"
  register: _ldap_keytab_file_stat
  become: true

- name: Enforce secure filesystem group permissions on the breakout LDAP keytab file
  ansible.builtin.file:
    path: "{{ openldap_file.keytab }}"
    owner: root
    group: "{{ openldap_group | default('openldap') }}"
    mode: "0640"
  become: true
  when:
    - _ldap_environment_ready | default(false) | bool
    - _ldap_keytab_file_stat.stat.exists | default(false)
