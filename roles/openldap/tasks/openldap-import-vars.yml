---
- name: Import openldap variables OS determinate variables
  block:
    - name: Import Debian openldap variables
      ansible.builtin.include_vars:
        file: "pkgs-server/openldap/debian-openldap.yml"
      when: ansible_facts['os_family']|lower == 'debian'

    - name: Import RHEL openldap variables
      ansible.builtin.include_vars:
        file: "pkgs-server/openldap/rhel-openldap.yml"
      when: ansible_facts['os_family']|lower == 'rhel'


- name: Include necessary variables for openldap install
  block:
    - name: Import openldap configuration variables
      ansible.builtin.include_vars:
        file: "openldap-config-vars.yml"
