---
- name: Create LDAP certificate directory
  ansible.builtin.file:
    path: "{{ openldap_directory.certs }}"
    state: directory
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    mode: "0700"

- name: Generate private key for OpenLDAP
  community.crypto.openssl_privatekey:
    path: "{{ openldap_tls_key }}"
    select_crypto_backend: cryptography
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    mode: "0600"

- name: Generate Certificate Signing Request (CSR)
  community.crypto.openssl_csr:
    path: "{{ openldap_directory.certs }}/ldap.csr"
    privatekey_path: "{{ openldap_tls_key }}"
    select_crypto_backend: cryptography
    common_name: "{{ ansible_hostname }}.{{ openldap_domain_name }}"
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    mode: "0644"

- name: Generate self-signed certificate
  community.crypto.x509_certificate:
    path: "{{ openldap_tls_cert }}"
    csr_path: "{{ openldap_directory.certs }}/ldap.csr"
    privatekey_path: "{{ openldap_tls_key }}"
    provider: selfsigned
    select_crypto_backend: cryptography
    selfsigned_not_after: "+365d"
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    mode: "0644"

# ====================================================================
# SCENARIO 1: NO EXTERNAL CA SPECIFIED (Use Master Cert for Slaves)
# ====================================================================
- name: Map master self-signed cert as CA bundle on master node
  ansible.builtin.set_fact:
    openldap_tls_ca_cert: "{{ openldap_tls_cert }}"
  when:
    - openldap_node_type == 'master'
    - openldap_tls_ca_cert == "" or "master_ca.pem" in openldap_tls_ca_cert or openldap_tls_ca_cert == openldap_tls_cert

- name: DEBUG - Print absolute path strings and inventory role types
  ansible.builtin.debug:
    msg:
      - "Hostname: {{ ansible_hostname }}"
      - "Node Type: {{ openldap_node_type }}"
      - "Raw Directory Object: {{ openldap_directory | to_json }}"
      - "Calculated Cert Variable: {{ openldap_tls_cert }}"

- name: Fetch master certificate to the controller
  ansible.builtin.fetch:
    src: "{{ openldap_tls_cert }}"
    dest: "/tmp/openldap_master_cert.pem"
    flat: true
  when:
    - openldap_node_type == 'master'
    - openldap_tls_ca_cert == openldap_tls_cert

- name: Enforce execution fence until master cert file is cached on controller
  ansible.builtin.wait_for:
    path: "/tmp/openldap_master_cert.pem"
    timeout: 30
  delegate_to: localhost
  when:
    - openldap_node_type == 'slave'
    - openldap_tls_ca_cert == "" or "master_ca.pem" in openldap_tls_ca_cert

- name: Distribute master certificate to slave nodes as a trusted CA
  ansible.builtin.copy:
    src: "/tmp/openldap_master_cert.pem"
    dest: "{{ openldap_directory.certs }}/master_ca.pem"
    owner: "{{ openldap_user }}"
    group: "{{ openldap_group }}"
    mode: "0644"
  when:
    - openldap_node_type == 'slave'
    - openldap_tls_ca_cert == "" or "master_ca.pem" in openldap_tls_ca_cert

- name: Override CA path on slave nodes to point to master cert
  ansible.builtin.set_fact:
    openldap_tls_ca_cert: "{{ openldap_directory.certs }}/master_ca.pem"
  when:
    - openldap_node_type == 'slave'
    - openldap_tls_ca_cert == "" or "master_ca.pem" in openldap_tls_ca_cert

# ====================================================================
# SCENARIO 2: EXTERNAL CA SPECIFIED (Verify file presence across nodes)
# ====================================================================
- name: Check if the provided external CA file exists on target node
  ansible.builtin.stat:
    path: "{{ openldap_tls_ca_cert }}"
  register: external_ca_file
  when:
    - openldap_tls_ca_cert != ""
    - openldap_tls_ca_cert != openldap_tls_cert
    - '"master_ca.pem" not in openldap_tls_ca_cert'

- name: Fail if external CA file is missing from target filesystem
  ansible.builtin.fail:
    msg: >
      The specified external CA path '{{ openldap_tls_ca_cert }}' was not found on this system.
      Please ensure the CA file is securely provisioned before running the playbook.
  when:
    - openldap_tls_ca_cert != ""
    - openldap_tls_ca_cert != openldap_tls_cert
    - '"master_ca.pem" not in openldap_tls_ca_cert'
    - not external_ca_file.stat.exists | default(false)
