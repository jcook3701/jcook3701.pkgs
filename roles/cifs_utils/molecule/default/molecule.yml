---
dependency:
  name: "galaxy"
driver:
  name: "docker"
platforms:
  - name: "cifs-test-debian"
    image: "docker.io/geerlingguy/docker-debian12-ansible:latest"
    tmpfs:
      - "/run"
      - "/tmp"
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    cgroupns: "host"
    privileged: true

  - name: "cifs-test-rocky"
    image: "docker.io/geerlingguy/docker-rockylinux9-ansible:latest"
    tmpfs:
      - "/run"
      - "/tmp"
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    cgroupns: "host"
    privileged: true

  - name: "cifs-test-arch"
    image: "docker.io/archlinux/archlinux:latest"
    command: "/usr/lib/systemd/systemd"
    tmpfs:
      - "/run"
      - "/tmp"
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    cgroupns: "host"
    privileged: true
provisioner:
  name: "ansible"
  env:
    ANSIBLE_ROLES_PATH: "../../.."
verifier:
  name: "ansible"
