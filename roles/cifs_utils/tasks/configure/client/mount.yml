---
- name: Ensure target local CIFS mount directories exist
  ansible.builtin.file:
    path: "{{ cifs_mount.path }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "0755"
  become: true
  loop: "{{ cifs_utils_client_mounts | default([]) }}"
  loop_control:
    loop_var: cifs_mount
    label: "Creating directory: {{ cifs_mount.path }}"
  when:
    - cifs_utils_client_mounts is defined
    - cifs_utils_client_mounts | length > 0
    - cifs_utils_client_enable_mounts | bool

- name: Manage declarative remote CIFS file system mounts
  ansible.builtin.mount:
    src: "{{ cifs_mount.src }}"
    path: "{{ cifs_mount.path }}"
    fstype: "cifs"
    opts: "{{ cifs_mount.opts | default('defaults') }}"
    state: "{{ cifs_mount.state | default('mounted') }}"
  become: true
  loop: "{{ cifs_utils_client_mounts | default([]) }}"
  loop_control:
    loop_var: cifs_mount
    label: "Mounting: {{ cifs_mount.src }}"
  when:
    - cifs_utils_client_mounts is defined
    - cifs_utils_client_mounts | length > 0
    - cifs_utils_client_enable_mounts | bool
