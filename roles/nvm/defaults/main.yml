---
# -------------------------------------------------------------------------
# Lifecycle & System Access Management
# -------------------------------------------------------------------------
nvm_state: present
nvm_debug: false

# Accounts where NVM will be managed
nvm_users:
  - name: "{{ ansible_user | default(ansible_user_id) }}"

# -------------------------------------------------------------------------
# NVM Package Configuration
# -------------------------------------------------------------------------
nvm_repo_url: "https://raw.githubusercontent.com/nvm-sh/nvm/v0.41.0/install.sh"
