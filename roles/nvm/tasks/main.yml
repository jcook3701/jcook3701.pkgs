---
- name: Display NVM configuration
  ansible.builtin.debug:
    msg:
      state: "{{ nvm_state | default('present') }}"
      users: "{{ nvm_users | default([]) | map(attribute='name') | list }}"
      repo_url: "{{ nvm_repo_url | default('https://raw.githubusercontent.com/nvm-sh/nvm/v0.41.0/install.sh') }}"
      packages: "{{ nvm_pkgs | default(['git', 'curl']) }}"
  when: nvm_debug | default(false) | bool

- name: Ensure NVM is installed and configured
  ansible.builtin.include_tasks: state/install.yml
  when: nvm_state | default('present') == 'present'

- name: Ensure NVM is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: nvm_state | default('present') == 'absent'

- name: Ensure NVM is uninstalled and configurations are removed
  ansible.builtin.include_tasks: state/teardown.yml
  when: nvm_state | default('present') == 'teardown'
