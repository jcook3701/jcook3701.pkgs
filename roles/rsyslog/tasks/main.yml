---
- name: Load rsyslog OS-specific variables
  ansible.builtin.include_vars: "{{ rsyslog_vars }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: rsyslog_vars
    label: "Including variables from: {{ rsyslog_vars }}"

- name: Ensure rsyslog packages are installed and configured
  ansible.builtin.include_tasks: state/install.yml
  when: rsyslog_state | default('present') == 'present'

- name: Ensure rsyslog packages are uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: rsyslog_state | default('present') == 'absent'

- name: Teardown rsyslog, services, packages, and configuration files
  ansible.builtin.include_tasks: state/teardown.yml
  when: rsyslog_state | default('present') == 'teardown'
