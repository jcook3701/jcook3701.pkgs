---
rsyslog_os_user: "root"
rsyslog_os_group: "adm"

rsyslog_os_service: "rsyslog"
rsyslog_os_dep_pkg_names: []
rsyslog_os_pkg_names:
  - "rsyslog"

rsyslog_os_directory:
  conf: "/etc"
  conf_d: "/etc/rsyslog.d"
  state: "/var/spool/rsyslog"
  log_root: "/var/log"
