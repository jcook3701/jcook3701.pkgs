---
- name: Installing AnyDesk Repository dependencies.
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - curl
    state: present

- name: Create APT repository keys directory.
  ansible.builtin.file:
    path: "{{ anydesk_directory.keyrings }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Download AnyDesk GPG key
  ansible.builtin.get_url:
    url: "{{ anydesk_gpg_url }}"
    dest: "{{ anydesk_file.gpg }}"
    mode: "0644"
    owner: root
    group: root
    force: true

- name: Add AnyDesk repository
  ansible.builtin.lineinfile:
    path: "{{ anydesk_file.list }}"
    create: true
    mode: "0644"
    owner: root
    group: root
    line: "{{ anydesk_repo_line }}"

- name: Run apt-get update
  ansible.builtin.apt:
    update_cache: true
