---
- name: Prepare AnyDesk repositories for {{ ansible_distribution }}
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - "repo/{{ ansible_os_family | lower }}.yml"
    - "repo/default.yml"

- name: Install AnyDesk
  ansible.builtin.package:
    name: "{{ anydesk_pkg_names }}"
    state: present
