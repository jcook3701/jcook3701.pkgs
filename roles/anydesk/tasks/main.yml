---
- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Load AnyDesk OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Install AnyDesk
  ansible.builtin.include_tasks: install.yml
  when: anydesk_state | default('present') == 'present'

- name: Uninstall AnyDesk
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - anydesk_state | default('present') == 'absent'
    - anydesk_pkg_names[0] in ansible_facts.packages
