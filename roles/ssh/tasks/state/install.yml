---
- name: Install SSH package and dependencies
  ansible.builtin.package:
    name: "{{ ssh_pkg_names | default(['openssh-server']) }}"
    state: present
  become: true

- name: Configure SSH service
  ansible.builtin.include_tasks: configure/main.yml
