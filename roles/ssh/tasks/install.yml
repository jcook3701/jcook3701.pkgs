---
- name: Install SSH package and dependencies
  ansible.builtin.package:
    name: "{{ ssh_pkg_names }}"
    state: present

- name: Ensure SSH service is started and enable
  ansible.builtin.systemd:
    name: "{{ ssh_service }}"
    state: started
    enabled: true
