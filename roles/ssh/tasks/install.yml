---
- name: Install SSH package and dependencies
  ansible.builtin.package:
    name: "{{ ssh_pkg_names }}"
    state: present

- name: Generate secure sshd_config server configuration file
  ansible.builtin.template:
    src: sshd_config.j2
    dest: "{{ ssh_file.conf }}"
    group: root
    owner: root
    mode: "0600"
  notify: Restart SSH Service

- name: Ensure SSH service is started and enable
  ansible.builtin.systemd:
    name: "{{ ssh_service }}"
    state: started
    enabled: true
