---
- name: Ensure SSH service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ ssh_service }}"
    state: stopped
    enabled: false

- name: Uninstall SSH package and dependencies
  ansible.builtin.package:
    name: "{{ ssh_pkg_names }}"
    state: absent

