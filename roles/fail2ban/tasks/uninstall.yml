---
- name: Ensure Fail2ban service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ fail2ban_service }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Uninstall Fail2ban packages
  ansible.builtin.package:
    name: "{{ fail2ban_pkg_names }}"
    state: absent
