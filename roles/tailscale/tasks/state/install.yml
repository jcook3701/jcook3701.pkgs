---
- name: Install necessary dependencies
  ansible.builtin.package:
    name: "{{ tailscale_os_dep_pkg_names | default([]) }}"
    state: present
  become: true

- name: Download Tailscale VPN install script
  ansible.builtin.get_url:
    url: "{{ tailscale_repo_url }}"
    dest: "{{ tailscale_file.script }}"
    mode: "0755"
    owner: root
    group: root

- name: Run Tailscale VPN install script
  ansible.builtin.command: "{{ tailscale_file.script }}"
  register: tailscale_install_result
  changed_when: ('Installation complete' in tailscale_install_result.stdout | lower)

- name: Clean up Tailscale VPN install script
  ansible.builtin.file:
    path: "{{ tailscale_file.script }}"
    state: absent
  become: true

- name: Ensure Tailscale VPN is configured
  ansible.builtin.include_tasks: configure/main.yml
