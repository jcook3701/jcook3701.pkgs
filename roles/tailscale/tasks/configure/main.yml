---
- name: Deploy Tailscale template
  ansible.builtin.template:
    src: "tailscaled.j2"
    dest: "{{ tailscale_file.tailscaled }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart tailscale service

- name: Authenticate and configure Tailscale (Non-interactive)
  ansible.builtin.command:
    cmd: >-
      tailscale up --reset
      --accept-dns={{ tailscale_accept_dns | lower }}
      {{ tailscale_hostname | ternary('--hostname=' ~ tailscale_hostname, '') }}
      {{ tailscale_advertise_exit_node | ternary('--advertise-exit-node', '') }}
      {{ tailscale_no_logs | ternary('--no-logs', '') }}
      {{ tailscale_enable_ssh | ternary('--ssh', '') }}
      {{ tailscale_advertise_routes | length | ternary('--advertise-routes=' ~ tailscale_advertise_routes | join(','), '') }}
      {{ tailscale_auth_key | ternary('--auth-key=' ~ tailscale_auth_key, '') }}
      {{ tailscale_up_extra_flags }}
  register: tailscale_auth_result
  when: tailscale_auth_key is defined and tailscale_auth_key is not none
  changed_when: tailscale_auth_result.rc == 0
  failed_when:
    - tailscale_auth_result.rc != 0
    - ('already authenticated' not in tailscale_auth_result.stderr | lower)
    - ('already logged in' not in tailscale_auth_result.stdout | lower)
  no_log: true
  become: true
