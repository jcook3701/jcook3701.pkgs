---
- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Load Tailscale OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Tailscale Install
  ansible.builtin.include_tasks: install.yml
  when: tailscale_state | default('present') == 'present'

- name: Uninstall Tailscale
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - tailscale_state | default('present') == 'absent'
    - tailscale_pkg_names[0] in ansible_facts.packages
