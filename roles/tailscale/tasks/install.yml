---
- name: Install necessary dependencies
  ansible.builtin.package:
    name: "{{ tailscale_dependency_pkgs }}"
    state: present

- name: Download tailscale setup script
  ansible.builtin.get_url:
    url: "{{ tailscale_repo_url }}"
    dest: "{{ tailscale_file.script }}"
    mode: "0755"
    owner: root
    group: root

- name: Run tailscale setup script
  ansible.builtin.command: "{{ tailscale_file.script }}"
  register: tailscale_install_result
  changed_when: "'Installation complete' in tailscale_install_result.stdout"

- name: Authenticate Tailscale (Non-interactive)
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    authkey: "--authkey={{ tailscale_auth_key }}"
    command: "tailscale up {{ authkey }} --reset"
  register: tailscale_auth_result
  changed_when: tailscale_auth_result.rc == 0
  failed_when:
    - tailscale_auth_result.rc != 0
    - "'already authenticated' not in tailscale_auth_result.stderr"
  become: true
  when: tailscale_auth_key is defined
