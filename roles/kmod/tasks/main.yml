---
- name: Load Kmod OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install Kmod packages
  ansible.builtin.include_tasks: install.yml
  when: kmod_state | default('present') == 'present'

- name: Uninstall Kmod packages
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - kmod_state | default('present') == 'absent'
    - kmod_pkg_names[0] in ansible_facts.packages
  tags:
    - never
