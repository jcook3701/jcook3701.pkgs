---
- name: Setup NAPS Package Repository
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ naps_repo_id }}"
    repo_add_name: "{{ naps_repo_name }}"
    repo_add_enabled: true
    # Debian Overrides (Passed cleanly when running on Debian nodes)
    repo_add_debian_uris: "{{ naps_debian_uris | default(omit) }}"
    repo_add_debian_suites: "{{ naps_debian_suites | default(omit) }}"
    repo_add_debian_components: "{{ naps_debian_component | default(omit) }}"
    repo_add_debian_signed_by: "{{ naps_debian_signed_by | default(omit) }}"
    # Red Hat Overrides
    repo_add_redhat_baseurl: "{{ naps_redhat_baseurl | default(omit) }}"
    # Arch Linux Overrides
    repo_add_arch_server: "{{ naps_arch_server | default(omit) }}"
  when: ansible_os_family in ['Debian', 'Redhat']

- name: Installing NAPS
  ansible.builtin.include_role:
    name: jcook3701.utils.pkg_manager
  vars:
    pkg_manager_pkgs: >-
      {{ naps_dep_pkg_names | default([])
          + naps_pkg_names | default([]) }}
    pkg_manager_state: present
    pkg_manager_update_cache: true

- name: Configure NAPS2 (Not Another PDF Scanner)
  ansible.builtin.include_tasks: configure/main.yml
