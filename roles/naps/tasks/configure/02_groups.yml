---
- name: Add users to the NAPS scanner group
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: "{{ naps_group | default('scanner') }}"
    append: true
  loop: "{{ naps_users | default([]) }}"
  loop_control:
    loop_var: user
    label: "Adding {{ user.name }} to {{ naps_group }} group"
  become: true
  when:
    - user.name is defined
    - user.name | length > 0
