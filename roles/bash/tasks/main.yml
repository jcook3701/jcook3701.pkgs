---
- name: Collect running user facts
  ansible.builtin.include_role:
    name: jcook3701.utils.general
    tasks_from: sudo_user_facts.yml
  when: sudo_user is not defined

- name: Deploy .bashrc from template
  ansible.builtin.template:
    src: .bashrc.j2
    dest: "{{ bash_user_home }}/.bashrc"
    owner: "{{ bash_user_name }}"
    group: "{{ bash_user_group }}"
    mode: "0644"
    backup: yes

- name: Deploy .bash_aliases from template
  ansible.builtin.template:
    src: .bash_aliases.j2
    dest: "{{ bash_user_home }}/.bash_aliases"
    owner: "{{ bash_user_name }}"
    group: "{{ bash_user_group }}"
    mode: "0644"

# TODO: Move this into template
- name: Set {{ editor_bashrc }} to specified $EDITOR within ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ sudo_user_home }}/.bashrc"
    line: >-
      export EDITOR="{{ editor_bashrc }}"
    state: present
