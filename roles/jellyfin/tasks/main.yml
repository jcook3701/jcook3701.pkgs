---
- name: Load Jellyfin OS-specific variables
  ansible.builtin.include_vars: "{{ jellyfin_vars }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: jellyfin_vars
    label: "Loading variables file: {{ jellyfin_vars }}"

- name: Ensure Jellyfin Media Server is installed and configured
  ansible.builtin.include_tasks: state/install.yml
  when: jellyfin_state | default('present') == 'present'

- name: Ensure Jellyfin Media Server is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: jellyfin_state | default('present') == 'absent'

- name: Teardown Jellyfin Media Server services, packages, and configuration files
  ansible.builtin.include_tasks: state/uninstall.yml
  when: jellyfin_state | default('present') == 'teardown'
