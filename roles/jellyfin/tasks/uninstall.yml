---
- name: Ensure Jellyfin service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ jellyfin_service }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Uninstall Jellyfin packages
  ansible.builtin.package:
    name: "{{ jellyfin_pkg_names }}"
    state: absent
