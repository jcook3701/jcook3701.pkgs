---
- name: Ensure Jellyfin Jellyfin exists
  ansible.builtin.group:
    name: "{{ jellyfin_group | default('jellyfin') }}"
    state: present
  become: true

- name: Add users to the Jellyfin group
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: "{{ jellyfin_group | default('jellyfin') }}"
    append: true
  loop: "{{ jellyfin_users | default([]) }}"
  loop_control:
    loop_var: user
    label: "Adding {{ user.name }} to {{ jellyfin_group }} group"
  become: true
  when:
    - user.name is defined
    - user.name | length > 0
