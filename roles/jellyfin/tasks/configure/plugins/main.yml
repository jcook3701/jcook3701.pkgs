---
- name: Ensure Jellyfin plugin configuration directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_directory.plugins }}/configurations"
    state: directory
    owner: jellyfin
    group: jellyfin
    mode: "0750"

- name: Configure LDAP Authentication plugin
  ansible.builtin.include_tasks: ldap.yml
