---
- name: Install Github CLI package and dependencies
  ansible.builtin.package:
    name: "{{ gh_pkg_names | default(['gh']) }}"
    state: present
  become: true

- name: Ensure Github CLI is configured
  ansible.builtin.include_tasks: configure/main.yml
