---
# dns switches
bind9_enable_dydns: false
bind9_enable_dnssec: true
bind9_enable_tsig: false
bind9_enable_public_access: false

# Port Options
bind9_dns_port: 53
bind9_rndc_port: 953

# Key Options
bind9_ksk_algorithm: "RSASHA256"
bind9_zsk_algorithm: "RSASHA256"
bind9_tsig_algorithm: "HMAC-SHA256"
bind9_ksk_size: 4096
bind9_zsk_size: 2048
bind9_tsig_size: 256

# Domain Options
bind9_top_level_domain: "com"
bind9_second_level_domain: "jcook3701"
bind9_domain_name: "{{ bind9_second_level_domain }}.{{ bind9_top_level_domain }}"

# ip_address_space - Standard Options 10.0.0 and 192.168.0
bind9_ip_address_space: "10.0.0"
bind9_reverse_ip_address_space: "0.0.10"

# Static IP of new (DNS) server
bind9_dns_server_ip_address: "{{ bind9_ip_address_space }}.2"

# prefix_length - Standard Options: 8, 12, 16, 24
bind9_prefix_length: "24"
