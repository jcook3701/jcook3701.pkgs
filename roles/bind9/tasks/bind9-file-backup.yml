---
- name: Backup initial Debian Bind9 configuration files
  when: ansible_facts['os_family']|lower == 'debian'
  block:

    - name: Backup named.conf to named.conf.bak
      ansible.builtin.command: >
        mv {{ bind9_file.named_conf }} {{ bind9_file.named_conf }}.bak

    - name: Backup named.conf.local to named.conf.local.bak
      ansible.builtin.command: >
        mv {{ bind9_file.named_conf_local }} {{ bind9_file.named_conf_local }}.bak

    - name: Backup named.conf.options to named.conf.options.bak
      ansible.builtin.command: >
        mv {{ bind9_file.named_conf_options }} {{ bind9_file.named_conf_options }}.bak
