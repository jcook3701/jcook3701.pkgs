---
- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Load Bind9 OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Bind9 Install
  ansible.builtin.include_tasks: install.yml
  when: bind9_state | default('present') == 'present'

- name: Bind9 Uninstall
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - bind9_state | default('present') == 'absent'
    - ansible_facts.packages is defined
    - bind9_pkg_names[0] in ansible_facts.packages

- name: Teardown Bind9
  ansible.builtin.include_tasks: teardown.yml
  when: bind9_state | default('present') == 'teardown'
