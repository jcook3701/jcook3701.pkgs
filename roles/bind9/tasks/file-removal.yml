---
- name: Remove generated template files needed for Bind9 configuration
  ansible.builtin.file:
    path: "{{ file }}"
    state: absent
  loop:
    - "{{ bind9_file.named_conf }}"
    - "{{ bind9_file.named_conf_local }}"
    - "{{ bind9_file.named_conf_options }}"
    - "{{ bind9_file.named_conf_controls }}"
    - "{{ bind9_file.named_conf_log }}"
    - "{{ bind9_file.forward_zone }}"
    - "{{ bind9_file.reverse_zone }}"
  loop_control:
    loop_var: file

- name: Ensure removal of files needed for Bind9 configuration
  ansible.builtin.file:
    path: "{{ file }}"
    state: absent
  loop:
    - "{{ bind9_options.secroots_file }}"
    - "{{ bind9_options.dump_file }}"
    - "{{ bind9_options.statistics_file }}"
    - "{{ bind9_options.memstatistics_file }}"
  loop_control:
    loop_var: file

