---
- name: Create directories needed for Bind9 setup
  block:

    - name: Check if directory exists
      ansible.builtin.stat:
        path: "{{ item }}"
      register: existing_dirs
      loop: "{{ bind9_os_directory.values() | list }}"

    - name: Create bind9 base directories
      when: not item.stat.exists
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: directory
        group: bind
        owner: bind
        mode: "0775"
      loop: "{{ existing_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

      # NOTE: This is otherwise handled in bind9-dnssec-keygen-and-sign.yml
    - name: Ensure key directories exist
      when: zone.inline_signing | bool
      ansible.builtin.file:
        path: "{{ zone.key_directory }}"
        state: directory
        owner: bind
        group: bind
        mode: "0775"
      loop: "{{ bind9_zones }}"
      loop_control:
        loop_var: zone
        label: "{{ zone.key_directory }}"
