---
- name: Generate named.conf configuration file
  ansible.builtin.template:
    src: "{{ ansible_facts['os_family'] | lower }}/named.conf.j2"
    dest: "{{ bind9_file.named_conf }}"
    group: "{{ bind9_user }}"
    owner: "{{ bind9_user }}"
    mode: "0644"
    backup: true
  notify: Restart bind9 DNS

- name: Generate named.conf.local configuration file
  ansible.builtin.template:
    src: "{{ ansible_facts['os_family'] | lower }}/named.conf.local.j2"
    dest: "{{ bind9_file.named_conf_local }}"
    group: "{{ bind9_user }}"
    owner: "{{ bind9_user }}"
    mode: "0644"
    backup: true
  notify: Restart bind9 DNS

- name: Generate named.conf.options configuration file
  ansible.builtin.template:
    src: "{{ ansible_facts['os_family'] | lower }}/named.conf.options.j2"
    dest: "{{ bind9_file.named_conf_options }}"
    group: "{{ bind9_user }}"
    owner: "{{ bind9_user }}"
    mode: "0644"
    backup: true
  notify: Restart bind9 DNS

- name: Generate named.conf.controls configuration file
  ansible.builtin.template:
    src: "{{ ansible_facts['os_family'] | lower }}/named.conf.controls.j2"
    dest: "{{ bind9_file.named_conf_controls }}"
    group: "{{ bind9_user }}"
    owner: "{{ bind9_user }}"
    mode: "0644"
    backup: true
  notify: Restart bind9 DNS

- name: Generate named.conf.log configuration file
  ansible.builtin.template:
    src: "{{ ansible_facts['os_family'] | lower }}/named.conf.log.j2"
    dest: "{{ bind9_file.named_conf_log }}"
    group: "{{ bind9_user }}"
    owner: "{{ bind9_user }}"
    mode: "0644"
    backup: true
  notify: Restart bind9 DNS

- name: debug zone records
  ansible.builtin.debug:
    msg: "{{ bind9_zone_records }}"
  when: false

- name: Generate forward zone configuration file
  ansible.builtin.template:
    src: "{{ ansible_facts['os_family'] | lower }}/db.forward.zone.j2"
    dest: "{{ bind9_file.forward_zone }}"
    group: "{{ bind9_user }}"
    owner: "{{ bind9_user }}"
    mode: "{{ (bind9_enable_dydns | bool) | ternary('0775', '0664') }}"
    backup: true
  notify: RNDC Reload
  when: bind9_is_primary | bool

- name: Generate reverse zone configuration file
  ansible.builtin.template:
    src: "{{ ansible_facts['os_family'] | lower }}/db.reverse.zone.j2"
    dest: "{{ bind9_file.reverse_zone }}"
    group: "{{ bind9_user }}"
    owner: "{{ bind9_user }}"
    mode: "{{ (bind9_enable_dydns | bool) | ternary('0775', '0664') }}"
    backup: true
  notify: RNDC Reload
  when: bind9_is_primary | bool
