---
- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Load Setupcon OS-specific variables
  ansible.builtin.include_vars: "{{ setupcon_vars }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: setupcon_vars
    label: "Loading variables file: {{ setupcon_vars }}"

# -------------------------------------------------------------------------
# NOTE: Setupcon is a system package and should not be uninstalled.
#       Only configurations should be removed if the state is set
#       to 'absent' or 'teardown'.
# -------------------------------------------------------------------------
- name: Ensure Setupcon packages are installed
  ansible.builtin.include_tasks: install.yml
  when: setupcon_state | default('present') == 'present'

- name: Ensure Setupcon configurations are torn down
  ansible.builtin.include_tasks: teardown.yml
  when:
    - setupcon_state | default('present') in ['absent', 'teardown']
    - ansible_facts.packages is defined
    - setupcon_pkg_names[0] in ansible_facts.packages
