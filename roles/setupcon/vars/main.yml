---
setupcon_user: root
setupcon_group: root

setupcon_dep_pkg_names: "{{ setupcon_os_dep_pkg_names | default([]) }}"

setupcon_directory:
  config: /etc/default

setupcon_file:
  console_setup_config: "{{ setupcon_directory.config ~ '/console-setup'
                | default('/etc/default/console-setup') }}"
  keyboard_config: "{{ setupcon_directory.config ~ '/keyboard'
                | default('/etc/default/keyboard') }}"
