---
- name: Collect running user facts
  ansible.builtin.include_tasks: utilities/sudo_user_facts.yml
  when: sudo_user is not defined

- name: Include ruby variables
  ansible.builtin.include_vars: pkgs-software-development/ruby/ruby.yml

  # TODO: Actually remove ruby and directories related.

- name: Update .bashrc for ruby removal
  ansible.builtin.blockinfile:
    dest: "{{ sudo_user_home }}/.bashrc"
    marker: "{{ ruby_marker }}"
    block: "{{ ruby_bashrc }}"
    state: absent
  when: sudo_user != "root" and ruby_bashrc is defined
