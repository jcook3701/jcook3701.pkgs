---
- name: Collect running user facts
  ansible.builtin.include_role:
    name: jcook3701.utils.general
    task_from: sudo_user_facts.yml
  when: sudo_user is not defined

- name: Include ruby variables
  ansible.builtin.include_vars: ruby.yml

- name: Installing ruby
  ansible.builtin.apt:
    pkg:
      - ruby
      - ruby-dev
    state: present

- name: Create GEM_HOME Directory
  ansible.builtin.file:
    path: "{{ sudo_user_home }}/.ruby"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ sudo_user }}"
  when: sudo_user != "root"

- name: Update .bashrc for ruby
  ansible.builtin.blockinfile:
    dest: "{{ sudo_user_home }}/.bashrc"
    marker: "{{ ruby_marker }}"
    block: "{{ ruby_bashrc }}"
    state: present
  when: sudo_user != "root" and ruby_bashrc is defined

- name: Reload Shell
  ansible.builtin.include_role:
    name: jcook3701.utils.general
    task_from: reload-shell.yml
