---
- name: Ensure snapd service is started and enabled
  ansible.builtin.service:
    name: "{{ service }}"
    state: stopped
    enabled: false
  loop:
    - snapd.socket
    - snapd.service
  loop_control:
    loop_var: service

- name: Uninstall snap package.
  ansible.builtin.package:
    name: "{{ snap_pkgs }}"
    state: absent
