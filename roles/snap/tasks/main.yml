---
- name: Snap Install
  ansible.builtin.include_tasks: install.yml
  when: snap_state | default('present') == 'present'

- name: Snap Uninstall
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - snap_state | default('present') == 'absent'
    - snap_pkg_names[0] in ansible_facts.packages
