---
- name: Load Snap OS-specific variables
  ansible.builtin.include_vars: "{{ snap_vars }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: snap_vars
    label: "Loading variables file: {{ snap_vars }}"

- name: Ensure Snap is install
  ansible.builtin.include_tasks: state/install.yml
  when: snap_state | default('present') == 'present'

- name: Ensure Snap is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: snap_state | default('present') in ['absent', 'teardown']
