---
- name: Collect running user facts
  ansible.builtin.include_role:
    name: jcook3701.utils.general
    tasks_from: sudo_user_facts.yml
  when: sudo_user is not defined

- name: Load i3 OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
        - "{{ ansible_os_family | lower }}.yml"

- name: Install i3
  ansible.builtin.include_tasks: install.yml
  when: i3_state | default('present') == 'present'

- name: Uninstall i3
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - i3_state | default('present') == 'absent'
    - i3_pkg_names[0] in ansible_facts.packages
