---
# -------------------------------------------------------------------------
# Lifecycle & System Access Management
# -------------------------------------------------------------------------
git_state: present
git_debug: false

# -------------------------------------------------------------------------
# Git User Profile Configuration
# -------------------------------------------------------------------------
# Existing local accounts where Git configuration will be managed.
# Each account maintains its own Git identity and global configuration.
# Empty identity values preserve existing Git settings.
git_users:
  - name: "{{ ansible_user | default(ansible_user_id) }}"
    git_name: ""
    git_email: ""
