---
argument_specs:
  main:
    short_description: "Manage Flatpak installation and repositories."
    description: "This role ensures Flatpak is configured and manages remote repositories."
    author: "Your Name"
    options:
      # -------------------------------------------------------------------------
      # Lifecycle & System Access Management
      # -------------------------------------------------------------------------
      flatpak_state:
        type: "str"
        required: false
        default: "present"
        choices: ["present", "absent", "teardown"]
        description: "The desired state of the Flatpak package and configuration."

      flatpak_debug:
        type: "bool"
        required: false
        default: true
        description: "Enables additional debugging output during role execution."

      flatpak_manage_group:
        type: "bool"
        default: true
        description: "Toggles whether the role ensures the foundational 'flatpak' system
          group is actively declared and maintained."

      flatpak_users:
        type: "list"
        elements: "dict"
        required: false
        default: []
        description: "A declarative array of local system accounts to be added to the
          Flatpak runtime group."
        options:
          name:
            type: "str"
            required: true
            description: "The exact local username string to grant Flatpak application
              management permissions."
          group:
            type: "str"
            required: false
            description: "The group string associated with user account."

      # -------------------------------------------------------------------------
      # Flatpak Repository Configuration
      # -------------------------------------------------------------------------
      flatpak_use_upstream_repo:
        type: "bool"
        required: false
        default: true
        description: "Controls whether the role configures upstream package
          repositories, such as the official Flatpak PPA on Ubuntu."

      flatpak_download_url:
        type: "str"
        required: false
        default: "https://ppa.launchpadcontent.net"
        description: "The base URL used to configure the upstream Flatpak
          package repository."

      flatpak_key_download_url:
        type: "str"
        required: false
        default: >-
          https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x5C6D153A17C02C337EF6C663B8B9D41229DFA5F5
        description: "The URL used to retrieve the upstream Flatpak repository
          GPG signing key."

      # -------------------------------------------------------------------------
      # Flatpak Repository Management
      # -------------------------------------------------------------------------
      flatpak_manage_repos:
        type: "bool"
        required: false
        default: true
        description: "Controls whether the role should actively manage Flatpak remote repositories."

      flatpak_repos:
        type: "list"
        elements: "dict"
        required: false
        default: []
        description: "A list of Flatpak remote repositories to configure."
        options:
          name:
            type: "str"
            required: true
            description: "The internal name for the Flatpak repository (e.g., flathub)."
          url:
            type: "str"
            required: true
            description: "The full URL pointing to the .flatpakrepo file."
