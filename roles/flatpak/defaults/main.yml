---
# Lifecycle execution state for package installation or removal
flatpak_state: present

# Toggle whether to configure upstream repositories (e.g., PPA on Ubuntu)
flatpak_use_upstream_repo: false

# Toggle whether to upgrade core flatpak binaries to the latest available upstream version
flatpak_upgrade_framework: false

# Accounts granted rootless or direct access to flatpak runtime group
flatpak_users:
  - name: "{{ ansible_user | default(ansible_user_id) }}"
    group: "{{ ansible_user | default(ansible_user_id) }}"

# Manage lifecycle of the 'flatpak' system group
flatpak_manage_group: true

# A list of Flatpak remote repositories to configure.
flatpak_repos:
  - name: flathub
    url: https://dl.flathub.org/repo/flathub.flatpakrepo

# Overarching toggle to manage 'flatpak' repositories
flatpak_manage_repos: true
