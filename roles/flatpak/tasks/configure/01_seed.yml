---
- name: Look up user account information
  ansible.builtin.getent:
    database: passwd
    key: "{{ user.name }}"
  loop: "{{ flatpak_users | default([]) }}"
  loop_control:
    loop_var: user
    label: "Fetching passwd entry for {{ user.name }}"
  become: true
  when:
    - user.name is defined
    - user.name | length > 0

- name: Deploy Flatpak User Directories
  ansible.builtin.file:
    path: "{{ getent_passwd[user.name][4] }}/.local/share/flatpak"
    state: directory
    owner: "{{ user.name | default('root') }}"
    group: "{{ user.group | default('root') }}"
    mode: "0700"
  loop: "{{ flatpak_users | default([]) }}"
  loop_control:
    loop_var: user
    label: "Creating {{ user.name }} flatpak share directory"
  become: true
  when:
    - user.name is defined
    - user.name | length > 0
    - getent_passwd[user.name] is defined
