---
- name: Ensure Flatpak group settings are configured
  ansible.builtin.include_tasks: group.yml
  when:
    - ansible_os_family in ['Debian', 'Redhat']
    - flatpak_manage_group | default(true) | bool

- name: Ensure Flatpak repositories are configured
  ansible.builtin.include_tasks: repository.yml
  when: flatpak_manage_repos | default(true) | bool
