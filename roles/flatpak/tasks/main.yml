---
- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Load Flatpak OS-specific variables
  ansible.builtin.include_vars: "{{ flatpak_vars }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: flatpak_vars
    label: "Loading variables file: {{ flatpak_vars }}"

- name: Ensure Flatpak is installed and configured
  ansible.builtin.include_tasks:  state/install.yml
  when: flatpak_state | default('present') == 'present'

- name: Ensure Flatpak is purged from system
  ansible.builtin.include_tasks: state/uninstall.yml
  when: flatpak_state | default('present') in ['absent', 'teardown']
