---
- name: Determine if target Debian/Ubuntu host uses legacy apt
  ansible.builtin.set_fact:
    repo_add_is_legacy_apt: "{{ true if (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version | int < 20)
      or (ansible_distribution == 'Debian' and ansible_distribution_major_version | int < 11) else false }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: Setup Flatpak Package Repository for Legacy Systems
  ansible.builtin.include_role:
    name: jcook3701.utils.repo_add
  vars:
    repo_add_id: "{{ flatpak_repo_id }}"
    repo_add_name: "{{ flatpak_repo_name }}"
    repo_add_enabled: true
    # Debian Overrides (Passed cleanly when running on Debian nodes)
    repo_add_debian_uris: "{{ flatpak_debian_uris | default(omit) }}"
    repo_add_debian_suites: "{{ flatpak_debian_suites | default(omit) }}"
    repo_add_debian_components: "{{ flatpak_debian_component | default(omit) }}"
    repo_add_debian_signed_by: "{{ flatpak_debian_signed_by | default(omit) }}"
  when: repo_add_is_legacy_apt | bool

- name: Installing Flatpak package and dependencies
  ansible.builtin.package:
    name: >-
      {{ flatpak_dep_pkg_names | default([])
          + flatpak_pkg_names | default([]) }}
    state: present
  become: true

- name: Ensure Flatpak is configured
  ansible.builtin.include_tasks: configure/main.yml
