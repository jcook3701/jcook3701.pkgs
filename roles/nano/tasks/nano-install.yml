---
- name: Import Nano variables
  ansible.builtin.include_tasks:
    file: nano-import-vars.yml

- name: Install nano package
  ansible.builtin.apt:
    name: "nano"
    state: present

- name: Filter interactive users
  ansible.builtin.include_role:
    name: jcook3701.utils.general
    task_from: filters/users-with-home-directory.yml

- name: Create nano configuration file
  ansible.builtin.template:
    src: "pkgs-common/nano/.nanorc.j2"
    dest: "{{ user.split(':')[5] }}/.nanorc"
    owner: "{{ user.split(':')[0] }}"
    group: "{{ user.split(':')[0] }}"
    mode: "0644"
  loop: "{{ interactive_users }}"
  loop_control:
    loop_var: user
    label: "{{ user.split(':')[0] }}"
