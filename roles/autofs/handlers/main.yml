---
- name: Verify configuration syntax using automount engine
  ansible.builtin.command: "automount --test {{ autofs_file.master_file }}"
  register: _autofs_handler_syntax_check
  changed_when: false
  failed_when: >
    (_autofs_handler_syntax_check.rc != 0) or
    ('error' in _autofs_handler_syntax_check.stderr | lower) or
    ('critical' in _autofs_handler_syntax_check.stderr | lower) or
    ('failed to load' in _autofs_handler_syntax_check.stdout | lower)
  listen: "Restart Autofs Services"

- name: Reload autofs systemd daemon following valid verification pass
  ansible.builtin.systemd:
    name: "{{ autofs_service }}"
    state: restarted
  listen: "Restart Autofs Services"
  when:
    - _autofs_handler_syntax_check is defined
    - not _autofs_handler_syntax_check.failed
