---
- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Load Autofs OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"
    - "{{ ansible_os_family | lower }}.yml"
    - "{{ ansible_os_family | lower }}.yml"

- name: Install Autofs
  ansible.builtin.include_tasks: install.yml
  when:
    - autofs_state | default('present') == 'present'

- name: Uninstall Autofs
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - autofs_state | default('present') == 'absent'
    - ansible_facts.packages is defined
    - autofs_package_names[0] in ansible_facts.packages

- name: Teardown Autofs
  ansible.builtin.include_tasks: teardown.yml
  when:
    - autofs_state | default('present') == 'teardown'
