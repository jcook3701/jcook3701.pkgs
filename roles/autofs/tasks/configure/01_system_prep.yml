---
- name: Ensure unified configuration parent directory exists
  ansible.builtin.file:
    path: "{{ autofs_directory.conf }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  become: true

- name: Ensure local service cache tracking directory exists
  ansible.builtin.file:
    path: "{{ autofs_directory.db }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  become: true
