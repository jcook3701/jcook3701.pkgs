---
- name: Load rdiff-backup OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Install rdiff-backup packages
  ansible.builtin.include_tasks: install.yml
  when: rdiff_backup_state | default('present') == 'present'

- name: Uninstall rdiff-backup packages
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - rdiff_backup_state | default('present') == 'absent'
    - rdiff_backup_pkg_names[0] in ansible_facts.packages
