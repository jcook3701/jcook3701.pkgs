---
vsftpd_pkgs:
  - vsftpd

vsftpd_service: "vsftpd"

# TODO: create map for true==YES, false==NO
vsftpd_conf:
  anonymous_enable: "YES"
  local_enable: "YES"
  write_enable: "YES"
  local_umask: "022"
  dirmessage_enable: "YES"
  xferlog_enable: "YES"
  connect_from_port_20: "YES"
  xferlog_std_format: "YES"
  listen: "NO"
  listen_ipv6: "YES"
  pam_service_name: "vsftpd"
  userlist_enable: "YES"
  tcp_wrappers: "YES"
