---
- name: Load vsftpd OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Install vsftpd
  ansible.builtin.include_tasks: install.yml
  when: vsftpd_state | default('present') == 'present'

- name: Uninstall vsftpd
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - vsftpd_state | default('present') == 'absent'
    - vsftpd_pkg_names[0] in ansible_facts.packages
