---
- name: Ensure vsftpd service is stopped and disabled
  ansible.builtin.systemd:
    name: "{{ vsftpd_service }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Remove vsftpd configuration file
  ansible.builtin.file:
    path: "{{ vsftpd_file.conf }}"
    state: absent

- name: Uninstall vsftpd package and dependencies.
  ansible.builtin.package:
    name: "{{ vsftpd_pkg_names }}"
    state: absent
