---
# Lifecycle State
vsftpd_state: present

# Network Ports
vsftpd_port: "21"
vsftpd_data_port: "20"

# Core FTP Options
vsftpd_anonymous_enable: "NO"
vsftpd_local_enable: "YES"
vsftpd_write_enable: "YES"
vsftpd_local_umask: "022"
vsftpd_dirmessage_enable: "YES"
vsftpd_xferlog_enable: "YES"
vsftpd_connect_from_port_20: "YES"
vsftpd_xferlog_std_format: "YES"

# Process Listening
vsftpd_listen: "NO"
vsftpd_listen_ipv6: "YES"
vsftpd_userlist_enable: "YES"
vsftpd_tcp_wrappers: "YES"

# --- SSL/TLS Settings ---
vsftpd_ssl_enable: "YES"
# Auto-generate self-signed cert if true. Set to false if providing your own.
vsftpd_ssl_self_signed: true
vsftpd_ssl_cert_path: "{{ vsftpd_directory.conf }}/vsftpd.pem"
vsftpd_ssl_key_path: "{{ vsftpd_directory.conf }}/vsftpd.pem"

# Explicit FTPS enforcement toggles
vsftpd_allow_anon_ssl: "NO"
vsftpd_force_local_data_ssl: "YES"
vsftpd_force_local_logins_ssl: "YES"
vsftpd_ssl_tlsv1: "YES"
vsftpd_ssl_sslv2: "NO"
vsftpd_ssl_sslv3: "NO"
