---
argument_specs:
  main:
    short_description: "MIT Kerberos V5 cluster orchestration and client registration role."
    description: >-
      This role deploys, configures, and secures an MIT Kerberos V5 infrastructure.
      It supports initializing master KDCs, secondary replicas, and automated
      client node realm attachments with secure keytab generation on playbook re-runs.
    author: "Jared Cook"
    options:
      kerberos_state:
        type: str
        default: "present"
        choices: ["present", "absent", "teardown"]
        description: "The operational state of the Kerberos deployment."

      kerberos_node_type:
        type: str
        default: "client"
        choices: ["master", "replica", "client"]
        description: "The structural role profile of the target host within the realm."

      kerberos_admin_servers:
        type: list
        elements: str
        default: []
        description: "List of fully qualified domain names mapping to administrative master KDC nodes."

      kerberos_replica_servers:
        type: list
        elements: str
        default: []
        description: "List of fully qualified domain names mapping to secondary read-only database replicas."

      kerberos_client_nodes:
        type: list
        elements: str
        default: []
        description: "List of client endpoints slated for realm registration and machine keytab generation."

      kerberos_samba_file_servers:
        type: "list"
        elements: "str"
        default: []
        required: false
        description: >-
          An explicit list of hostnames hosting corporate Samba file servers.
          The Master KDC uses this array to iterate through and inject 'cifs/'
          service principals into the staging keytabs during infrastructure execution passes.

      kerberos_nfs_file_servers:
        type: "list"
        elements: "str"
        default: []
        required: false
        description: >-
          An explicit list of hostnames hosting secure NFS filesystems.
          The Master KDC uses this array to iterate through and inject 'nfs/'
          service principals into the staging keytabs during infrastructure execution passes.

      kerberos_http_servers:
        type: "list"
        elements: "str"
        default: []
        required: false
        description: >-
          An explicit list of hostnames hosting web servers or administrative portals.
          The Master KDC uses this array to iterate through and inject 'HTTP/'
          service principals into the staging keytabs during infrastructure execution passes.

      kerberos_ldap_servers:
        type: "list"
        elements: "str"
        default: []
        required: false
        description: >-
          An explicit list of hostnames hosting secure OpenLDAP directory nodes.
          The Master KDC uses this array to iterate through and inject 'ldap/'
          service principals into the staging keytabs during infrastructure execution passes.

      kerberos_propagation_servers:
        type: "list"
        elements: "str"
        required: false
        default: []
        description: >-
          A dynamically computed list containing both master and replica KDC hostnames.
          Used by the configuration engine to map authorized database propagation
          endpoints and replication access control lists.

      kerberos_all_nodes:
        type: "list"
        required: false
        default: []
        description: >-
          A dynamically computed list containing a completely unified and deduplicated array
          of all physical machine FQDNs across the entire network cluster. Built by combining
          infrastructure, client, and individual application service hosts.

      kerberos_port:
        type: str
        default: "88"
        description: "The network port utilized by the core Key Distribution Center (KDC) token service."

      kerberos_admin_port:
        type: str
        default: "749"
        description: "The network port utilized by the remote administration server daemon (kadmind)."

      kerberos_admin_bind_all:
        type: str
        default: "false"
        choices: ["true", "false"]
        description: "Toggle string ('true' or 'false') to force kadmind to bind globally vs loopback."

      kerberos_iprop_enable:
        type: str
        default: "true"
        choices: ["true", "false"]
        description: "Toggle string ('true' or 'false') to activate the incremental database replication engine."

      kerberos_iprop_port:
        type: str
        default: "754"
        description: "The dedicated network port utilized by the Master KDC to stream log updates to Replica nodes."

      kerberos_iprop_replica_poll:
        type: str
        default: "2m"
        description: "The interval frequency window at which Replica nodes poll the Master KDC for database logs."

      kerberos_admin_user:
        type: str
        default: "kadmin"
        description: "The primary root administrative principal username used for remote tree modifications."

      kerberos_admin_password:
        type: str
        default: "SecretPassword123"
        description: "The plaintext credential pairing used to secure the administrative kadmin principal account."

      kerberos_use_stash_file:
        type: bool
        default: true
        description: "Toggle to compile and write the local master database stash unlock key onto the storage tier."

      kerberos_policy_min_length:
        type: int
        default: 8
        description: "The minimum allowable character length for realm password policy profiles."

      kerberos_policy_min_classes:
        type: int
        default: 3
        description: "The minimum number of character classes required by the realm password complexity rules."

      kerberos_policy_history_num:
        type: int
        default: 5
        description: "The number of unique past passwords tracked to prevent standard credential recycling."

      kerberos_top_level_domain:
        type: str
        default: "com"
        description: "The topmost tier routing identifier component used to anchor the network domain name."

      kerberos_second_level_domain:
        type: str
        default: "example"
        description: "The primary corporate domain namespace token used to evaluate structural naming fields."

      kerberos_dns_lookup_realm:
        type: str
        default: "false"
        choices: ["true", "false"]
        description: "Toggle string allowing clients to use DNS SRV records to discover realm parameters."

      kerberos_dns_lookup_kdc:
        type: str
        default: "false"
        choices: ["true", "false"]
        description: "Toggle string allowing clients to resolve KDC host nodes directly via standard DNS lookups."

      kerberos_ticket_lifetime:
        type: str
        default: "24h"
        description: "The operational duration limit mapped onto valid standard user Ticket Granting Tickets."

      kerberos_renew_lifetime:
        type: str
        default: "7d"
        description: "The absolute renewal boundary limit attached to standard structural ticket configurations."

      kerberos_forwardable:
        type: str
        default: "true"
        choices: ["true", "false"]
        description: "Toggle string dictating whether issued tokens can be cleanly forwarded across distinct system boundaries."

      kerberos_max_clock_skew:
        type: str
        default: "5m"
        description: "The maximum timing drift window allowed before processing synchronization token requests."

      kerberos_dns_canonicalize_hostname:
        type: str
        default: "true"
        required: false
        choices: ["true", "false"]
        description: >-
          Controls whether the local Kerberos library performs canonicalization on hostnames
          via DNS. Must be enabled (true) to support secure GSSAPI/Samba SMB ticket generation.

      kerberos_rdns:
        type: str
        default: "true"
        required: false
        choices: ["true", "false"]
        description: >-
          Controls whether the local Kerberos library performs reverse DNS (PTR) verification
          when establishing host mappings. Crucial for proper cross-platform Samba authorization.

      kerberos_encryption_types:
        type: list
        default: ["aes256-cts-hmac-sha1-96"]
        description: "The principal key types generated during the master cryptographic database compilation."

      kerberos_permitted_enctypes:
        type: list
        default: ["aes256-cts-hmac-sha1-96", "aes128-cts-hmac-sha1-96"]
        choices:
          - "aes256-cts-hmac-sha1-96"
          - "aes128-cts-hmac-sha1-96"
          - "aes256-cts"
          - "aes128-cts"
        description: "The complete string listing of permitted cryptographic transaction formats allowed over the wire."

      kerberos_default_tgs_enctypes:
        type: list
        default: ["aes256-cts-hmac-sha1-96", "aes128-cts-hmac-sha1-96"]
        choices:
          - "aes256-cts-hmac-sha1-96"
          - "aes128-cts-hmac-sha1-96"
          - "aes256-cts"
          - "aes128-cts"
        description: "The fallback encryption algorithms used when structuring Ticket Granting Server challenges."

      kerberos_default_tkt_enctypes:
        type: list
        default: ["aes256-cts-hmac-sha1-96", "aes128-cts-hmac-sha1-96"]
        choices:
          - "aes256-cts-hmac-sha1-96"
          - "aes128-cts-hmac-sha1-96"
          - "aes256-cts"
          - "aes128-cts"
        description: "The baseline encryption algorithm assigned to standard endpoint user sessions."

      kerberos_client_auto_register_host:
        type: str
        default: "true"
        choices: ["true", "false"]
        description: "Toggle string driving automated target host principal registration and local file keytab transfers."

      kerberos_bootstrap_users:
        type: list
        elements: dict
        description: "Array listing of core system accounts used to seed primary principals onto the storage database."
        options:
          username:
            type: "str"
            required: true
            description: "Unique account logon identity string."
          firstname:
            type: "str"
            description: "Given name utilized for display formatting."
          lastname:
            type: "str"
            description: "Surname field utilized for display formatting."
          description:
            type: "str"
            description: "Administrative notation regarding the account purpose."
          title:
            type: "str"
            description: "Organizational job title designation."
          company:
            type: "str"
            description: "Corporate entity grouping descriptor."
          mail:
            type: "str"
            description: "Primary electronic email mapping destination address."
          uid:
            type: "int"
            required: true
            description: "Explicit corporate numeric POSIX User Identifier mapping."
          gid:
            type: "int"
            required: true
            description: "Explicit corporate numeric POSIX Group Identifier mapping."
          primary_group:
            type: "str"
            description: "Default creation group ownership assignment parameter."
          password:
            type: "str"
            required: true
            description: "Passphrase verification security authentication token."
          groups:
            type: "list"
            elements: "str"
            description: "Collection array detailing supplementary security group memberships."
          is_sudoer:
            type: "bool"
            description: "Controls privilege escalation assignments across client layers."
          is_pxe_worker:
            type: "bool"
            description: "Custom network lifecycle flag tagging infrastructure automation profiles."
          is_samba_user:
            type: "bool"
            description: "Enables structural generation of Windows-compatible NT password hashes and security descriptors required for central SMB/CIFS file share mounting."
          login_shell:
            type: "str"
            description: "Target execution command interpreter binary location path."
          home_directory:
            type: "str"
            description: "Absolute localized system path for user desktop profile storage."
          password_must_change:
            type: "bool"
            description: "Forces mandatory interactive security credential updates upon first login."
          account_disabled:
            type: "bool"
            description: "Toggles headless lockout status without destructive database pruning."
          ssh_public_keys:
            type: "list"
            elements: "str"
            description: "Cryptographic validation matrices for public key terminal connections."

      kerberos_domain_realms:
        type: list
        elements: dict
        description: "Mapping configurations locking local network domain suffixes straight to valid realms."
        options:
          domain:
            type: str
            required: true
            description: "The string text domain format string evaluated by client resolving layers."
          realm:
            type: str
            required: true
            description: "The corresponding target uppercase realm block identifier string mapping to the domain suffix."

      kerberos_realms:
        type: list
        elements: dict
        description: "Fallback configuration structs processed by client libraries when live inventory lookups collapse."
        options:
          name:
            type: str
            required: true
            description: "The uppercase name token matching the designated target configuration tracking boundary."
          kdc:
            type: list
            elements: str
            description: "List of active fully qualified host targets acting as live key controllers."
          admin_server:
            type: str
            required: true
            description: "The designated fallback administration engine target mapping address."
