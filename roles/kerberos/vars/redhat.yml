---
kerberos_server_packages:
  - krb5-server
  - krb5-workstation

kerberos_replica_packages:
  - "krb5-server"

kerberos_client_packages:
  - krb5-workstation

kerberos_kdc_service: "krb5kdc"
kerberos_admin_service: "kadmin"
kerberos_kprop_service: "kpropd"

kerberos_os_directory:
  conf: "/etc"
  kdc_conf: "/var/kerberos/krb5kdc"
  log: "/var/log"
  state: "/var/kerberos/krb5kdc"

kerberos_os_stash_name: ".k5.{{ kerberos_realm | upper }}"
