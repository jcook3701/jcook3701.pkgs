---
kerberos_os_user: "root"
kerberos_os_group: "root"

# System-Level Authentication and Identity Management Service Daemons and Permission Groups
kerberos_os_sssd_group: "sssd"
kerberos_os_sssd_service: "sssd"

kerberos_os_nscd_service: "nscd"
kerberos_os_systemd_login_service: "systemd-logind"

# Standalone Protocol Service Daemons and Security Permission Groups
kerberos_os_ldap_group: "ldap"
kerberos_os_ldap_service: "dirsrv"
kerberos_os_samba_group: "root"
kerberos_os_samba_services: ["smb", "nmb"]
kerberos_os_nfs_group: "root"
kerberos_os_nfs_service: "rpc-gssd"
kerberos_os_http_group: "nginx"
kerberos_os_http_service: "nginx"

# Native DNF Package Implementations (Unified MIT Kerberos Ecosystem)
kerberos_os_server_pkgs:
  - krb5-server
  - krb5-workstation
kerberos_os_replica_pkgs:
  - krb5-server
  - krb5-workstation
kerberos_os_client_pkgs:
  - krb5-workstation

# Python Context Extensions (RHEL Linux Native naming schema)
kerberos_os_shared_libs:
  - krb5-libs
  - python3-kerberos
  - python3-gssapi
  - python3-passlib
  - python3-cryptography
  - python3-pycryptodome

# Core Systemd Service Daemons
kerberos_kdc_service: "krb5kdc"
kerberos_admin_service: "kadmin"
kerberos_kprop_service: "kpropd"

# Filesystem Directory Layout Structural Specifications
kerberos_os_directory:
  conf: "/etc"
  kdc_conf: "/var/kerberos/krb5kdc"
  log: "/var/log"
  state: "/var/kerberos/krb5kdc"
  systemd: "/etc/systemd/system"
  dict: "/usr/share/dict"
  defaults: "/etc/sysconfig/"

# Local System Runtime Configuration Parameters
kerberos_os_stash_name: ".k5.{{ kerberos_realm | upper }}"
kerberos_os_admin_defaults_name: "kadmind"
kerberos_os_admin_regexp: '^KADMIND_ARGS='
kerberos_os_admin_line: 'KADMIND_ARGS="-N"'
