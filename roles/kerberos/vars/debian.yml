---
kerberos_os_user: "krb5kdc"
kerberos_os_group: "krb5kdc"

# System-Level Authentication and Identity Management Service Daemons and Permission Groups
kerberos_os_sssd_group: "sssd"
kerberos_os_sssd_service: "sssd"

kerberos_os_nscd_service: "nscd"
kerberos_os_systemd_login_service: "systemd-logind"

# Standalone Protocol Service Daemons and Security Permission Groups
kerberos_os_ldap_group: "openldap"
kerberos_os_ldap_service: "slapd"
kerberos_os_samba_group: "sambashare"
kerberos_os_samba_services: ["smbd", nmbd]
kerberos_os_nfs_group: "root"
kerberos_os_nfs_service: "rpc-gssd"
kerberos_os_http_group: "www-data"
kerberos_os_http_service: "nginx"

# Core Systemd Service Daemons
kerberos_os_kdc_service: "krb5-kdc"
kerberos_os_admin_service: "krb5-admin-server"
kerberos_os_kprop_service: "krb5-kpropd"

# Native APT Package Implementations (Unified MIT Kerberos Ecosystem)
kerberos_os_server_pkgs:
  - krb5-kdc
  - krb5-admin-server
kerberos_os_replica_pkgs:
  - krb5-kdc
  - krb5-kpropd
kerberos_os_client_pkgs:
  - krb5-user

# Python Context Extensions (Debian Linux Native naming schema)
kerberos_os_shared_libs:
  - libkrb5-dev
  - libkrb5-3
  - python3-kerberos
  - python3-gssapi
  - python3-passlib
  - python3-cryptography
  - python3-pycryptodome

# Filesystem Directory Layout Structural Specifications
kerberos_os_directory:
  conf: "/etc"
  conf_d: "/etc/krb5.conf.d"
  kdc_conf: "/etc/krb5kdc"
  log: "/var/log/krb5"
  state: "/var/lib/krb5kdc"
  systemd: "/etc/systemd/system"
  dict: "/usr/share/dict"
  defaults: "/etc/default"

# Local System Runtime Configuration Parameters
kerberos_os_stash_name: "stash"
kerberos_os_admin_defaults_name: "krb5-admin-server"
kerberos_os_admin_regexp: "^DAEMON_ARGS="
kerberos_os_admin_line: 'DAEMON_ARGS="-N"'
