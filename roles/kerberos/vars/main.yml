---
kerberos_pkgs: >-
  {{
    (kerberos_is_server | bool) |
    ternary(kerberos_server_pkgs + kerberos_client_pkgs, kerberos_client_pkgs)
  }}

kerberos_directory:
  conf: "/etc/sssd"
  log: "/var/log/"
