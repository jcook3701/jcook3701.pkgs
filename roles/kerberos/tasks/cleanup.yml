---
- name: Clean up temporary transit files from all system nodes
  ansible.builtin.file:
    path: "{{ tmp_file }}"
    state: absent
  vars:
    tmp_file: "/tmp/{{ replica_fqdn }}.keytab"
  loop: "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: replica_fqdn
    label: "removed -> {{ tmp_file }}"

- name: Clean up the master staging directory
  ansible.builtin.file:
    path: "{{ tmp_file }}"
    state: absent
  vars:
    tmp_file: "{{ kerberos_directory.kdc_conf }}/{{ replica_fqdn }}.transit.keytab"
  loop: "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: replica_fqdn
    label: "removed -> {{ tmp_file }}"
  when: kerberos_node_type == 'master'

- name: Clean up the replica staging directory
  ansible.builtin.file:
    path: "{{ tmp_file }}"
    state: absent
  vars:
    replica_fqdn: "{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    tmp_file: "{{ kerberos_directory.kdc_conf }}/{{ replica_fqdn }}.keytab"
  when: kerberos_node_type == 'replica'

- name: Clean up local controller staging cache
  ansible.builtin.file:
    path: "{{ tmp_file }}"
    state: absent
  vars:
    tmp_file: "/tmp/ansible_transit_{{ replica_fqdn }}.keytab"
  loop: "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: replica_fqdn
    label: "removed -> {{ tmp_file }}"
  delegate_to: localhost
  run_once: true
  become: false

- name: Erase temporary local controllers cached stash file
  ansible.builtin.file:
    path: "/tmp/kerberos_stash_file"
    state: absent
  delegate_to: localhost
  run_once: true
