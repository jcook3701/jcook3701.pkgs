---
- name: Load Kerberos OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Gather target host package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Validate Kerberos Role Variables
  ansible.builtin.include_tasks: validate.yml

- name: Install Kerberos
  ansible.builtin.include_tasks: install.yml
  when:
    - kerberos_state | default('present') == 'present'
    - kerberos_pkg_names[0] not in ansible_facts.packages

- name: Uninstall Kerberos
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - kerberos_state | default('present') == 'absent'
    - kerberos_pkg_names[0] in ansible_facts.packages

- name: Teardown Kerberos
  ansible.builtin.include_tasks: teardown.yml
  when:
    - kerberos_state | default('present') == 'teardown'
