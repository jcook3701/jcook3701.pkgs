---
- name: Install Kerberos packages
  ansible.builtin.package:
    name: "{{ kerberos_pkgs }}"
    state: present

- name: Deploy namespaced Kerberos configuration file
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Kerberos Server Services

- name: Check if Kerberos principal database exists
  ansible.builtin.stat:
    path: /var/lib/krb5kdc/principal
  register: kdc_db_stat
  when: kerberos_node_type == 'admin_master'

- name: Create initial Kerberos Realm Database (Master Only)
  ansible.builtin.command: >
    kdb5_util create -s -P {{ kerberos_master_password | default('SecretPassword123') }}
  when:
    - kerberos_node_type == 'admin_master'
    - not kdc_db_stat.stat.exists

- name: Ensure Kerberos service is started and enable
  ansible.builtin.systemd:
    name: "{{ service }}"
    state: started
    enabled: true
  loop: "{{ kerberos_services }}"
  loop_control:
    loop_var: service
