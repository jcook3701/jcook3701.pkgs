---
- name: Install Kerberos packages
  ansible.builtin.package:
    name: "{{ kerberos_pkgs }}"
    state: present

- name: Deploy namespaced Kerberos configuration file
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Kerberos Server Services

- name: Ensure Kerberos service is started and enable
  ansible.builtin.systemd:
    name: "{{ service }}"
    state: started
    enabled: true
  loop: "{{ kerberos_services }}"
  loop_control:
    loop_var: service
  when: kerberos_is_server | bool
