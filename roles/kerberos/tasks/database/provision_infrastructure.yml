---
# ====================================================================
# MASTER INFRASTRUCTURE PROVISIONING BLOCKS
# ====================================================================
- name: Check if host/kiprop keys already exist in master system keytab
  ansible.builtin.command: "klist -k {{ kerberos_file.keytab }}"
  register: system_kt_check
  changed_when: false
  failed_when: false
  when: kerberos_node_type == 'master'

- name: Ensure Master KDC has its own kiprop principal and keys
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    master_sync_principal: "kiprop/{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    command: "kadmin.local -q 'addprinc -randkey {{ master_sync_principal }}'"
  register: master_princ_cmd
  failed_when: >-
    master_princ_cmd.rc != 0 or
    ('add_principal:' in master_princ_cmd.stderr | lower and
    'already exists' not in master_princ_cmd.stderr | lower)
  when:
    - kerberos_node_type == 'master'
    - "'kiprop/' not in system_kt_check.stdout"

- name: Ensure Master KDC has its own host principal and keys
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    master_host_principal: "host/{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    command: "kadmin.local -q 'addprinc -randkey {{ master_host_principal }}'"
  register: master_host_create_cmd
  changed_when: "'principal already exists' not in master_host_create_cmd.stderr | lower"
  failed_when: >-
    master_host_create_cmd.rc != 0 or
    ('add_principal:' in master_host_create_cmd.stderr | lower and
    'already exists' not in master_host_create_cmd.stderr | lower)
  when:
    - kerberos_node_type == 'master'
    - "'host/' not in system_kt_check.stdout"

- name: Extract Master kiprop keys into system keytab
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    master_sync_principal: "kiprop/{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    command: "kadmin.local -q 'ktadd -k {{ kerberos_file.keytab }} {{ master_sync_principal }}'"
  register: master_key_cmd
  failed_when: >-
    master_key_cmd.rc != 0 or
    ('ktadd:' in master_key_cmd.stderr | lower and
    'already exists' not in master_key_cmd.stderr | lower)
  when:
    - kerberos_node_type == 'master'
    - "'kiprop/' not in system_kt_check.stdout"

- name: Extract Master host keys into system keytab for outbound authentication
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    master_host_principal: "host/{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    command: "kadmin.local -q 'ktadd -k {{ kerberos_file.keytab }} {{ master_host_principal }}'"
  register: master_host_cmd
  failed_when: >-
    master_host_cmd.rc != 0 or
    "does not exist" in master_host_cmd.stderr | lower or
    ('ktadd:' in master_host_cmd.stderr | lower and
    'already exists' not in master_host_cmd.stderr | lower)
  when:
    - kerberos_node_type == 'master'
    - "'host/' not in system_kt_check.stdout"

- name: Create replica principals in master database
  ansible.builtin.command:
    cmd: "{{ command }}"
  loop: "{{ kerberos_replica_servers | unique | product(['host', 'kiprop']) | list }}"
  loop_control:
    loop_var: princ_pair
    label: "{{ command }}"
  register: replica_princ_cmd
  vars:
    task_result: "{{ replica_princ_cmd.results[-1] if replica_princ_cmd.results is defined else none }}"
    command: kadmin.local -q 'addprinc -randkey {{ princ_pair.1 }}/{{ princ_pair.0 }}'
  failed_when: >-
    task_result is not none and (
    task_result.rc != 0 or
    ('add_principal:' in task_result.stderr | lower and
    'already exists' not in task_result.stderr | lower))
  when:
    - kerberos_node_type == 'master'
    - kerberos_replica_servers | length > 0

- name: Export replica credentials to local transit files on master
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    transit_file: "{{ kerberos_directory.kdc_conf }}/{{ replica_fqdn }}.transit.keytab"
    replica_host_principal: "host/{{ replica_fqdn }}"
    replica_sync_principal: "kiprop/{{ replica_fqdn }}"
    ktadd_query: "{{ replica_host_principal }} {{ replica_sync_principal }}"
    command: kadmin.local -q 'ktadd -k {{ transit_file }} {{ ktadd_query }}'
  loop: "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: replica_fqdn
    label: "cmd -> {{ command }}"
  register: export_cmd
  failed_when: >-
    export_cmd.rc != 0 or
    'error' in export_cmd.stderr | lower or
    'failed' in export_cmd.stderr | lower or
    'does not exist' in export_cmd.stdout | lower
  when:
    - kerberos_node_type == 'master'
    - kerberos_replica_servers | length > 0

- name: Fetch the temporary replica keytab back to the Ansible controller
  ansible.builtin.fetch:
    src: "{{ transit_file }}"
    dest: "{{ tmp_file }}"
    flat: true
  vars:
    transit_file: "{{ kerberos_directory.kdc_conf }}/{{ transit_fqdn }}.transit.keytab"
    tmp_file: "/tmp/ansible_transit_{{ transit_fqdn }}.keytab"
  loop: "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: transit_fqdn
    label: "{{ transit_file }} -> {{ tmp_file }}"
  when:
    - kerberos_node_type == 'master'
    - kerberos_replica_servers | length > 0

- name: Ensure targeted system client host principals exist in master database
  ansible.builtin.command:
    cmd: "kadmin.local -q 'addprinc -randkey host/{{ client_fqdn }}'"
  loop: "{{ kerberos_client_nodes | default([]) }}"
  loop_control:
    loop_var: client_fqdn
    label: "Creating Client Principal -> host/{{ client_fqdn }}"
  register: client_princ_create
  changed_when: "'already exists' not in client_princ_create.stderr | lower"
  failed_when: >
    client_princ_create.rc != 0 and
    'already exists' not in client_princ_create.stderr | lower
  when:
    - kerberos_node_type == 'master'
    - kerberos_client_auto_register_host | bool

- name: Export unique client transit credentials on master disk space
  ansible.builtin.command:
    cmd: "kadmin.local -q 'ktadd -k {{ kerberos_directory.kdc_conf }}/{{ client_fqdn }}.client.keytab host/{{ client_fqdn }}'"
  loop: "{{ kerberos_client_nodes | default([]) }}"
  loop_control:
    loop_var: client_fqdn
    label: "Exporting Client Keytab -> {{ client_fqdn }}.client.keytab"
  args:
    creates: "{{ kerberos_directory.kdc_conf }}/{{ client_fqdn }}.client.keytab"
  when:
    - kerberos_node_type == 'master'
    - kerberos_client_auto_register_host | bool

- name: Fetch unique client transit keytab files to controller staging cache
  ansible.builtin.fetch:
    src: "{{ kerberos_directory.kdc_conf }}/{{ client_fqdn }}.client.keytab"
    dest: "/tmp/ansible_client_{{ client_fqdn }}.keytab"
    flat: true
  loop: "{{ kerberos_client_nodes | default([]) }}"
  loop_control:
    loop_var: client_fqdn
    label: "Staging client keytab -> /tmp/ansible_client_{{ client_fqdn }}.keytab"
  when:
    - kerberos_node_type == 'master'
    - kerberos_client_auto_register_host | bool

- name: Purge temporary client staging files off master disk footprint
  ansible.builtin.file:
    path: "{{ kerberos_directory.kdc_conf }}/{{ client_fqdn }}.client.keytab"
    state: absent
  loop: "{{ kerberos_client_nodes | default([]) }}"
  loop_control:
    loop_var: client_fqdn
    label: "Wiping master transit cache -> {{ client_fqdn }}.client.keytab"
  failed_when: false
  when: kerberos_node_type == 'master'

- name: Ensure Master KDC service is running before propagation
  ansible.builtin.service:
    name: "{{ kerberos_kdc_service }}"
    state: started
  when: kerberos_node_type == 'master'

- name: Ensure Master Administration server is running before propagation
  ansible.builtin.service:
    name: "{{ kerberos_admin_service }}"
    state: started
  when: kerberos_node_type == 'master'

# ====================================================================
# REPLICA INTERACTION AND MASTER DATABASE PROPAGATION BLOCKS
# ====================================================================
- name: Push master stash file to Replicas
  ansible.builtin.copy:
    src: /tmp/kerberos_stash_file
    dest: "{{ kerberos_file.stash }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - kerberos_node_type == 'replica'
    - kerberos_use_stash_file | bool

- name: Securely deliver transit keytab to the targeted replica node
  ansible.builtin.copy:
    src: "{{ tmp_file }}"
    dest: "{{ replica_keytab }}"
    owner: root
    group: root
    mode: "0600"
  vars:
    replica_fqdn: "{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    tmp_file: "/tmp/ansible_transit_{{ replica_fqdn }}.keytab"
    replica_keytab: "{{ kerberos_directory.kdc_conf }}/{{ replica_fqdn }}.keytab"
  when: kerberos_node_type == 'replica'

- name: Check if transit keys are already merged on Replica
  ansible.builtin.command: "klist -k {{ kerberos_file.keytab }}"
  register: replica_kt_check
  changed_when: false
  failed_when: false
  when: kerberos_node_type == 'replica'

- name: Merge transit keys natively into the replica default system keytab
  ansible.builtin.shell:
    cmd: |
      ktutil <<EOF
      read_kt {{ kerberos_file.keytab }}
      read_kt {{ kerberos_directory.kdc_conf }}/{{ ansible_fqdn }}.keytab
      write_kt {{ kerberos_file.keytab }}
      quit
      EOF
  args:
    executable: /bin/bash
  register: read_kt_output
  when:
    - kerberos_node_type == 'replica'
    - "'host/' not in replica_kt_check.stdout"

- name: Ensure Replica update server daemon is active
  ansible.builtin.service:
    name: "{{ kerberos_kprop_service }}"
    state: started
    enabled: true
  when: kerberos_node_type == 'replica'

- name: Dump the master Kerberos database for propagation
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    dump_file: "{{ kerberos_directory.kdc_conf }}/replica_datatrans"
    command: "kdb5_util dump {{ dump_file }}"
  when:
    - kerberos_node_type == 'master'
    - kerberos_replica_servers | length > 0

- name: Propagate the database to the replica nodes
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    dump_file: "{{ kerberos_directory.kdc_conf }}/replica_datatrans"
    command: "kprop -f {{ dump_file }} {{ replica_fqdn }}"
    task_result: "{{ kprop_cmd.results[-1] if kprop_cmd.results is defined else none }}"
  register: kprop_cmd
  loop: "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: replica_fqdn
    label: "Propagating database -> {{ replica_fqdn }}"
  failed_when: >-
    task_result is not none and (
    task_result.rc != 0 or
    'connection refused' in task_result.stderr | lower or
    'cannot contact' in task_result.stderr | lower
    )
  when:
    - kerberos_node_type == 'master'
    - kerberos_replica_servers | length > 0

- name: Ensure Replica KDC server engine is started and enabled
  ansible.builtin.service:
    name: "{{ kerberos_kdc_service }}"
    state: started
    enabled: true
  when: kerberos_node_type == 'replica'
