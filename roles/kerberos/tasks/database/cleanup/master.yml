---
- name: Clean up temporary transit files from all system nodes
  ansible.builtin.file:
    path: "{{ target_client_staging }}"
    state: absent
  vars:
    target_node: "{{ client_fqdn.split('.') | first }}"
    target_client_staging: "{{ kerberos_keytabs.controller_client_staging }}"
  loop: "{{ kerberos_client_nodes | default([]) }}"
  loop_control:
    loop_var: client_fqdn
    label: "Wiping master transit cache -> {{ client_fqdn }}"
  become: true
  when: kerberos_node_type == 'master'

- name: Clean up compiled client staging keytabs off the Master KDC disk
  ansible.builtin.file:
    path: "{{ target_client_staging }}"
    state: absent
  vars:
    target_node: "{{ node_fqdn.split('.') | first }}"
    target_client_staging: "{{ kerberos_keytabs.controller_client_staging }}"
  loop: >-
    {{ (kerberos_replica_servers | default([]))
        + [ansible_hostname + '.' + kerberos_domain_name] }}
  loop_control:
    loop_var: node_fqdn
    label: "Purging master infrastructure staging cache -> {{ node_fqdn }}"
  become: true
  when: kerberos_node_type == 'master'

- name: Clean up the master staging directory
  ansible.builtin.file:
    path: "{{ target_transit_file }}"
    state: absent
  vars:
    target_node: "{{ replica_fqdn.split('.') | first }}"
    target_transit_file: "{{ kerberos_keytabs.master_transit_file }}"
  loop: >-
    {{ kerberos_replica_servers | default([])
        + (kerberos_client_nodes | default([]))
        + [ansible_hostname + '.' + kerberos_domain_name] }}
  loop_control:
    loop_var: replica_fqdn
    label: "Wiping master replica cache -> {{ replica_fqdn }}"
  become: true
  when: kerberos_node_type == 'master'

- name: Clean up secondary replication propagation tracking footprints off the master
  ansible.builtin.file:
    path: "{{ target_path }}"
    state: absent
  vars:
    log_name: "replica_datatrans.{{ replica_fqdn }}.last_prop"
    target_path: "{{ kerberos_directory.kdc_conf }}/{{ log_name }}"
  loop: "{{ kerberos_replica_servers | default([]) }}"
  loop_control:
    loop_var: replica_fqdn
    label: "Wiping master propagation tracking log -> {{ log_name }}"
  become: true
  when: kerberos_node_type == 'master'
