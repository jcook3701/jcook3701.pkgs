---
- name: Master node cleanup tasks
  ansible.builtin.include_tasks: master.yml
  when: kerberos_node_type == 'master'

- name: Replica node cleanup tasks
  ansible.builtin.include_tasks: replica.yml
  when: kerberos_node_type == 'replica'

- name: Local controller (localhost) cleanup tasks
  ansible.builtin.include_tasks: controller.yml
