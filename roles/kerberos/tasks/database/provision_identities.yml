---
- name: Check if the default realm password policy already exists in KDC
  ansible.builtin.command: "kadmin.local -q 'get_policy default_user_policy'"
  register: kadmin_policy_check
  changed_when: false
  failed_when: false
  become: true

- name: Create default realm password policy with inventory constraint metrics
  ansible.builtin.command: >-
    kadmin.local -q "add_policy
    -minlength {{ kerberos_policy_min_length }}
    -minclasses {{ kerberos_policy_min_classes }}
    -history {{ kerberos_policy_history_num }}
    default_user_policy"
  become: true
  when:
    - kadmin_policy_check.stderr is defined
    - "'policy does not exist' in kadmin_policy_check.stderr | lower"

- name: Check if bootstrap user principals already exist in KDC database
  ansible.builtin.command: "kadmin.local -q 'get_principal {{ user.username }}'"
  loop: "{{ kerberos_bootstrap_users | default([]) }}"
  loop_control:
    loop_var: user
    label: "Verifying account presence: {{ user.username }}"
  register: kadmin_user_checks
  changed_when: false
  failed_when: false
  become: true

- name: Seed missing bootstrap user principals into the Kerberos realm database
  ansible.builtin.command: >-
    kadmin.local -q "ank
    -policy default_user_policy
    -pw {{ check_result.user.password }}
    {{ check_result.user.username }}"
  loop: "{{ kadmin_user_checks.results | default([]) }}"
  loop_control:
    loop_var: check_result
    label: "Provisioning account principal: {{ check_result.user.username }}"
  no_log: true
  become: true
  register: identity_seed_cmd
  failed_when:
    - identity_seed_cmd.rc != 0 or
      ('error' in identity_seed_cmd.stderr | lower or
      'failed' in identity_seed_cmd.stderr | lower or
      'does not contain enough character classes' in identity_seed_cmd.stderr | lower or
      'does not contain enough character classes' in identity_seed_cmd.stdout | lower)
  when:
    - check_result.stderr is defined
    - "'principal does not exist' in check_result.stderr | lower"
