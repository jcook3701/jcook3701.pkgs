---
# ====================================================================
# REPLICA INTERACTION AND MASTER DATABASE PROPAGATION BLOCKS
# ====================================================================
- name: Push master stash file to Replicas
  ansible.builtin.copy:
    src: /tmp/kerberos_stash_file
    dest: "{{ kerberos_file.stash }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - kerberos_node_type == 'replica'
    - kerberos_use_stash_file | bool

- name: Securely deliver transit keytab to the targeted replica node
  ansible.builtin.copy:
    src: "{{ tmp_file }}"
    dest: "{{ replica_keytab }}"
    owner: root
    group: root
    mode: "0600"
  vars:
    replica_fqdn: "{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    tmp_file: "/tmp/ansible_transit_{{ replica_fqdn }}.keytab"
    replica_keytab: "{{ kerberos_directory.kdc_conf }}/{{ replica_fqdn }}.keytab"
  when: kerberos_node_type == 'replica'

- name: Check if transit keys are already merged on Replica
  ansible.builtin.command: "klist -k {{ kerberos_file.keytab }}"
  register: replica_kt_check
  changed_when: false
  failed_when: false
  when: kerberos_node_type == 'replica'

- name: Merge transit keys natively into the replica default system keytab
  ansible.builtin.shell:
    cmd: |
      ktutil <<EOF
      read_kt {{ kerberos_file.keytab }}
      read_kt {{ kerberos_directory.kdc_conf }}/{{ ansible_fqdn }}.keytab
      write_kt {{ kerberos_file.keytab }}
      quit
      EOF
  args:
    executable: /bin/bash
  register: read_kt_output
  changed_when: read_kt_output.rc == 0
  failed_when: >-
    (read_kt_output.rc != 0) or
    ('error' in read_kt_output.stderr | lower) or
    ('failed' in read_kt_output.stderr | lower) or
    ('permission denied' in read_kt_output.stderr | lower)
  when:
    - kerberos_node_type == 'replica'
    - "'host/' not in replica_kt_check.stdout"

- name: Ensure Replica update server daemon is active
  ansible.builtin.service:
    name: "{{ kerberos_kprop_service }}"
    state: started
    enabled: true
  when: kerberos_node_type == 'replica'
