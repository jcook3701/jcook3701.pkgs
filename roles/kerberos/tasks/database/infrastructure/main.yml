---
- name: Execute Master KDC Infrastructure Seeding Phase
  ansible.builtin.include_tasks: master/seed.yml
  when: kerberos_node_type == 'master'

- name: Process Master External Node Infrastructure Tasks
  ansible.builtin.include_tasks: master/transit.yml
  when: kerberos_node_type == 'master'

- name: Execute Centralized Application Service Principal Generation Pipelines
  ansible.builtin.include_tasks: "keytabs/main.yml"
  when: kerberos_node_type == 'master'

- name: Execute Replica KDC Database Synchronization Phase
  ansible.builtin.include_tasks: replica/seed.yml
  when: kerberos_node_type == 'replica'

- name: Execute Master KDC Infrastructure Seeding Phase
  ansible.builtin.include_tasks: master/broadcast.yml
  when: kerberos_node_type == 'master'

- name: Execute Replica KDC Database Synchronization Phase
  ansible.builtin.include_tasks: replica/online.yml
  when: kerberos_node_type == 'replica'

- name: Execute Client Node OS Binding Verification Phase
  ansible.builtin.include_tasks: client.yml
  when:
    - kerberos_node_type == 'client'
    - false
