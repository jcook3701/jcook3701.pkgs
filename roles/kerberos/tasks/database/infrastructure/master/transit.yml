---
- name: Check if the transit keytab file already exists for the replica
  ansible.builtin.stat:
    path: "{{ kerberos_keytabs.master_transit_file }}"
  vars:
    target_node: "{{ replica_fqdn.split('.') | first }}"
  loop: "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: replica_fqdn
  register: transit_stat_results

- name: Export replica credentials to local transit files on master
  ansible.builtin.command:
    cmd: "kadmin.local -q 'ktadd -k {{ target_transit_file }} {{ ktadd_query }}'"
  vars:
    target_node: "{{ replica_fqdn.split('.') | first }}"
    target_transit_file: "{{ kerberos_keytabs.master_transit_file }}"
    replica_host_principal: "host/{{ replica_fqdn }}"
    replica_sync_principal: "kiprop/{{ replica_fqdn }}"
    ktadd_query: "{{ replica_host_principal }} {{ replica_sync_principal }}"
  loop: "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: replica_fqdn
    index_var: loop_idx
    label: "Exporting replica transit keytab for {{ replica_fqdn }}"
  register: export_cmd
  changed_when: "'added' in export_cmd.stdout | lower"
  failed_when: >-
    export_cmd.rc != 0 or
    'error' in export_cmd.stderr | lower or
    'failed' in export_cmd.stderr | lower or
    'does not exist' in export_cmd.stdout | lower
  when:
    - kerberos_node_type == 'master'
    - kerberos_replica_servers | length > 0
    - not (transit_stat_results.results[loop_idx].stat.exists)

- name: Fetch the temporary replica keytab back to the Ansible controller
  ansible.builtin.fetch:
    src: "{{ target_transit_file }}"
    dest: "{{ target_tmp_file }}"
    flat: true
  vars:
    target_node: "{{ transit_fqdn.split('.') | first }}"
    target_transit_file: "{{ kerberos_keytabs.master_transit_file }}"
    target_tmp_file: "{{ kerberos_keytabs.controller_transit_staging }}"
  loop: "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: transit_fqdn
    label: "Fetching transit: {{ transit_fqdn }}"
  when:
    - kerberos_node_type == 'master'
    - kerberos_replica_servers | length > 0

- name: Ensure Master KDC service is running before propagation
  ansible.builtin.service:
    name: "{{ kerberos_kdc_service }}"
    state: started
  when: kerberos_node_type == 'master'

- name: Ensure Master Administration server is running before propagation
  ansible.builtin.service:
    name: "{{ kerberos_admin_service }}"
    state: started
  when: kerberos_node_type == 'master'
