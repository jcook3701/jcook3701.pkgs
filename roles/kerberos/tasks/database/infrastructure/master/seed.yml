---
# ====================================================================
# MASTER INFRASTRUCTURE PROVISIONING BLOCKS
# ====================================================================
- name: Check if host/kiprop keys already exist in master system keytab
  ansible.builtin.command: "klist -k {{ kerberos_keytabs.system_default }}"
  register: system_kt_check
  changed_when: false
  failed_when: false
  when: kerberos_node_type == 'master'

- name: Ensure Master KDC has its own kiprop principal and keys
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    master_sync_principal: "kiprop/{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    command: "kadmin.local -q 'addprinc -randkey {{ master_sync_principal }}'"
  register: master_princ_cmd
  changed_when: >-
    'principal' in master_princ_cmd.stdout | lower and
    'created' in master_princ_cmd.stdout | lower
  failed_when: >-
    master_princ_cmd.rc != 0 or
    ('add_principal:' in master_princ_cmd.stderr | lower and
    'already exists' not in master_princ_cmd.stderr | lower)
  when:
    - kerberos_node_type == 'master'
    - "'kiprop/' not in system_kt_check.stdout"

- name: Ensure Master KDC has its own host principal and keys
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    master_host_principal: "host/{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    command: "kadmin.local -q 'addprinc -randkey {{ master_host_principal }}'"
  register: master_host_create_cmd
  changed_when: "'principal' not in master_host_create_cmd.stderr | lower"
  failed_when: >-
    master_host_create_cmd.rc != 0 or
    ('add_principal:' in master_host_create_cmd.stderr | lower and
    'already exists' not in master_host_create_cmd.stderr | lower)
  when:
    - kerberos_node_type == 'master'
    - "'host/' not in system_kt_check.stdout"

- name: Extract Master kiprop keys into system keytab
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    master_sync_principal: "kiprop/{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    command: "kadmin.local -q 'ktadd -k {{ kerberos_keytabs.system_default }} {{ master_sync_principal }}'"
  register: master_key_cmd
  changed_when: "'added' in master_key_cmd.stdout | lower"
  failed_when: >-
    master_key_cmd.rc != 0 or
    ('ktadd:' in master_key_cmd.stderr | lower and
    'already exists' not in master_key_cmd.stderr | lower)
  when:
    - kerberos_node_type == 'master'
    - "'kiprop/' not in system_kt_check.stdout"

- name: Extract Master host keys into system keytab for outbound authentication
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    master_host_principal: "host/{{ ansible_hostname }}.{{ kerberos_domain_name }}"
    command: "kadmin.local -q 'ktadd -k {{ kerberos_keytabs.system_default }} {{ master_host_principal }}'"
  register: master_host_cmd
  changed_when: "'added' in master_host_cmd.stdout | lower"
  failed_when: >-
    master_host_cmd.rc != 0 or
    "does not exist" in master_host_cmd.stderr | lower or
    ('ktadd:' in master_host_cmd.stderr | lower and
    'already exists' not in master_host_cmd.stderr | lower)
  when:
    - kerberos_node_type == 'master'
    - "'host/' not in system_kt_check.stdout"

- name: Create replica principals in master database
  ansible.builtin.command:
    cmd: "{{ command }}"
  loop: "{{ kerberos_replica_servers | unique | product(['host', 'kiprop']) | list }}"
  loop_control:
    loop_var: princ_pair
    label: "Creating replica principal: {{ command }}"
  vars:
    task_result: "{{ replica_princ_cmd.results[-1] if replica_princ_cmd.results is defined else none }}"
    command: kadmin.local -q 'addprinc -randkey {{ princ_pair.1 }}/{{ princ_pair.0 }}'
  register: replica_princ_cmd
  changed_when: >-
    'principal' in replica_princ_cmd.stdout | lower
    and 'created' in replica_princ_cmd.stdout | lower
  failed_when: >-
    replica_princ_cmd.rc != 0 or
    ('add_principal:' in replica_princ_cmd.stderr | lower and
    'already exists' not in replica_princ_cmd.stderr | lower)
  when:
    - kerberos_node_type == 'master'
    - kerberos_replica_servers | length > 0
