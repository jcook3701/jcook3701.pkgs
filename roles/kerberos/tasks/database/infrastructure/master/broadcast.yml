---
- name: Dump the master Kerberos database for incremental propagation distribution
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    dump_file: "{{ kerberos_directory.kdc_conf }}/replica_datatrans"
    command: "kdb5_util dump -b7 {{ dump_file }}"
  register: _master_db_dump
  changed_when: _master_db_dump.rc == 0
  failed_when: >-
    _master_db_dump.rc != 0 or
    'error' in _master_db_dump.stderr | lower or
    'failed' in _master_db_dump.stderr | lower
  when:
    - kerberos_node_type == 'master'
    - kerberos_replica_servers | length > 0

# TODO: Remove after testing:
# It's redundant: Once your keytabs match and kpropd starts successfully,
# the built-in Kerberos engine handles the synchronization natively without
# needing Ansible to shell out to kprop.
- name: Propagate the database to the replica nodes
  ansible.builtin.command:
    cmd: "{{ command }}"
  vars:
    dump_file: "{{ kerberos_directory.kdc_conf }}/replica_datatrans"
    command: "kprop -f {{ dump_file }} {{ replica_fqdn }}"
    task_result: "{{ kprop_cmd.results[-1] if kprop_cmd.results is defined else none }}"
  register: kprop_cmd
  loop: "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: replica_fqdn
    label: "Propagating database -> {{ replica_fqdn }}"
  failed_when: >-
    task_result is not none and (
    task_result.rc != 0 or
    'connection refused' in task_result.stderr | lower or
    'cannot contact' in task_result.stderr | lower
    )
  when:
    - kerberos_node_type == 'master'
    - kerberos_replica_servers | length > 0
    - false
