---
- name: Clean up temporary NFS transit files off the Master KDC disk
  ansible.builtin.file:
    path: "{{ target_transit_file }}"
    state: absent
  vars:
    target_node: "{{ nfs_server_fqdn.split('.') | first }}"
    target_transit_file: "{{ kerberos_keytabs.master_nfs_transit_file }}"
  loop: "{{ kerberos_nfs_file_servers | default([]) }}"
  loop_control:
    loop_var: nfs_server_fqdn
    label: "Purging master NFS transit scratch file -> nfs/{{ nfs_server_fqdn }}"
  become: true
  when: kerberos_node_type == 'master'

- name: Clean up local controller staging NFS keytab cache
  ansible.builtin.file:
    path: "{{ target_controller_nfs }}"
    state: absent
  vars:
    target_node: "{{ nfs_server_fqdn.split('.') | first }}"
    target_controller_nfs: "{{ kerberos_keytabs.controller_nfs_staging }}"
  loop: "{{ kerberos_nfs_file_servers | default([]) }}"
  loop_control:
    loop_var: nfs_server_fqdn
    label: "Purging controller NFS staging file -> nfs/{{ nfs_server_fqdn }}"
  delegate_to: localhost
  become: false

- name: Clean up transient NFS landing pad files off the remote target endpoints
  ansible.builtin.file:
    path: "{{ target_delivered_transit }}"
    state: absent
  vars:
    target_node: "{{ inventory_hostname.split('.') | first }}"
    target_delivered_transit: "{{ kerberos_keytabs.client_nfs_delivered_transit }}"
  become: true
  when: inventory_hostname in (kerberos_nfs_file_servers | default([]))
