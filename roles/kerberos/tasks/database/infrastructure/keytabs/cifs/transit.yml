---
- name: Securely append required CIFS application service keys on the Master KDC
  ansible.builtin.command: >-
    kadmin.local -q "ktadd -k {{ staging_keytab }} {{ service_principal }}"
  vars:
    target_node: "{{ cifs_server_fqdn.split('.') | first }}"
    staging_keytab: "{{ kerberos_keytabs.master_cifs_transit_file }}"
    service_principal: "cifs/{{ cifs_server_fqdn }}"
  loop: "{{ kerberos_samba_file_servers | default([]) }}"
  loop_control:
    loop_var: "cifs_server_fqdn"
    index_var: loop_idx
    label: "Injecting CIFS keys for: {{ cifs_server_fqdn }}"
  register: _samba_key_injection
  changed_when: "'added' in _samba_key_injection.stdout | lower"
  failed_when: >-
    (_samba_key_injection.rc is defined and _samba_key_injection.rc != 0) or
    ('error' in _samba_key_injection.stdout | lower) or
    ('failed' in _samba_key_injection.stdout | lower)
  when:
    - kerberos_samba_file_servers | default([]) | length > 0
    - inventory_hostname in (kerberos_admin_servers | default([]))
    - ('principal does not exist' in
          master_cifs_db_check.results[loop_idx].stderr | lower)
  become: true

- name: Fetch fully compiled CIFS service keytabs back to the Ansible controller
  ansible.builtin.fetch:
    src: "{{ target_client_file }}"
    dest: "{{ target_controller_staging }}"
    flat: true
  vars:
    target_node: "{{ cifs_server_fqdn.split('.') | first }}"
    target_client_file: "{{ kerberos_keytabs.master_cifs_transit_file }}"
    target_controller_staging: "{{ kerberos_keytabs.controller_cifs_staging }}"
  loop: "{{ kerberos_samba_file_servers | default([]) }}"
  loop_control:
    loop_var: cifs_server_fqdn
    label: "Caching completed CIFS passport to controller for: {{ cifs_server_fqdn }}"
  when: kerberos_node_type == 'master'
