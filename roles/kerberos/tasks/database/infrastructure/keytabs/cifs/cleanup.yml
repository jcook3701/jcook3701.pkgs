---
- name: Clean up temporary CIFS transit files off the Master KDC disk
  ansible.builtin.file:
    path: "{{ target_transit_file }}"
    state: absent
  vars:
    target_node: "{{ cifs_server_fqdn.split('.') | first }}"
    target_transit_file: "{{ kerberos_keytabs.master_cifs_transit_file }}"
  loop: "{{ kerberos_samba_file_servers | default([]) }}"
  loop_control:
    loop_var: cifs_server_fqdn
    label: "Purging master CIFS transit scratch file -> cifs/{{ cifs_server_fqdn }}"
  when: kerberos_node_type == 'master'
  become: true

- name: Clean up local controller staging CIFS keytab cache
  ansible.builtin.file:
    path: "{{ target_controller_cifs }}"
    state: absent
  vars:
    target_node: "{{ cifs_server_fqdn.split('.') | first }}"
    target_controller_cifs: "{{ kerberos_keytabs.controller_cifs_staging }}"
  loop: "{{ kerberos_samba_file_servers | default([]) }}"
  loop_control:
    loop_var: cifs_server_fqdn
    label: "Purging controller CIFS staging file -> cifs/{{ cifs_server_fqdn }}"
  delegate_to: localhost
  become: false

- name: Clean up transient CIFS landing pad files off the remote target endpoints
  ansible.builtin.file:
    path: "{{ target_delivered_transit }}"
    state: absent
  vars:
    target_node: "{{ inventory_hostname.split('.') | first }}"
    target_delivered_transit: "{{ kerberos_keytabs.client_cifs_delivered_transit }}"
  become: true
  when: inventory_hostname in (kerberos_samba_file_servers | default([]))
