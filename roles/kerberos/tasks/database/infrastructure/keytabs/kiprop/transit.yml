---
- name: Securely append required replication service keys on the Master KDC
  ansible.builtin.command: >-
    kadmin.local -q "ktadd -k {{ staging_keytab }} {{ service_principal }}"
  vars:
    target_node: "{{ host_node_fqdn.split('.') | first }}"
    staging_keytab: "{{ kerberos_keytabs.master_kiprop_transit_file }}"
    service_principal: "kiprop/{{ host_node_fqdn }}"
  loop: "{{ kerberos_propagation_servers | default([]) }}"
  loop_control:
    loop_var: host_node_fqdn
    index_var: loop_idx
    label: "Injecting replication keys for: {{ host_node_fqdn }}"
  register: _kiprop_key_injection
  changed_when: "'added' in _kiprop_key_injection.stdout | lower"
  failed_when: >-
    (_kiprop_key_injection.rc is defined and _kiprop_key_injection.rc != 0) or
    ('error' in _kiprop_key_injection.stdout | lower) or
    ('failed' in _kiprop_key_injection.stdout | lower)
  when:
    - kerberos_propagation_servers | default([]) | length > 0
    - inventory_hostname in (kerberos_admin_servers | default([]))
    - ('principal does not exist' in
          master_kiprop_db_check.results[loop_idx].stderr | lower)
  become: true

- name: Fetch baseline replication identity keytabs back to the Ansible controller
  ansible.builtin.fetch:
    src: "{{ target_client_file }}"
    dest: "{{ target_controller_staging }}"
    flat: true
  vars:
    target_node: "{{ host_node_fqdn.split('.') | first }}"
    target_client_file: "{{ kerberos_keytabs.master_kiprop_transit_file }}"
    target_controller_staging: "{{ kerberos_keytabs.controller_kiprop_staging }}"
  loop: "{{ kerberos_propagation_servers | default([]) }}"
  loop_control:
    loop_var: host_node_fqdn
    label: "Caching completed replication passport to controller for: {{ host_node_fqdn }}"
  when: kerberos_node_type == 'master'
