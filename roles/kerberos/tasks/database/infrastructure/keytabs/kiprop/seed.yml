---
- name: Verify if replication sync principal records exist inside the live KDC database
  ansible.builtin.command: "kadmin.local -q 'get_principal {{ service_principal }}'"
  vars:
    service_principal: "kiprop/{{ host_node_fqdn }}"
  register: master_kiprop_db_check
  changed_when: false
  failed_when: false
  loop: "{{ kerberos_propagation_servers | default([]) }}"
  loop_control:
    loop_var: host_node_fqdn
    label: "Querying database status for: kiprop/{{ host_node_fqdn }}"
  when:
    - kerberos_propagation_servers | default([]) | length > 0
    - kerberos_node_type == 'master'
    - inventory_hostname in (kerberos_admin_servers | default([]))

- name: Securely initialize missing database replication kiprop records
  ansible.builtin.command: >-
    kadmin.local -q "add_principal -randkey {{ service_principal }}"
  vars:
    service_principal: "kiprop/{{ host_node_fqdn }}"
  loop: "{{ kerberos_propagation_servers | default([]) }}"
  loop_control:
    loop_var: host_node_fqdn
    index_var: loop_idx
    label: "Seeding replication entry for: kiprop/{{ host_node_fqdn }}"
  register: _kiprop_db_seeding
  changed_when: >-
    'principal' in _kiprop_db_seeding.stdout | lower and
    'created' in _kiprop_db_seeding.stdout | lower
  failed_when: >-
    (_kiprop_db_seeding.rc is defined and _kiprop_db_seeding.rc != 0) and
    ('already exists' not in _kiprop_db_seeding.stderr | lower)
  when:
    - kerberos_propagation_servers | default([]) | length > 0
    - inventory_hostname in (kerberos_admin_servers | default([]))
    - ('principal does not exist' in
      master_kiprop_db_check.results[loop_idx].stderr | lower)
  become: true
