---
- name: Verify if LDAP service keys are already present on target endpoint
  ansible.builtin.command: "klist -k {{ kerberos_keytabs.ldap_default }}"
  register: endpoint_ldap_file_check
  changed_when: false
  failed_when: false
  when: inventory_hostname in (kerberos_ldap_servers | default([]))

- name: Check if a staged LDAP keytab file exists on the Ansible Controller
  ansible.builtin.stat:
    path: "{{ target_controller_staging }}"
  vars:
    target_node: "{{ inventory_hostname.split('.') | first }}"
    target_controller_staging: "{{ kerberos_keytabs.controller_ldap_staging }}"
  register: controller_ldap_staging_stat
  delegate_to: localhost
  become: false
  when: inventory_hostname in (kerberos_ldap_servers | default([]))

- name: Securely deliver unique LDAP service keytab file to the target node
  ansible.builtin.copy:
    src: "{{ target_controller_staging }}"
    dest: "{{ kerberos_keytabs.client_ldap_delivered_transit }}"
    owner: root
    group: root
    mode: "0600"
  vars:
    target_node: "{{ inventory_hostname.split('.') | first }}"
    target_controller_staging: "{{ kerberos_keytabs.controller_ldap_staging }}"
  when:
    - inventory_hostname in (kerberos_ldap_servers | default([]))
    - controller_ldap_staging_stat.stat.exists | default(false)
    - ('ldap/' not in endpoint_ldap_file_check.stdout | lower)

- name: Securely activate client standalone LDAP keytab file from landing pad
  ansible.builtin.copy:
    src: "{{ kerberos_keytabs.client_ldap_delivered_transit }}"
    dest: "{{ kerberos_keytabs.ldap_default }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  become: true
  when:
    - inventory_hostname in (kerberos_ldap_servers | default([]))
    - ('ldap/' not in endpoint_ldap_file_check.stdout | lower)
