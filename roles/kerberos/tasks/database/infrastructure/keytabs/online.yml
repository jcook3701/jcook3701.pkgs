---
- name: Execute Enterprise CIFS File Sharing Service Activation Pipeline
  ansible.builtin.include_tasks: cifs/online.yml
  when:
    - kerberos_samba_file_servers | default([]) | length > 0

- name: Execute Enterprise NFS Secure UNIX Storage Service Activation Pipeline
  ansible.builtin.include_tasks: nfs/online.yml
  when:
    - kerberos_nfs_file_servers | default([]) | length > 0

- name: Execute Enterprise HTTP Single Sign-On Service Activation Pipeline
  ansible.builtin.include_tasks: http/online.yml
  when:
    - kerberos_http_servers | default([]) | length > 0

- name: Execute Enterprise LDAP Secure Directory Service Activation Pipeline
  ansible.builtin.include_tasks: ldap/online.yml
  when:
    - kerberos_ldap_servers | default([]) | length > 0
