---
- name: Verify if HTTP service principal records exist inside the live KDC database
  ansible.builtin.command: "kadmin.local -q 'get_principal {{ service_principal }}'"
  vars:
    service_principal: "HTTP/{{ http_server_fqdn }}"
  register: master_http_db_check
  changed_when: false
  failed_when: false
  loop: "{{ kerberos_http_servers | default([]) }}"
  loop_control:
    loop_var: http_server_fqdn
    label: "Querying database status for: HTTP/{{ http_server_fqdn }}"
  when:
    - kerberos_http_servers | default([]) | length > 0
    - kerberos_node_type == 'master'
    - inventory_hostname in (kerberos_admin_servers | default([]))

- name: Securely initialize missing HTTP service records in the KDC database
  ansible.builtin.command: >-
    kadmin.local -q "add_principal -randkey {{ service_principal }}"
  vars:
    service_principal: "HTTP/{{ http_server_fqdn }}"
  loop: "{{ kerberos_http_servers }}"
  loop_control:
    loop_var: http_server_fqdn
    index_var: loop_idx
    label: "Seeding database entry for: HTTP/{{ http_server_fqdn }}"
  register: _http_db_seeding
  changed_when: >-
    'principal' in _http_db_seeding.stdout | lower and
    'created' in _http_db_seeding.stdout | lower
  failed_when: >-
    (_http_db_seeding.rc is defined and _http_db_seeding.rc != 0) and
    ('already exists' not in _http_db_seeding.stderr | lower)
  when:
    - kerberos_http_servers | default([]) | length > 0
    - inventory_hostname in (kerberos_admin_servers | default([]))
    - ('principal does not exist' in
        master_http_db_check.results[loop_idx].stderr | lower)
  become: true
