---
- name: Verify if foundational Host OS principal records exist inside the live KDC database
  ansible.builtin.command: "kadmin.local -q 'get_principal {{ service_principal }}'"
  vars:
    service_principal: "host/{{ host_node_fqdn }}"
  register: master_hosts_db_check
  changed_when: false
  failed_when: false
  loop: "{{ kerberos_all_nodes | default([]) }}"
  loop_control:
    loop_var: host_node_fqdn
    label: "Querying database status for: host/{{ host_node_fqdn }}"
  when:
    - kerberos_all_nodes | default([]) | length > 0
    - kerberos_node_type == 'master'
    - inventory_hostname in (kerberos_admin_servers | default([]))

- name: Securely initialize missing Host service records in the KDC database
  ansible.builtin.command: >-
    kadmin.local -q "add_principal -randkey {{ service_principal }}"
  vars:
    service_principal: "host/{{ host_node_fqdn }}"
  loop: "{{ kerberos_all_nodes | default([]) }}"
  loop_control:
    loop_var: host_node_fqdn
    index_var: loop_idx
    label: "Seeding database entry for: host/{{ host_node_fqdn }}"
  register: _host_db_seeding
  changed_when: >-
    'principal' in _host_db_seeding.stdout | lower and
    'created' in _host_db_seeding.stdout | lower
  failed_when: >-
    (_host_db_seeding.rc is defined and _host_db_seeding.rc != 0) and
    ('already exists' not in _host_db_seeding.stderr | lower)
  when:
    - kerberos_all_nodes | default([]) | length > 0
    - inventory_hostname in (kerberos_admin_servers | default([]))
    - ('principal does not exist' in
        master_hosts_db_check.results[loop_idx].stderr | lower)
  become: true
