---
- name: Securely initialize missing Host service records in the KDC database
  ansible.builtin.command: >-
    kadmin.local -q "add_principal -randkey {{ service_principal }}"
  vars:
    service_principal: "host/{{ host_node_fqdn }}"
  loop: "{{ kerberos_client_nodes }}"
  loop_control:
    loop_var: host_node_fqdn
    label: "Seeding database entry for: host/{{ host_node_fqdn }}"
  register: _host_db_seeding
  failed_when: >-
    (_host_db_seeding.rc != 0) and
    ('already exists' not in _host_db_seeding.stderr | lower)
  when:
    - inventory_hostname in kerberos_admin_servers
  become: true

- name: Securely append required Host service keys on the Master KDC
  ansible.builtin.command: >-
    kadmin.local -q "ktadd -k {{ staging_keytab }} {{ service_principal }}"
  vars:
    staging_keytab: "/tmp/ansible_client_{{ host_node_fqdn }}.keytab"
    service_principal: "host/{{ host_node_fqdn }}"
  loop: "{{ kerberos_client_nodes }}"
  loop_control:
    loop_var: host_node_fqdn
    label: "Injecting host keys for: {{ host_node_fqdn }}"
  when:
    - inventory_hostname in kerberos_admin_servers
  become: true
