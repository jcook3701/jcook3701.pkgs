---
# ====================================================================
# PHASE 1: Create backend files, stash parameters, and administrative rules
# ====================================================================
- name: Execute Master KDC core principal database initialization pass
  ansible.builtin.include_tasks: create.yml
  when: kerberos_node_type == 'master'

# ====================================================================
# PHASE 2: Seed machine-level identities and process cross-node propagation
# ====================================================================
- name: Execute cluster infrastructure principal provisioning and synchronization
  ansible.builtin.include_tasks: infrastructure/bringup.yml

# ====================================================================
# PHASE 3: Seed core human user account principals natively
# ====================================================================
- name: Execute source of truth identity principal seeding routines
  ansible.builtin.include_tasks: identities/main.yml
  when: kerberos_node_type == 'master'

# ====================================================================
# PHASE 4: SYSTEM DELIVERY PASS (Propagate Compiled Keytab Payloads)
# ====================================================================
# - name: Execute unconditional global system keytab delivery passes
#  ansible.builtin.include_tasks: infrastructure/keytabs/deploy.yml

# ====================================================================
# PHASE 5: SECURE TRANSACTION HOUSEKEEPING CLEANUP
# ====================================================================
- name: Execute post-deployment temporary database transit file purge
  ansible.builtin.include_tasks: infrastructure/cleanup.yml

# ====================================================================
# PHASE 6: SECURE APPLICATION SERVICE DAEMON ACTIVATION
# ====================================================================
- name: Execute global standalone application service engine reloads
  ansible.builtin.include_tasks: infrastructure/keytabs/online.yml
