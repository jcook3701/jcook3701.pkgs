---
# ====================================================================
# MASTER NODE CLEANUP TASKS
# ====================================================================
- name: Clean up temporary transit files from all system nodes
  ansible.builtin.file:
    path: "{{ target_client_staging }}"
    state: absent
  vars:
    target_client_staging: "{{ kerberos_keytabs.controller_client_staging | replace(ansible_hostname, client_fqdn.split('.') | first) }}"
  loop: "{{ kerberos_client_nodes | default([]) }}"
  loop_control:
    loop_var: client_fqdn
    label: "Wiping master transit cache -> {{ client_fqdn }}"
  become: true
  when: kerberos_node_type == 'master'

- name: Clean up the master staging directory
  ansible.builtin.file:
    path: "{{ target_transit_file }}"
    state: absent
  vars:
    target_transit_file: "{{ kerberos_keytabs.master_transit_file | replace(ansible_hostname, replica_fqdn.split('.') | first) }}"
  loop: "{{ kerberos_replica_servers | default([]) }}"
  loop_control:
    loop_var: replica_fqdn
    label: "Wiping master replica cache -> {{ replica_fqdn }}"
  become: true
  when: kerberos_node_type == 'master'

- name: Clean up secondary replication propagation tracking footprints off the master
  ansible.builtin.file:
    path: "{{ target_path }}"
    state: absent
  vars:
    log_name: "replica_datatrans.{{ replica_fqdn }}.last_prop"
    target_path: "{{ kerberos_directory.kdc_conf }}/{{ log_name }}"
  loop: "{{ kerberos_replica_servers | default([]) }}"
  loop_control:
    loop_var: replica_fqdn
    label: "Wiping master propagation tracking log -> {{ log_name }}"
  become: true
  when: kerberos_node_type == 'master'

# ====================================================================
# REPLICA NODE CLEANUP TASKS
# ====================================================================
- name: Clean up the replica staging directory
  ansible.builtin.file:
    path: "{{ kerberos_keytabs.replica_delivered_transit }}"
    state: absent
  become: true
  when: kerberos_node_type == 'replica'

# ====================================================================
# LOCAL CONTROLLER (LOCALHOST) CLEANUP TASKS
# ====================================================================
- name: Clean up local controller staging replica keytab cache
  ansible.builtin.file:
    path: "{{ target_controller_transit }}"
    state: absent
  vars:
    target_controller_transit: "{{ kerberos_keytabs.controller_transit_staging | replace(ansible_hostname, replica_fqdn.split('.') | first) }}"
  loop: "{{ kerberos_replica_servers | default([]) }}"
  loop_control:
    loop_var: replica_fqdn
    label: "Purging controller replica cache -> {{ replica_fqdn }}"
  delegate_to: localhost
  run_once: true
  become: false

- name: Clean up local controller staging client keytab cache
  ansible.builtin.file:
    path: "{{ target_controller_client }}"
    state: absent
  vars:
    target_controller_client: "{{ kerberos_keytabs.controller_client_staging | replace(ansible_hostname, client_fqdn.split('.') | first) }}"
  loop: "{{ kerberos_client_nodes | default([]) }}"
  loop_control:
    loop_var: client_fqdn
    label: "Purging controller client cache -> {{ client_fqdn }}"
  delegate_to: localhost
  run_once: true
  become: false

- name: Erase temporary local controllers cached stash file
  ansible.builtin.file:
    path: "/tmp/kerberos_stash_file"
    state: absent
  delegate_to: localhost
  run_once: true
  become: false
