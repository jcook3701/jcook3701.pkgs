---
- name: Validate kerberos_state variable
  ansible.builtin.assert:
    that:
      - kerberos_state in ['present', 'absent', 'teardown']
    fail_msg: "Invalid state type. Choose present, absent, or teardown."

- name: Validate kerberos_node_type variable
  ansible.builtin.assert:
    that:
      - kerberos_node_type in ['master', 'replica', 'client']
    fail_msg: "Invalid node type. Choose master, replica, or client."

- name: Verify kerberos_domain_name is defined
  ansible.builtin.assert:
    that: kerberos_domain_name | length > 0
    fail_msg: "kerberos_domain_name cannot be empty. Please specify your Kerberos network domain."

- name: Verify kerberos_realm is defined
  ansible.builtin.assert:
    that: kerberos_realm | length > 0
    fail_msg: "kerberos_realm cannot be empty. Please specify your Kerberos realm name."

- name: Verify kerberos_admin_user is defined
  ansible.builtin.assert:
    that: kerberos_admin_user | length > 0
    fail_msg: "kerberos_admin_user cannot be empty. Please set an administrative principal username."

- name: Verify kerberos_admin_password is defined
  ansible.builtin.assert:
    that:
      - kerberos_admin_password | length > 0
      - kerberos_admin_password != 'SecretPassword123'
    fail_msg: "kerberos_admin_password cannot be empty. Please set an administrative principal password."
