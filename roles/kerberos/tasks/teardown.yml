---
# ====================================================================
# PHASE 1: COMPONENT REMOVAL & INFRASTRUCTURE UNINSTALL
# ====================================================================
- name: Stop Kerberos Services and Uninstall
  ansible.builtin.include_tasks: uninstall.yml

- name: Force deep purge of Kerberos packages and configuration database from the OS
  ansible.builtin.apt:
    name: "{{ kerberos_pkg_names }}"
    state: absent
    purge: true
    autoremove: true
  become: true
  when: ansible_facts['os_family'] == 'Debian'

# ====================================================================
# PHASE 2: PRIVILEGED FILER STATE PURGING
# ====================================================================
- name: Purge physical database backends and synchronization logs
  ansible.builtin.file:
    path: "{{ db_file }}"
    state: absent
  loop:
    - "{{ kerberos_file.principal }}"
    - "{{ kerberos_file.principal }}.db"
    - "{{ kerberos_file.principal }}.ok"
    - "{{ kerberos_file.principal }}.kadm5"
    - "{{ kerberos_file.principal }}.kadm5.lock"
    - "{{ kerberos_file.principal_ulog }}"
    - "{{ kerberos_file.replica_ulog }}"
    - "{{ kerberos_file.unlimited_ulog }}"
    - "{{ kerberos_directory.kdc_conf }}/replica_datatrans"
    - "{{ kerberos_directory.kdc_conf }}/replica_datatrans.dump_ok"
    - "{{ kerberos_directory.kdc_conf }}/replica_datatrans.{{ ansible_hostname }}.{{ kerberos_domain_name }}.last_prop"
    - "{{ kerberos_directory.kdc_conf }}/replica_datatrans.{{ ansible_fqdn }}.last_prop"
    - "{{ kerberos_directory.kdc_conf }}/{{ ansible_hostname }}.{{ kerberos_domain_name }}.transit.keytab"
    - "{{ kerberos_directory.kdc_conf }}/{{ ansible_hostname }}.{{ kerberos_domain_name }}.keytab"
  loop_control:
    loop_var: db_file
    label: "Purging backend storage asset: {{ db_file }}"
  become: true

- name: Verify if the Kerberos state directory exists on the filesystem
  ansible.builtin.stat:
    path: "{{ kerberos_directory.state }}"
  register: teardown_state_dir_stat
  become: true

- name: Find all contents inside the Kerberos state directory
  ansible.builtin.find:
    paths: "{{ kerberos_directory.state }}"
    recurse: true
    hidden: true
    file_type: any
  register: directory_contents
  become: true
  when: teardown_state_dir_stat.stat.exists

- name: Delete everything inside the directory
  ansible.builtin.file:
    path: "{{ file.path }}"
    state: absent
  loop: "{{ directory_contents.files | default([]) }}"
  loop_control:
    loop_var: file
    label: "Deleted: {{ file.path }}"
  become: true

- name: Delete system identity keytab files
  ansible.builtin.file:
    path: "{{ keytab }}"
    state: absent
  loop:
    - "{{ kerberos_file.keytab }}"
    - "{{ kerberos_file.admin_keytab }}"
    - "{{ kerberos_directory.kdc_conf }}/{{ ansible_hostname }}.{{ kerberos_domain_name }}.keytab"
    - "{{ kerberos_directory.kdc_conf }}/{{ ansible_fqdn }}.keytab"
  loop_control:
    loop_var: keytab
    label: "Wiping identity keytab: {{ keytab }}"
  become: true

- name: Clean out all role-generated configuration matrices
  ansible.builtin.file:
    path: "{{ conf_file }}"
    state: absent
  loop:
    - "{{ kerberos_file.global_config }}"
    - "{{ kerberos_file.kdc_config }}"
    - "{{ kerberos_file.admin_acl }}"
    - "{{ kerberos_file.kprop_acl }}"
    - "{{ kerberos_file.stash }}"
  loop_control:
    loop_var: conf_file
    label: "Wiping text layout file: {{ conf_file }}"
  become: true

- name: Drop custom Systemd storage sandboxing directories (Ubuntu Only)
  ansible.builtin.file:
    path: "{{ kerberos_directory.systemd }}/{{ file_name }}.service.d"
    state: absent
  loop:
    - krb5-kdc
    - krb5-admin-server
    - krb5-kpropd
  loop_control:
    loop_var: file_name
    label: "Removing systemd sandbox path for: {{ file_name }}"
  become: true
  when: ansible_distribution == "Ubuntu"
  notify: Reload systemd daemon
