---
- name: Stop Kerberos Services and Uninstall
  ansible.builtin.include_tasks: uninstall.yml

# TODO: This should be removed.  Handled replica_datatrans separately
- name: Purge physical database backends and synchronization logs
  ansible.builtin.file:
    path: "{{ db_file }}"
    state: absent
  loop:
    - "{{ kerberos_file.principal }}"
    - "{{ kerberos_file.principal }}.db"
    - "{{ kerberos_file.principal }}.ok"
    - "{{ kerberos_file.principal }}.kadm5"
    - "{{ kerberos_file.principal }}.kadm5.lock"
    - "{{ kerberos_file.principal_ulog }}"
    - "{{ kerberos_file.replica_ulog }}"
    - "{{ kerberos_file.unlimited_ulog }}"
    - "{{ kerberos_directory.kdc_conf }}/replica_datatrans"
    - "{{ kerberos_directory.kdc_conf }}/replica_datatrans.dump_ok"
  loop_control:
    loop_var: db_file

- name: Find all contents inside the Kerberos state directory
  ansible.builtin.find:
    paths: "{{ kerberos_directory.state }}"
    recurse: true
    hidden: true
    file_type: any
  register: directory_contents

- name: Delete everything inside the directory
  ansible.builtin.file:
    path: "{{ file.path }}"
    state: absent
  loop: "{{ directory_contents.files }}"
  loop_control:
    loop_var: file
    label: "Deleted: {{ file.path }}"

- name: Delete system identity keytab files
  ansible.builtin.file:
    path: "{{ keytab }}"
    state: absent
  loop:
    - "{{ kerberos_file.keytab }}"
    - "{{ kerberos_file.admin_keytab }}"
  loop_control:
    loop_var: keytab

- name: Clean out all role-generated configuration matrices
  ansible.builtin.file:
    path: "{{ conf_file }}"
    state: absent
  loop:
    - "{{ kerberos_file.global_config }}"
    - "{{ kerberos_file.kdc_config }}"
    - "{{ kerberos_file.admin_acl }}"
    - "{{ kerberos_file.kprop_acl }}"
    - "{{ kerberos_file.stash }}"
  loop_control:
    loop_var: conf_file

- name: Drop custom Systemd storage sandboxing directories (Ubuntu Only)
  ansible.builtin.file:
    path: "{{ kerberos_directory.systemd }}/{{ file_name }}.service.d"
    state: absent
  loop:
    - krb5-kdc
    - krb5-admin-server
    - krb5-kpropd
  loop_control:
    loop_var: file_name
  when: ansible_distribution == "Ubuntu"
  notify: Reload systemd daemon

- name: Erase temporary local controllers transit caches for each kdc
  ansible.builtin.file:
    path: "{{ cache_file }}"
    state: absent
  vars:
    cache_file: "/tmp/ansible_transit_{{ replica_fqdn }}.keytab"
  loop:
    - "{{ kerberos_replica_servers }}"
  loop_control:
    loop_var: replica_fqdn
    label: "removed -> {{ cache_file }}"
  delegate_to: localhost
  run_once: true
  tags:
    -never

- name: Cleanup role generated temporary files
  ansible.builtin.include_tasks: cleanup.yml
