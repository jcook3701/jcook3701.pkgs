---
- name: Deploy global Kerberos configuration file
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: "{{ kerberos_file.global_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Kerberos Services

- name: Deploy KDC configuration
  ansible.builtin.template:
    src: kdc.conf.j2
    dest: "{{ kerberos_file.kdc_config }}"
    owner: root
    group: root
    mode: "0600"
  when: kerberos_node_type in ['master', 'replica']
  notify: Restart Kerberos Services

- name: Deploy administrative ACL rules on Master
  ansible.builtin.template:
    src: kadm5.acl.j2
    dest: "{{ kerberos_file.admin_acl }}"
    owner: root
    group: root
    mode: "0600"
  when: kerberos_node_type == 'master'
  notify: Restart Kerberos Services

- name: Deploy kpropd ACL rules on Replicas
  ansible.builtin.template:
    src: kpropd.acl.j2
    dest: "{{ kerberos_file.kprop_acl }}"
    owner: root
    group: root
    mode: "0600"
  when: kerberos_node_type == 'replica'
  notify: Restart Kerberos Services
