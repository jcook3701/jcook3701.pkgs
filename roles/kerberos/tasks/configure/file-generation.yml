---
- name: Ensure directories needed for configuration
  ansible.builtin.file:
    path: "{{ dir }}"
    state: directory
    group: "root"
    owner: "root"
    mode: "0755"
  loop:
    - "{{ kerberos_directory.log }}"
  loop_control:
    loop_var: dir
    label: "Creating directory: {{ dir }}"

- name: Ensure files needed for Kerberos configuration
  ansible.builtin.copy:
    content: ""
    dest: "{{ file }}"
    force: false
    group: "{{ kerberos_user }}"
    owner: "{{ kerberos_group }}"
    mode: "0660"
  loop:
    - "{{ kerberos_file.default_log }}"
    - "{{ kerberos_file.kdc_log }}"
    - "{{ kerberos_file.admin_log }}"
  loop_control:
    loop_var: file
    label: "Creating file: {{ file }}"

- name: Deploy global Kerberos configuration file
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: "{{ kerberos_file.global_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Kerberos Services

- name: Deploy KDC configuration
  ansible.builtin.template:
    src: kdc.conf.j2
    dest: "{{ kerberos_file.kdc_config }}"
    owner: root
    group: root
    mode: "0600"
  when: kerberos_node_type in ['master', 'replica']
  notify: Restart Kerberos Services

- name: Deploy administrative ACL rules on Master
  ansible.builtin.template:
    src: kadm5.acl.j2
    dest: "{{ kerberos_file.admin_acl }}"
    owner: root
    group: root
    mode: "0600"
  when: kerberos_node_type == 'master'
  notify: Restart Kerberos Services

- name: Deploy kpropd ACL rules on Replicas
  ansible.builtin.template:
    src: kpropd.acl.j2
    dest: "{{ kerberos_file.kprop_acl }}"
    owner: root
    group: root
    mode: "0600"
  when: kerberos_node_type == 'replica'
  notify: Restart Kerberos Services
