---
- name: Restart Kerberos Services
  ansible.builtin.systemd:
    name: "{{ service }}"
    state: restarted
  loop: "{{ kerberos_services }}"
  loop_control:
    loop_var: service

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes
