---
kerberos_state: present

# Cluster Infrastructure Deployment Profile (Options: master, replica, client)
kerberos_node_type: client

# Topology Inventory Mappings (Populated via play inventory definitions)
kerberos_admin_servers: []
kerberos_replica_servers: []
kerberos_client_nodes: []

kerberos_samba_file_servers: []
kerberos_nfs_file_servers: []
kerberos_http_servers: []
kerberos_ldap_servers: []
# ====================================================================
# NETWORK DAEMON PORT BINDING & INTERFACE SECURITY
# ====================================================================
kerberos_port: "88"
kerberos_admin_port: "749"
kerberos_admin_bind_all: "true"

# ====================================================================
# INCREMENTAL REPLICATION (IPROP) CONFIGURATION PARAMETERS
# ====================================================================
kerberos_iprop_enable: "true"
kerberos_iprop_port: "754"
kerberos_iprop_replica_poll: "2m"

# ====================================================================
# ADMINISTRATIVE DIRECTORY FRAMEWORK CREDENTIALS & POLICIES
# ====================================================================
kerberos_admin_user: kadmin
kerberos_admin_password: "SecretPassword123"
kerberos_use_stash_file: true

# Default Password Policy Constraints
kerberos_policy_min_length: 8
kerberos_policy_min_classes: 3
kerberos_policy_history_num: 5

# Domain Naming Structure
kerberos_top_level_domain: "com"
kerberos_second_level_domain: "example"
kerberos_domain_name: "{{ kerberos_second_level_domain }}.{{ kerberos_top_level_domain }}"

# Dynamic Global Security Settings
kerberos_realm: "{{ kerberos_domain_name | upper }}"
kerberos_dns_lookup_realm: "false"
kerberos_dns_lookup_kdc: "false"
kerberos_ticket_lifetime: "24h"
kerberos_renew_lifetime: "7d"
kerberos_forwardable: "true"
kerberos_max_clock_skew: "5m"
kerberos_dns_canonicalize_hostname: "true"
kerberos_rdns: "true"

# ====================================================================
# MODERN CRYPTOGRAPHIC COMPLIANCE LAYOUT PARAMETERS
# ====================================================================
kerberos_encryption_types:
  - "aes256-cts-hmac-sha1-96"
  - "aes128-cts-hmac-sha1-96"

kerberos_permitted_enctypes:
  - "aes256-cts-hmac-sha1-96"
  - "aes128-cts-hmac-sha1-96"

kerberos_default_tgs_enctypes:
  - "aes256-cts-hmac-sha1-96"
  - "aes128-cts-hmac-sha1-96"

kerberos_default_tkt_enctypes:
  - "aes256-cts-hmac-sha1-96"
  - "aes128-cts-hmac-sha1-96"

# ====================================================================
# AUTOMATED HOST IDENTIFY PROVISIONING (CLIENT KEYTABS)
# ====================================================================
kerberos_client_auto_register_host: "true"

# Core Seeding Arrays
kerberos_bootstrap_users:
  - username: "example-admin"
    firstname: "Example"
    lastname: "Admin"
    description: "Primary Infrastructure Administrator Account"
    title: "Systems Architect"
    company: "Example Enterprises"
    mail: "example-admin@example.com"
    uid: 5001
    gid: 5001
    primary_group: "domain admins"
    password: "SamplePassword123!"
    groups: ["Domain Admins", "Domain Users"]
    is_sudoer: true
    login_shell: "/bin/bash"
    home_directory: "/home/example-admin"
    password_must_change: false
    account_disabled: false
    ssh_public_keys: []

# Mapping local domain strings to Kerberos realms
kerberos_domain_realms:
  - domain: ".{{ kerberos_domain_name }}"
    realm: "{{ kerberos_realm }}"
  - domain: "{{ kerberos_domain_name }}"
    realm: "{{ kerberos_realm }}"

# Fallback Structural Definitions utilized when inventory namespaces collapse
kerberos_realms:
  - name: "{{ kerberos_realm }}"
    kdc: "{{ kerberos_admin_servers + kerberos_replica_servers }}"
    admin_server: "{{ kerberos_admin_servers | first | default('kerberos') }}"
