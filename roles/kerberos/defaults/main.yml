---
kerberos_state: present
kerberos_is_server: false
# Node Role Configuration (Options: master, replica, client)
kerberos_node_type: client

kerberos_port: "88"

# Domain Naming Structure
kerberos_top_level_domain: "com"
kerberos_second_level_domain: "example"
kerberos_domain_name: "{{ kerberos_second_level_domain }}.{{ kerberos_top_level_domain }}"

# Dynamic Global Security Settings
kerberos_default_realm: "{{ kerberos_domain_name | upper }}"
kerberos_dns_lookup_realm: "false"
kerberos_dns_lookup_kdc: "false"
kerberos_ticket_lifetime: "24h"
kerberos_renew_lifetime: "7d"
kerberos_forwardable: "true"

# Mapping local domain strings to Kerberos realms
kerberos_domain_realms:
  - domain: "{{ kerberos_domain_name }}"
    realm: "{{ kerberos_default_realm }}"
  - domain: ".{{ kerberos_domain_name }}"
    realm: "{{ kerberos_default_realm }}"

# Fallback defaults if groups['kerberos_servers'] is ever missing from inventory
kerberos_realms:
  - name: "{{ kerberos_default_realm }}"
    kdc: "kerberos.{{ kerberos_domain_name }}"
    admin_server: "kerberos.{{ kerberos_domain_name }}"
