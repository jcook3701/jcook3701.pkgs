---
- name: Collect running user facts
  ansible.builtin.include_role:
    name: jcook3701.utils.general
    tasks_from: sudo_user_facts.yml
  when: sudo_user is not defined

- name: Ensure Sdkman is installed and configured
  ansible.builtin.include_tasks: state/install.yml
  when: sdkman_state | default('present') == 'present'

- name: Ensure Sdkman is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: sdkman_state | default('present') == 'absent'

- name: Ensure Sdkman is uninstalled and configurations are removed
  ansible.builtin.include_tasks: state/teardown.yml
  when: sdkman_state | default('present') == 'teardown'
