---
- name: Resolve SDKMAN account details
  ansible.builtin.getent:
    database: passwd
    key: "{{ sdkman_user.name }}"
    fail_key: true
  become: true

- name: Ensure SDKMAN installation is removed
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[sdkman_user.name][4] }}/.sdkman"
    state: absent
  become: true
