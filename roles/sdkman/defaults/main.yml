---
# -------------------------------------------------------------------------
# Lifecycle & System Access Management
# -------------------------------------------------------------------------
sdkman_state: present
sdkman_debug: false

# Accounts where sdkman will be managed
sdkman_users:
  - name: "{{ ansible_user | default(ansible_user_id) }}"

# -------------------------------------------------------------------------
# Sdkman Package Configuration
# -------------------------------------------------------------------------
sdkman_base_url: https://get.sdkman.io
