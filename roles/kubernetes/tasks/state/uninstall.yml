---
- name: Remove Kubernetes packages through the shared package manager
  ansible.builtin.include_role:
    name: jcook3701.utils.pkg_manager
  vars:
    pkg_manager_pkgs: "{{ kubernetes_pkg_names }}"
    pkg_manager_state: absent
    pkg_manager_remove_level: standard
    pkg_manager_update_cache: false
