---
- name: Load Kubernetes (k8s) OS-specific variables
  ansible.builtin.include_vars: "{{ kubernetes_vars }}"
  with_first_found:
    - "{{ ansible_facts['distribution'] | lower }}.yml"
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: kubernetes_vars
    label: "Loading variables file: {{ kubernetes_vars }}"

- name: Ensure Kubernetes (k8s) packages are installed
  ansible.builtin.include_tasks: state/install.yml
  when: kubernetes_state | default('present') == 'present'

- name: Ensure Kubernetes (k8s) is uninstalled
  ansible.builtin.include_tasks: state/uninstall.yml
  when: kubernetes_state | default('present') == 'absent'

- name: Ensure Kubernetes (k8s) is uninstalled and configurations removed
  ansible.builtin.include_tasks: state/teardown.yml
  when: kubernetes_state | default('present') == 'teardown'
