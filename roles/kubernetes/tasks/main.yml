---
- name: Validate Kubernetes state and platform
  ansible.builtin.assert:
    that:
      - kubernetes_state in ['present', 'absent', 'teardown']
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: "Unsupported Kubernetes lifecycle state or operating system family."

- name: Load Kubernetes OS-specific variables
  ansible.builtin.include_vars: "{{ kubernetes_vars }}"
  with_first_found:
    - "{{ ansible_facts['distribution'] | lower }}.yml"
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  loop_control:
    loop_var: kubernetes_vars

- name: Install and configure Kubernetes
  ansible.builtin.include_tasks: state/install.yml
  when: kubernetes_state == 'present'

- name: Remove Kubernetes packages
  ansible.builtin.include_tasks: state/uninstall.yml
  when: kubernetes_state == 'absent'

- name: Teardown Kubernetes packages and repository
  ansible.builtin.include_tasks: state/teardown.yml
  when: kubernetes_state == 'teardown'
