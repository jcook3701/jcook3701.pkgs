---
- name: Look up target kubeconfig user
  ansible.builtin.getent:
    database: passwd
    key: "{{ kubernetes_kubeconfig_user }}"

- name: Derive target kubeconfig path
  ansible.builtin.set_fact:
    kubernetes_kubeconfig_home: "{{ ansible_facts.getent_passwd[kubernetes_kubeconfig_user][4] }}"
    kubernetes_kubeconfig_dest: >-
      {{ kubernetes_user_kubeconfig_path if kubernetes_user_kubeconfig_path | length > 0 else ansible_facts.getent_passwd[kubernetes_kubeconfig_user][4] ~ '/.kube/config' }}

- name: Ensure target kubeconfig directory exists
  ansible.builtin.file:
    path: "{{ kubernetes_kubeconfig_dest | dirname }}"
    state: directory
    owner: "{{ kubernetes_kubeconfig_user }}"
    group: "{{ ansible_facts.getent_passwd[kubernetes_kubeconfig_user][2] }}"
    mode: "0700"
  become: true

- name: Copy Kubernetes admin credentials to the selected user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubernetes_kubeconfig_dest }}"
    remote_src: true
    owner: "{{ kubernetes_kubeconfig_user }}"
    group: "{{ ansible_facts.getent_passwd[kubernetes_kubeconfig_user][2] }}"
    mode: "0600"
  become: true
  no_log: true
