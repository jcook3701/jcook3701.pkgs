# -------------------------------------------------------------------------
# Cilium Helm Plugin Configuration
# -------------------------------------------------------------------------
kubernetes_cilium_helm_release: "cilium"
kubernetes_cilium_helm_namespace: "kube-system"
kubernetes_cilium_helm_chart: "oci://quay.io/cilium/charts/cilium"
kubernetes_cilium_values:
  ipam:
    mode: kubernetes
  k8s:
    requireIPv4PodCIDR: true
  kubeProxyReplacement: false
  routingMode: tunnel
  tunnelProtocol: vxlan
  operator:
    replicas: 1
