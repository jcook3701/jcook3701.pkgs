---
- name: Load Webmin OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Webmin Repository Setup
  ansible.builtin.include_tasks: repo-configure.yml
  when: webmin_state | default('present') == 'present'

- name: Webmin Install
  ansible.builtin.include_tasks: install.yml
  when: webmin_state | default('present') == 'present'

- name: Webmin Uninstall
  ansible.builtin.include_tasks: uninstall.yml
  when:
    - webmin_state | default('present') == 'absent'
    - webmin_pkg_names[0] in ansible_facts.packages
